[project]
name = "cyrene-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
text-lifecycle = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "uvicorn==0.52.4",
    "grpcio==1.83.0",
    "protobuf==7.36.0",
    "cryptography==50.0.1",
    "duckdb==1.5.5",
    "huggingface-hub==1.29.0",
    "psutil==7.2.2",
    "PyYAML==6.0.3",
    "pytest==9.1.1",
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "ruff==0.16.5",
    "cyrene-artifacts @ git+https://github.com/DoHorizon-AI/Cyrene-Platform.git@a3917fb9e3bcc5c9abf6e2fb6265d08f02dd1e3a#subdirectory=sdk/python/cyrene_artifacts",
    "cyrene-preflight @ git+https://github.com/DoHorizon-AI/Cyrene-Platform.git@a3917fb9e3bcc5c9abf6e2fb6265d08f02dd1e3a#subdirectory=sdk/python/cyrene_preflight",
    "cyrene-plugin-runtime @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@4d6f80f1117ab8f7ba389eb9b9049085335ffe2b#subdirectory=sdk/python/cyrene_plugin_runtime",
    "cyrene-dataset-preparation @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@4d6f80f1117ab8f7ba389eb9b9049085335ffe2b#subdirectory=plugins/tools/dataset-preparation",
    "cyrene-llama-factory @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@4d6f80f1117ab8f7ba389eb9b9049085335ffe2b#subdirectory=plugins/training/llama-factory",
    "cyrene-exact-match-evaluator @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@4d6f80f1117ab8f7ba389eb9b9049085335ffe2b#subdirectory=plugins/evaluation/exact-match",
    "cyrene-hf-model-analyzer @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@4d6f80f1117ab8f7ba389eb9b9049085335ffe2b#subdirectory=plugins/models/hf-model-analyzer",
    "cyrene-compat-rules @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@4d6f80f1117ab8f7ba389eb9b9049085335ffe2b#subdirectory=plugins/policy/compat-rules",
    "cyrene-dataset-validator @ git+https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git@4d6f80f1117ab8f7ba389eb9b9049085335ffe2b#subdirectory=plugins/tools/dataset-validator",
    "mypy==2.3.1",
    "types-pyyaml==6.0.12.20260906",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv]
# The lifecycle harness resolves the direct-Plugin adapters against the same
# gRPC stack the Products test with; the SDK metadata accepts an older range.
override-dependencies = [
  "grpcio==1.83.0",
  "protobuf==7.36.0",
]
