# Workspace Azure is the authority for exact multi-repository acceptance.
# Public repository source checks run in their own GitHub Actions workflows.
name: $(Date:yyyyMMdd)$(Rev:.r)

parameters:
- name: githubServiceConnection
  type: string
  default: DoHorizon-AI
- name: runFullAcceptance
  displayName: 'Provision RTX 4080 Runtime for Independent Full Lifecycle Acceptance'
  type: boolean
  default: false
- name: acceptancePoolName
  displayName: 'Self-Hosted Agent Pool Name'
  type: string
  default: 'Default'
- name: boundaryPlatformRef
  displayName: 'Exact Platform control-plane revision'
  type: string
  default: c44782320db933a5328c8ccf32c4c830563b2cf6
- name: boundaryPluginsRef
  displayName: 'Exact Plugins contract revision'
  type: string
  default: a019cc37cab39ffafe30884a4a0427aaaadf69a9
- name: boundaryAstrbotRef
  displayName: 'Exact AstrBot direct-consumer revision'
  type: string
  default: b3dfb46312f132dce714dc459fec022cdf4f0121

resources:
  repositories:
  - repository: platform
    type: github
    name: DoHorizon-AI/Cyrene-Platform
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: refs/heads/develop
  - repository: catalyst
    type: github
    name: DoHorizon-AI/Cyrene-Catalyst
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: refs/heads/develop
  - repository: yield
    type: github
    name: DoHorizon-AI/Cyrene-Yield
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: refs/heads/develop
  - repository: reactor
    type: github
    name: DoHorizon-AI/Cyrene-Reactor
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: refs/heads/develop
  - repository: exchange
    type: github
    name: DoHorizon-AI/Cyrene-Exchange
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: refs/heads/develop
  - repository: navigator
    type: github
    name: DoHorizon-AI/Cyrene-Navigator
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: refs/heads/develop
  - repository: echo
    type: github
    name: DoHorizon-AI/Cyrene-Echo
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: refs/heads/develop
  - repository: boundaryPlatform
    type: github
    name: DoHorizon-AI/Cyrene-Platform
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: ${{ parameters.boundaryPlatformRef }}
  - repository: boundaryPlugins
    type: github
    name: DoHorizon-AI/Cyrene-Plugins-Official
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: ${{ parameters.boundaryPluginsRef }}
  - repository: boundaryAstrbot
    type: github
    name: DoHorizon-AI/Astrbot-Rev
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: ${{ parameters.boundaryAstrbotRef }}

trigger:
  branches:
    include:
      - main
      - develop
      - feat/*
      - chore/*
      - docs/*

pr:
  branches:
    include:
      - main
      - develop

jobs:
- job: product_contract_profile
  displayName: 'Workspace / Product Contract Integration Profile'
  pool:
    vmImage: 'ubuntu-latest'
  timeoutInMinutes: 15
  steps:
  - checkout: self
    path: s/Cyrene-Workspace
    displayName: 'Checkout Workspace'

  - checkout: platform
    path: s/Cyrene-Platform
    displayName: 'Checkout Platform Artifact SDK'

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Setup Python 3.12'

  - script: |
      python -m pip install --upgrade pip uv==0.12.3
      uvx ruff==0.16.5 check governance/product-contract-v1/tests
      uvx ruff==0.16.5 format --check governance/product-contract-v1/tests
      uvx --from pytest==9.1.1 --with jsonschema==4.26.0 pytest -q governance/product-contract-v1/tests
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Workspace
    displayName: 'Run Governance Product Contract Tests'

  - bash: |
      set -euo pipefail
      python -m pip install --upgrade pip pytest==9.1.1 huggingface-hub==1.29.0
      python -m pip install --no-deps "$(Pipeline.Workspace)/s/Cyrene-Platform/sdk/python/cyrene_artifacts"
      uvx ruff==0.16.5 check scripts/reference-runtime.py scripts/text-lifecycle-v1.py tests/test_reference_runtime.py tests/test_text_lifecycle_runtime.py
      python -m pytest -q tests/test_reference_runtime.py tests/test_text_lifecycle_runtime.py
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Workspace
    displayName: 'Validate reference runtime and Artifact bootstrap client'

  - script: |
      mkdir -p ci/evidence
      cat <<EOT > ci/evidence/summary.json
      {
        "suite": "Cyrene-Workspace-Contract",
        "commit": "$(Build.SourceVersion)",
        "pipeline": "$(Build.DefinitionName)",
        "build_id": "$(Build.BuildId)",
        "result": "SCOPED_WORKSPACE_GATES_COMPLETED",
        "scope": "product_contract_profile",
        "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      }
      EOT
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Workspace
    displayName: 'Generate Evidence Ledger'

  - publish: $(Pipeline.Workspace)/s/Cyrene-Workspace/ci/evidence
    artifact: workspace-evidence
    displayName: 'Publish Workspace Evidence'

- job: direct_plugin_vertical
  displayName: 'Workspace / Direct Product-to-Plugin Vertical'
  dependsOn: product_contract_profile
  pool:
    vmImage: 'ubuntu-latest'
  timeoutInMinutes: 45
  steps:
  - checkout: self
    path: s/Cyrene-Workspace
    clean: true
    displayName: 'Checkout Workspace orchestrator'

  - checkout: boundaryPlatform
    path: s/boundary-platform
    clean: true
    displayName: 'Checkout exact Platform control plane'

  - checkout: boundaryPlugins
    path: s/boundary-plugins
    clean: true
    displayName: 'Checkout exact Plugins contracts'

  - checkout: boundaryAstrbot
    path: s/boundary-astrbot
    clean: true
    displayName: 'Checkout exact AstrBot consumer'

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Use Python 3.12'

  - bash: |
      set -euo pipefail
      test ! -e .github/workflows/phase7-vertical.yml
      if git grep -n -E \
        'PHASE7|configured_binding_server|CYRENE_PHASE7_CES_ENDPOINT|cy-capability-execution-service' \
        -- ci/vertical-e2e; then
        echo 'Retired CES vertical implementation returned to Workspace.' >&2
        exit 1
      fi
      if git grep -n -E 'ArtifactKind\.[A-Z][A-Z0-9_]+' -- '*.py' \
        | grep -v 'ArtifactKind\.GENERIC'; then
        echo 'A closed Product artifact-kind enum returned to Workspace.' >&2
        exit 1
      fi
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Workspace
    displayName: 'Guard the direct Product-to-Plugin boundary'

  - bash: |
      set -euo pipefail
      bash scripts/use_cached_dotnet_sdk.sh "$(Pipeline.Workspace)/s/boundary-astrbot"
    workingDirectory: $(Pipeline.Workspace)/s/boundary-astrbot
    displayName: 'Use available .NET SDK (cache preferred)'

  - bash: |
      set -euo pipefail
      rustup toolchain install stable --profile minimal --no-self-update
      rustup default stable
      python -m pip install --upgrade pip uv==0.12.3
      bash ./ci/vertical-e2e/run.sh
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Workspace
    displayName: 'Run exact-ref direct Plugin acceptance'
    env:
      CYRENE_PLATFORM_ROOT: $(Pipeline.Workspace)/s/boundary-platform
      CYRENE_OFFICIAL_PLUGINS_ROOT: $(Pipeline.Workspace)/s/boundary-plugins
      CYRENE_ASTRBOT_ROOT: $(Pipeline.Workspace)/s/boundary-astrbot
      CYRENE_PLATFORM_REF: ${{ parameters.boundaryPlatformRef }}
      CYRENE_PLUGINS_REF: ${{ parameters.boundaryPluginsRef }}
      CYRENE_ASTRBOT_REF: ${{ parameters.boundaryAstrbotRef }}
      CYRENE_DIRECT_E2E_TMP_PARENT: $(Agent.TempDirectory)/cyrene-direct-plugin

  - publish: $(Agent.TempDirectory)/cyrene-direct-plugin
    artifact: direct-plugin-failure-evidence
    condition: failed()
    displayName: 'Publish retained direct Plugin failure evidence'

- ${{ if eq(parameters.runFullAcceptance, true) }}:
  - job: canonical_linux_gate
    displayName: 'Workspace / RTX 4080 Canonical Runtime Provisioning'
    dependsOn: product_contract_profile
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    pool:
      name: ${{ parameters.acceptancePoolName }}
      demands:
      - cyrene.gpu -equals rtx4080
    timeoutInMinutes: 120
    steps:
    - checkout: self
      path: s/Cyrene-Workspace
      displayName: 'Checkout Workspace'

    - checkout: platform
      path: s/Cyrene-Platform
    - checkout: catalyst
      path: s/Cyrene-Catalyst
    - checkout: yield
      path: s/Cyrene-Yield
    - checkout: reactor
      path: s/Cyrene-Reactor
    - checkout: exchange
      path: s/Cyrene-Exchange
    - checkout: navigator
      path: s/Cyrene-Navigator
    - checkout: echo
      path: s/Cyrene-Echo

    - bash: |
        set -euo pipefail
        case "$(Build.SourceBranch)" in
          refs/heads/develop|refs/heads/main) ;;
          *) echo 'GPU acceptance is restricted to canonical branches.' >&2; exit 1 ;;
        esac
        export CYRENE_PLATFORM_WORKTREE="$(Pipeline.Workspace)/s/Cyrene-Platform"
        export CYRENE_YIELD_WORKTREE="$(Pipeline.Workspace)/s/Cyrene-Yield"
        export CYRENE_REACTOR_WORKTREE="$(Pipeline.Workspace)/s/Cyrene-Reactor"
        export CYRENE_RUNTIME_HOME="$(Agent.TempDirectory)/cyrene-reference-runtime"
        "$(Pipeline.Workspace)/s/Cyrene-Workspace/scripts/reference-runtime" down \
          --runtime-home "$CYRENE_RUNTIME_HOME" >/dev/null || true
        "$(Pipeline.Workspace)/s/Cyrene-Workspace/scripts/reference-runtime" bootstrap \
          --runtime-home "$CYRENE_RUNTIME_HOME"
        "$(Pipeline.Workspace)/s/Cyrene-Workspace/scripts/reference-runtime" status \
          --runtime-home "$CYRENE_RUNTIME_HOME"
      displayName: 'Provision canonical Platform, trainer and Reactor runtime'

    - bash: |
        set -euo pipefail
        export CYRENE_PLATFORM_WORKTREE="$(Pipeline.Workspace)/s/Cyrene-Platform"
        export CYRENE_YIELD_WORKTREE="$(Pipeline.Workspace)/s/Cyrene-Yield"
        export CYRENE_REACTOR_WORKTREE="$(Pipeline.Workspace)/s/Cyrene-Reactor"
        export CYRENE_RUNTIME_HOME="$(Agent.TempDirectory)/cyrene-reference-runtime"
        "$(Pipeline.Workspace)/s/Cyrene-Workspace/scripts/reference-runtime" down \
          --runtime-home "$CYRENE_RUNTIME_HOME"
      condition: always()
      displayName: 'Teardown runtime after validation job'
