version: "1.5.0"
workspace: "Cyrene"
description: "Canonical multi-repository topology, runtime target manifest, and contract pointers for Cyrene developers"

global_policy:
  development_hosts:
    - "windows"
    - "linux"
    - "macos"
  windows_role: "DEVELOPMENT_HOST_ONLY (IDE indexing, rust-analyzer, local diagnostics, Python/DotNet tooling)"
  canonical_runtime_os: "linux"
  canonical_rust_target: "x86_64-unknown-linux-gnu"
  secondary_rust_targets:
    - "aarch64-unknown-linux-gnu"
  python_baseline:
    canonical_dev_version: "3.12"
    declared_compatibility: ">=3.11"
    environment_manager: "uv"
  jvm_baseline:
    jdk_version: 25
    kotlin_version: "2.4.10"
    gradle_version: "9.6.0"
    dsl: "Gradle Kotlin DSL"
  dotnet_baseline:
    sdk_version: "10.0"
    solution_format: ".slnx"
  node_baseline:
    policy: "NONE (no canonical backend execution plane dependency)"
  ci_authority_policy:
    automatic_source_rule: "Exactly one provider owns automatic source and contract checks per repository."
    repository_declaration_rule: "Each repository ci_authority.source is authoritative; visibility alone does not select a provider."
    publication_target_source_authority: "github_actions"
    artifact_build_rule: "GitHub Actions builds the public release payload once on a successful push and publishes an immutable commit-SHA artifact with a manifest and SHA-256 payload digests."
    azure_delivery_rule: "Azure Pipelines CD consumes only the explicitly selected successful GitHub Actions run artifact, verifies repository, conclusion, commit SHA, and manifest digests, then performs delivery or an explicit verified handoff without checkout, build, or test."
    artifact_retention: "GitHub Actions artifacts retain for 30 days; Azure CD requires githubArtifactReadToken with Actions: read access."
    evidence_rule: "Skipped, simulated, credential-blocked, and unrun work must retain those states."
  branch_policy:
    development_branch: "develop (default and intentionally unprotected)"
    main_promotion: "Only green develop is promoted by pull request to protected main."
    release_promotion: "Only a buildable green main is promoted by pull request to protected release."

repositories:
  - name: "Cyrene-Platform"
    path: "../Cyrene-Platform"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Platform.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    default_branch: "develop"
    integration_branch: "develop"
    release_branch: "release"
    ci_authority:
      source: "github_actions"
      delivery: "azure_pipelines"
      automatic_azure_scope: "none"
      azure_scope: "delivery_only"
    build_systems:
      - "cargo"
      - "uv"
    roles:
      - "core-platform"
      - "kernel"
      - "sdk"
    development_hosts: ["windows", "linux", "macos"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container"
    ci_acceptance_environment: "GitHub Actions source, contract, build, and package checks"
    release_artifact_target: "x86_64-unknown-linux-gnu"
    secondary_targets: ["aarch64-unknown-linux-gnu"]
    ide:
      cargo_root: "../Cyrene-Platform/Cargo.toml"
      python_root: "../Cyrene-Platform"
    pointers:
      primary_source_roots:
        - "../Cyrene-Platform/kernel/crates"
        - "../Cyrene-Platform/framework/crates"
        - "../Cyrene-Platform/agents"
        - "../Cyrene-Platform/adapters"
        - "../Cyrene-Platform/sdk/python"
      test_roots:
        - "../Cyrene-Platform/kernel/crates/*/tests"
        - "../Cyrene-Platform/sdk/python/*/tests"
      api_contract_roots:
        - "../Cyrene-Platform/contracts/proto"
        - "../Cyrene-Platform/contracts/rust"
      developer_commands:
        test: "cargo test --workspace ; uv run pytest ; gradle -p tck/model-provider-embedding-contract/jvm test"
        build: "cargo build --locked --workspace --all-targets"

  - name: "Cyrene-Plugins-Official"
    path: "../Cyrene-Plugins-Official"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    default_branch: "develop"
    integration_branch: "develop"
    release_branch: "release"
    ci_authority:
      source: "github_actions"
      delivery: "azure_pipelines"
      automatic_azure_scope: "none"
      azure_scope: "delivery_only"
    build_systems:
      - "uv"
      - "cargo"
      - "dotnet"
      - "maven"
      - "buf"
    roles:
      - "plugin-ecosystem"
      - "conformance-harness"
    development_hosts: ["windows", "linux", "macos"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container / host"
    ci_acceptance_environment: "GitHub Actions source, contract, build, and package checks"
    release_artifact_target: "multi-platform"
    ide:
      python_roots:
        - "../Cyrene-Plugins-Official/contracts/tck/message-connector-v1/python"
        - "../Cyrene-Plugins-Official/contracts/tck/model-provider-v1/python"
        - "../Cyrene-Plugins-Official/sdk/python/cyrene_model_provider_contracts"
        - "../Cyrene-Plugins-Official/sdk/python/cyrene_plugin_runtime"
        - "../Cyrene-Plugins-Official/plugins/connectors/onebot-v11"
        - "../Cyrene-Plugins-Official/plugins/connectors/wecom"
        - "../Cyrene-Plugins-Official/plugins/evaluation/evaluator-pack"
        - "../Cyrene-Plugins-Official/plugins/evaluation/exact-match"
        - "../Cyrene-Plugins-Official/plugins/evaluation/llm-judge"
        - "../Cyrene-Plugins-Official/plugins/models/hf-model-analyzer"
        - "../Cyrene-Plugins-Official/plugins/policy/compat-rules"
        - "../Cyrene-Plugins-Official/plugins/serving/vllm-runtime"
        - "../Cyrene-Plugins-Official/plugins/tools/dataset-preparation"
        - "../Cyrene-Plugins-Official/plugins/tools/dataset-validator"
        - "../Cyrene-Plugins-Official/plugins/training/llama-factory"
      gradle_roots:
        - "../Cyrene-Plugins-Official/contracts/jvm"
        - "../Cyrene-Plugins-Official/contracts/tck/model-provider-v1/jvm"
      maven_root: "../Cyrene-Plugins-Official/sdk/java/pom.xml"
      buf_root: "../Cyrene-Plugins-Official/contracts"
      dotnet_roots:
        - "../Cyrene-Plugins-Official/contracts/dotnet/Cyrene.Plugin.Contracts/Cyrene.Plugin.Contracts.csproj"
        - "../Cyrene-Plugins-Official/contracts/tck/computer-runtime-v1/dotnet/ComputerRuntimeContractTck.csproj"
        - "../Cyrene-Plugins-Official/contracts/tck/message-connector-v1/dotnet/MessageConnectorContractTck.csproj"
        - "../Cyrene-Plugins-Official/contracts/tck/model-provider-v1/dotnet/ModelProviderContractTck.csproj"
        - "../Cyrene-Plugins-Official/runtime/dotnet-native-aot/Cyrene.Provider.Tests/Cyrene.Provider.Tests.csproj"
      rust_manifests:
        - "../Cyrene-Plugins-Official/contracts/rust/cyrene-plugin-contracts/Cargo.toml"
        - "../Cyrene-Plugins-Official/runtime/rust/cyrene-agent-runtime/Cargo.toml"
        - "../Cyrene-Plugins-Official/runtime/rust/cyrene-computer-runtime/Cargo.toml"
        - "../Cyrene-Plugins-Official/runtime/rust/cyrene-mcp-provider/Cargo.toml"
        - "../Cyrene-Plugins-Official/runtime/rust/cyrene-memory-runtime/Cargo.toml"
        - "../Cyrene-Plugins-Official/runtime/rust/cyrene-plugin-cabi/Cargo.toml"
        - "../Cyrene-Plugins-Official/runtime/rust/cyrene-plugin-server/Cargo.toml"
    pointers:
      primary_source_roots:
        - "../Cyrene-Plugins-Official/contracts"
        - "../Cyrene-Plugins-Official/runtime"
        - "../Cyrene-Plugins-Official/sdk"
        - "../Cyrene-Plugins-Official/plugins/connectors/onebot-v11"
        - "../Cyrene-Plugins-Official/plugins/connectors/wecom"
        - "../Cyrene-Plugins-Official/plugins/evaluation/evaluator-pack"
        - "../Cyrene-Plugins-Official/plugins/evaluation/exact-match"
        - "../Cyrene-Plugins-Official/plugins/evaluation/llm-judge"
        - "../Cyrene-Plugins-Official/plugins/models/hf-model-analyzer"
        - "../Cyrene-Plugins-Official/plugins/policy/compat-rules"
        - "../Cyrene-Plugins-Official/plugins/serving/vllm-runtime"
        - "../Cyrene-Plugins-Official/plugins/tools/computer-runtime"
        - "../Cyrene-Plugins-Official/plugins/tools/dataset-preparation"
        - "../Cyrene-Plugins-Official/plugins/tools/dataset-validator"
        - "../Cyrene-Plugins-Official/plugins/training/llama-factory"
        - "../Cyrene-Plugins-Official/plugins/ui/navigator"
        - "../Cyrene-Plugins-Official/manifests"
      test_roots:
        - "../Cyrene-Plugins-Official/contracts/rust/cyrene-plugin-contracts/tests"
        - "../Cyrene-Plugins-Official/contracts/tck"
        - "../Cyrene-Plugins-Official/contracts/tck/model-provider-v1/jvm/src/test"
        - "../Cyrene-Plugins-Official/runtime/rust/*/tests"
        - "../Cyrene-Plugins-Official/runtime/dotnet-native-aot/Cyrene.Provider.Tests"
        - "../Cyrene-Plugins-Official/sdk/python/cyrene_plugin_runtime/tests"
        - "../Cyrene-Plugins-Official/sdk/java/*/src/test"
        - "../Cyrene-Plugins-Official/plugins/connectors/onebot-v11/tests"
        - "../Cyrene-Plugins-Official/plugins/connectors/wecom/tests"
        - "../Cyrene-Plugins-Official/plugins/evaluation/evaluator-pack/tests"
        - "../Cyrene-Plugins-Official/plugins/evaluation/llm-judge/tests"
        - "../Cyrene-Plugins-Official/plugins/serving/vllm-runtime/tests"
        - "../Cyrene-Plugins-Official/plugins/tools/dataset-preparation/tests"
        - "../Cyrene-Plugins-Official/plugins/tools/dataset-validator/tests"
        - "../Cyrene-Plugins-Official/plugins/training/llama-factory/tests"
      developer_commands:
        test: "python3 tools/ci/verify_source_manifest.py --root . --allow-git-metadata"
        build: "Use .github/workflows/public-ci.yml for the complete multi-language build matrix; local entrypoints are listed in Cyrene-Plugins-Official/README.md"

