version: "1.2.0"
workspace: "Cyrene"
description: "Canonical multi-repository topology, runtime target manifest, and contract pointers for Cyrene developers"

global_policy:
  development_hosts:
    - "windows"
    - "linux"
    - "macos"
  windows_role: "DEVELOPMENT_HOST_ONLY (IDE indexing, rust-analyzer, local diagnostics, Python/DotNet tooling)"
  canonical_runtime_os: "linux"
  canonical_rust_target: "x86_64-unknown-linux-gnu"
  secondary_rust_targets:
    - "aarch64-unknown-linux-gnu"
  python_baseline:
    canonical_dev_version: "3.12"
    declared_compatibility: ">=3.11"
    environment_manager: "uv"
  jvm_baseline:
    jdk_version: 25
    kotlin_version: "2.4.10"
    gradle_version: "9.5.0"
    dsl: "Gradle Kotlin DSL"
  dotnet_baseline:
    sdk_version: "10.0"
    solution_format: ".slnx"
  node_baseline:
    policy: "NONE (no canonical backend execution plane dependency)"

repositories:
  - name: "Cyrene-Platform"
    path: "../Cyrene-Platform"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Platform.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    integration_branch: "develop"
    build_systems:
      - "cargo"
      - "uv"
      - "gradle"
    roles:
      - "core-platform"
      - "kernel"
      - "sdk"
    development_hosts: ["windows", "linux", "macos"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container"
    ci_acceptance_environment: "ubuntu-latest (GitHub Actions)"
    release_artifact_target: "x86_64-unknown-linux-gnu"
    secondary_targets: ["aarch64-unknown-linux-gnu"]
    ide:
      cargo_root: "../Cyrene-Platform/Cargo.toml"
      python_root: "../Cyrene-Platform"
      gradle_root: "../Cyrene-Platform/framework/jvm/settings.gradle.kts"
    pointers:
      primary_source_roots:
        - "../Cyrene-Platform/kernel/crates"
        - "../Cyrene-Platform/sdk/python"
        - "../Cyrene-Platform/framework/jvm"
      test_roots:
        - "../Cyrene-Platform/kernel/crates/*/tests"
        - "../Cyrene-Platform/sdk/python/*/tests"
      api_contract_roots:
        - "../Cyrene-Platform/contracts/proto"
        - "../Cyrene-Platform/contracts/rust"
      developer_commands:
        test: "cargo test --workspace ; uv run pytest"
        build: "cargo build ; ./gradlew build"

  - name: "Cyrene-Plugins-Official"
    path: "../Cyrene-Plugins-Official"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git"
    visibility: "private"
    clone_policy: "public_zero_auth"
    integration_branch: "develop"
    build_systems:
      - "uv"
      - "dotnet"
      - "gradle"
    roles:
      - "plugin-ecosystem"
      - "conformance-harness"
    development_hosts: ["windows", "linux", "macos"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container / host"
    ci_acceptance_environment: "ubuntu-latest"
    release_artifact_target: "multi-platform"
    ide:
      python_root: "../Cyrene-Plugins-Official"
      gradle_root: "../Cyrene-Plugins-Official/plugins/gateway/spring/build.gradle.kts"
    pointers:
      primary_source_roots:
        - "../Cyrene-Plugins-Official/plugins/agents"
        - "../Cyrene-Plugins-Official/plugins/providers"
        - "../Cyrene-Plugins-Official/plugins/gateway/spring/src"
      test_roots:
        - "../Cyrene-Plugins-Official/plugins/agents/*/tests"
        - "../Cyrene-Plugins-Official/plugins/providers/*/tests"
      api_contract_roots:
        - "../Cyrene-Plugins-Official/plugins/gateway/spring/proto"
      database_migration_roots:
        - "../Cyrene-Plugins-Official/plugins/gateway/spring/src/main/resources/db/migration"
      developer_commands:
        test: "uv run pytest"
        build: "./gradlew build"

  - name: "Astrbot-Rev"
    path: "../Services/Astrbot-Rev"
    canonical_remote: "https://github.com/DoHorizon-AI/Astrbot-Rev.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    integration_branch: "develop"
    build_systems:
      - "dotnet"
      - "uv"
    roles:
      - "product-service"
      - "im-gateway"
    development_hosts: ["windows", "linux", "macos"]
    canonical_runtime_os: "linux"
    canonical_build_target: "linux-x64 (net10.0)"
    local_acceptance_environment: "wsl2 / linux_container / host"
    ci_acceptance_environment: "ubuntu-latest (Azure Pipelines / GitHub Actions)"
    release_artifact_target: "linux-x64"
    secondary_targets: ["linux-arm64", "win-x64"]
    ide:
      dotnet_solution: "../Services/Astrbot-Rev/AstrBot.slnx"
      python_root: "../Services/Astrbot-Rev/python/capability_worker"
    pointers:
      primary_source_roots:
        - "../Services/Astrbot-Rev/src/AstrBot.DotNetHost"
        - "../Services/Astrbot-Rev/python/capability_worker/src"
      test_roots:
        - "../Services/Astrbot-Rev/tests"
        - "../Services/Astrbot-Rev/python/capability_worker/tests"
      database_migration_roots:
        - "../Services/Astrbot-Rev/src/AstrBot.DatabaseMigrator/Migrations"
      developer_commands:
        test: "dotnet test AstrBot.slnx ; uv run --directory python/capability_worker pytest"
        build: "dotnet build AstrBot.slnx"

  - name: "DH-System-Internal"
    path: "../Services/DH-System-Internal"
    canonical_remote: "https://dohorizon@dev.azure.com/dohorizon/Cyrene/_git/DH-System-Internal"
    visibility: "private"
    clone_policy: "external_auth_required"
    integration_branch: "main"
    build_systems:
      - "dotnet"
    roles:
      - "enterprise-service"
      - "wecom-agent-hub"
    development_hosts: ["windows", "linux", "macos"]
    canonical_runtime_os: "linux"
    canonical_build_target: "linux-x64 (net10.0)"
    local_acceptance_environment: "wsl2 / linux_container / host"
    ci_acceptance_environment: "ubuntu-latest (Azure Pipelines)"
    release_artifact_target: "linux-x64"
    ide:
      dotnet_solution: "../Services/DH-System-Internal/WeComAgentHub.slnx"
    pointers:
      primary_source_roots:
        - "../Services/DH-System-Internal/src"
      test_roots:
        - "../Services/DH-System-Internal/tests"
      database_migration_roots:
        - "../Services/DH-System-Internal/src/WeComAgentHub.Infrastructure/Migrations"
      developer_commands:
        test: "dotnet test WeComAgentHub.slnx"
        build: "dotnet build WeComAgentHub.slnx"

  - name: "Cyrene-Reactor"
    path: "../Services/Cyrene-Reactor"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Reactor.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    integration_branch: "develop"
    build_systems:
      - "uv"
      - "cargo"
    roles:
      - "product-service"
      - "inference-serving"
    development_hosts: ["windows", "linux"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container"
    ci_acceptance_environment: "ubuntu-latest"
    release_artifact_target: "x86_64-unknown-linux-gnu"
    ide:
      python_root: "../Services/Cyrene-Reactor"
      cargo_root: "../Services/Cyrene-Reactor/Cargo.toml"
    pointers:
      primary_source_roots:
        - "../Services/Cyrene-Reactor/runtime/core/src"
        - "../Services/Cyrene-Reactor/runtime/pro/src"
        - "../Services/Cyrene-Reactor/components/scheduler-rs/src"
      test_roots:
        - "../Services/Cyrene-Reactor/runtime/core/tests"
        - "../Services/Cyrene-Reactor/runtime/pro/tests"
      developer_commands:
        test: "uv run pytest ; cargo test"
        build: "cargo build"

  - name: "Cyrene-Yield"
    path: "../Services/Cyrene-Yield"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Yield.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    integration_branch: "develop"
    build_systems:
      - "uv"
    roles:
      - "product-service"
      - "model-training"
    development_hosts: ["windows", "linux"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container / host"
    ci_acceptance_environment: "ubuntu-latest"
    release_artifact_target: "py3-none-any"
    ide:
      python_root: "../Services/Cyrene-Yield"
    pointers:
      primary_source_roots:
        - "../Services/Cyrene-Yield/training/core/src"
      test_roots:
        - "../Services/Cyrene-Yield/training/core/tests"
      developer_commands:
        test: "uv run pytest training/core/tests"
        build: "uv build"

  - name: "Cyrene-Exchange"
    path: "../Services/Cyrene-Exchange"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Exchange.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    integration_branch: "develop"
    build_systems:
      - "uv"
      - "gradle"
    roles:
      - "product-service"
      - "core-transport"
    development_hosts: ["windows", "linux", "macos"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container / host"
    ci_acceptance_environment: "ubuntu-latest"
    release_artifact_target: "multi-platform"
    ide:
      python_root: "../Services/Cyrene-Exchange"
      gradle_root: "../Services/Cyrene-Exchange/components/coordinator/build.gradle.kts"
    pointers:
      primary_source_roots:
        - "../Services/Cyrene-Exchange/src"
        - "../Services/Cyrene-Exchange/components/coordinator/src"
      test_roots:
        - "../Services/Cyrene-Exchange/tests"
      api_contract_roots:
        - "../Services/Cyrene-Exchange/proto"
      developer_commands:
        test: "uv run pytest ; ./gradlew build"
        build: "./gradlew build"

  - name: "Cyrene-Catalyst"
    path: "../Services/Cyrene-Catalyst"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Catalyst.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    integration_branch: "develop"
    build_systems: []
    roles:
      - "product-service"
      - "knowledge-catalyst"
    development_hosts: ["windows", "linux"]
    canonical_runtime_os: "linux"
    canonical_build_target: "linux-x64"

  - name: "Cyrene-Echo"
    path: "../Services/Cyrene-Echo"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Echo.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    integration_branch: "develop"
    build_systems: []
    roles:
      - "product-service"
      - "voice-synthesis"
    development_hosts: ["windows", "linux"]
    canonical_runtime_os: "linux"
    canonical_build_target: "linux-x64"

  - name: "Cyrene-Navigator"
    path: "../Services/Cyrene-Navigator"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Navigator.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    integration_branch: "develop"
    build_systems: []
    roles:
      - "product-service"
      - "desktop-navigation"
    development_hosts: ["windows", "macos", "linux"]
    canonical_runtime_os: "client-desktop"
    canonical_build_target: "multi-target"

profiles:
  full:
    description: "Full Architecture Workspace: All canonical Cyrene platform and product repositories"
    repositories:
      - "Cyrene-Platform"
      - "Cyrene-Plugins-Official"
      - "Astrbot-Rev"
      - "DH-System-Internal"
      - "Cyrene-Reactor"
      - "Cyrene-Yield"
      - "Cyrene-Exchange"
      - "Cyrene-Catalyst"
      - "Cyrene-Navigator"
      - "Cyrene-Echo"
    dotnet_solutions:
      - "Cyrene.Workspace.slnx"
      - "solutions/Cyrene.AstrBot.Integration.slnx"

  astrbot:
    description: "AstrBot Integration Workspace: AstrBot host, Platform SDK, Plugins ecosystem, and Exchange transport"
    repositories:
      - "Astrbot-Rev"
      - "Cyrene-Platform"
      - "Cyrene-Plugins-Official"
      - "Cyrene-Exchange"
    dotnet_solutions:
      - "solutions/Cyrene.AstrBot.Integration.slnx"

  platform:
    description: "Core Platform Workspace: Cyrene-Platform and Plugins ecosystem conformance harness"
    repositories:
      - "Cyrene-Platform"
      - "Cyrene-Plugins-Official"

  training:
    description: "Model Training Workspace: Cyrene-Yield training service, Platform SDK, and conformance harness"
    repositories:
      - "Cyrene-Yield"
      - "Cyrene-Platform"
      - "Cyrene-Plugins-Official"
