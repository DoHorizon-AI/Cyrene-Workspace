version: "1.4.0"
workspace: "Cyrene"
description: "Canonical multi-repository topology, runtime target manifest, and contract pointers for Cyrene developers"

global_policy:
  development_hosts:
    - "windows"
    - "linux"
    - "macos"
  windows_role: "DEVELOPMENT_HOST_ONLY (IDE indexing, rust-analyzer, local diagnostics, Python/DotNet tooling)"
  canonical_runtime_os: "linux"
  canonical_rust_target: "x86_64-unknown-linux-gnu"
  secondary_rust_targets:
    - "aarch64-unknown-linux-gnu"
  python_baseline:
    canonical_dev_version: "3.12"
    declared_compatibility: ">=3.11"
    environment_manager: "uv"
  jvm_baseline:
    jdk_version: 25
    kotlin_version: "2.4.10"
    gradle_version: "9.5.0"
    dsl: "Gradle Kotlin DSL"
  dotnet_baseline:
    sdk_version: "10.0"
    solution_format: ".slnx"
  node_baseline:
    policy: "NONE (no canonical backend execution plane dependency)"
  ci_authority_policy:
    automatic_source_rule: "Exactly one provider owns automatic source and contract checks per repository."
    repository_declaration_rule: "Each repository ci_authority.source is authoritative; visibility alone does not select a provider."
    publication_target_source_authority: "github_actions"
    artifact_build_rule: "GitHub Actions builds the public release payload once on a successful push and publishes an immutable commit-SHA artifact with a manifest and SHA-256 payload digests."
    azure_delivery_rule: "Azure Pipelines CD consumes only the explicitly selected successful GitHub Actions run artifact, verifies repository, conclusion, commit SHA, and manifest digests, then performs delivery or an explicit verified handoff without checkout, build, or test."
    artifact_retention: "GitHub Actions artifacts retain for 30 days; Azure CD requires githubArtifactReadToken with Actions: read access."
    azure_supplemental_scopes:
      - "deployment"
      - "self_hosted_gpu"
      - "private_credentials"
      - "exact_cross_repository_acceptance"
    status_reporting: "Azure supplemental results must be published as checks on the same GitHub revision."
    evidence_rule: "Skipped, simulated, credential-blocked, and unrun work must retain those states."

repositories:
  - name: "Cyrene-Platform"
    path: "../Cyrene-Platform"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Platform.git"
    visibility: "public"
    clone_policy: "public_zero_auth"
    default_branch: "main"
    integration_branch: "develop"
    ci_authority:
      source: "github_actions"
      delivery: "azure_pipelines"
      automatic_azure_scope: "none"
      supplemental_azure_scope: "self_hosted_gpu_or_delivery"
    build_systems:
      - "cargo"
      - "uv"
      - "gradle"
    roles:
      - "core-platform"
      - "kernel"
      - "sdk"
    development_hosts: ["windows", "linux", "macos"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container"
    ci_acceptance_environment: "ubuntu-latest (GitHub Actions source); self-hosted GPU/runtime (Azure manual)"
    release_artifact_target: "x86_64-unknown-linux-gnu"
    secondary_targets: ["aarch64-unknown-linux-gnu"]
    ide:
      cargo_root: "../Cyrene-Platform/Cargo.toml"
      python_root: "../Cyrene-Platform"
    pointers:
      primary_source_roots:
        - "../Cyrene-Platform/kernel/crates"
        - "../Cyrene-Platform/framework/crates"
        - "../Cyrene-Platform/agents"
        - "../Cyrene-Platform/adapters"
        - "../Cyrene-Platform/sdk/python"
      test_roots:
        - "../Cyrene-Platform/kernel/crates/*/tests"
        - "../Cyrene-Platform/sdk/python/*/tests"
      api_contract_roots:
        - "../Cyrene-Platform/contracts/proto"
        - "../Cyrene-Platform/contracts/rust"
      developer_commands:
        test: "cargo test --workspace ; uv run pytest ; gradle -p tck/model-provider-embedding-contract/jvm test"
        build: "cargo build --locked --workspace --all-targets"

  - name: "Cyrene-Plugins-Official"
    path: "../Cyrene-Plugins-Official"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git"
    # Desired publication policy. Live GitHub visibility remains private until
    # the hosting setting is changed and read back independently.
    visibility: "public"
    clone_policy: "public_zero_auth"
    default_branch: "main"
    integration_branch: "develop"
    ci_authority:
      source: "github_actions"
      delivery: "azure_pipelines"
      automatic_azure_scope: "none"
      supplemental_azure_scope: "protected_resources_or_delivery"
    build_systems:
      - "uv"
      - "cargo"
      - "dotnet"
      - "maven"
      - "buf"
    roles:
      - "plugin-ecosystem"
      - "conformance-harness"
    development_hosts: ["windows", "linux", "macos"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container / host"
    ci_acceptance_environment: "ubuntu-latest (GitHub Actions source/package); protected resources/delivery (Azure manual)"
    release_artifact_target: "multi-platform"
    ide:
      python_root: "../Cyrene-Plugins-Official"
    pointers:
      primary_source_roots:
        - "../Cyrene-Plugins-Official/contracts"
        - "../Cyrene-Plugins-Official/runtime"
        - "../Cyrene-Plugins-Official/sdk"
        - "../Cyrene-Plugins-Official/plugins/connectors/onebot-v11"
        - "../Cyrene-Plugins-Official/plugins/tools/computer-runtime"
        - "../Cyrene-Plugins-Official/manifests"
      test_roots:
        - "../Cyrene-Plugins-Official/contracts/rust/cyrene-plugin-contracts/tests"
        - "../Cyrene-Plugins-Official/contracts/tck"
        - "../Cyrene-Plugins-Official/runtime/rust/*/tests"
        - "../Cyrene-Plugins-Official/runtime/dotnet-native-aot/Cyrene.Provider.Tests"
        - "../Cyrene-Plugins-Official/sdk/python/cyrene_plugin_runtime/tests"
        - "../Cyrene-Plugins-Official/sdk/java/*/src/test"
        - "../Cyrene-Plugins-Official/plugins/connectors/onebot-v11/tests"
      developer_commands:
        test: "python3 tools/ci/verify_source_manifest.py --root . --allow-git-metadata"
        build: "Use .github/workflows/public-ci.yml for the complete multi-language build matrix"

  - name: "Cyrene-Reactor"
    path: "../Cyrene-Services/Cyrene-Reactor"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Reactor.git"
    visibility: "private"
    clone_policy: "private_token_auth"
    default_branch: "main"
    integration_branch: "develop"
    ci_authority:
      source: "github_actions"
      delivery: "azure_pipelines"
      automatic_azure_scope: "none"
      supplemental_azure_scope: "self_hosted_gpu_or_delivery"
    build_systems:
      - "uv"
      - "cargo"
    roles:
      - "product-service"
      - "inference-serving"
    development_hosts: ["windows", "linux"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container"
    ci_acceptance_environment: "ubuntu-latest (GitHub Actions source); self-hosted GPU/runtime (Azure manual)"
    release_artifact_target: "x86_64-unknown-linux-gnu"
    ide:
      python_root: "../Cyrene-Services/Cyrene-Reactor"
      cargo_root: "../Cyrene-Services/Cyrene-Reactor/Cargo.toml"
    pointers:
      primary_source_roots:
        - "../Cyrene-Services/Cyrene-Reactor/runtime/core/src"
        - "../Cyrene-Services/Cyrene-Reactor/runtime/pro/src"
        - "../Cyrene-Services/Cyrene-Reactor/components/host-placement/src"
      test_roots:
        - "../Cyrene-Services/Cyrene-Reactor/runtime/core/tests"
        - "../Cyrene-Services/Cyrene-Reactor/runtime/pro/tests"
      developer_commands:
        test: "uv run pytest ; cargo test"
        build: "cargo build"

  - name: "Cyrene-Yield"
    path: "../Cyrene-Services/Cyrene-Yield"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Yield.git"
    visibility: "private"
    clone_policy: "private_token_auth"
    default_branch: "main"
    integration_branch: "develop"
    ci_authority:
      source: "github_actions"
      delivery: "azure_pipelines"
      automatic_azure_scope: "none"
      supplemental_azure_scope: "self_hosted_gpu_or_delivery"
    build_systems:
      - "uv"
    roles:
      - "product-service"
      - "model-training"
    development_hosts: ["windows", "linux"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container / host"
    ci_acceptance_environment: "ubuntu-latest (GitHub Actions source); self-hosted GPU/runtime (Azure manual)"
    release_artifact_target: "py3-none-any"
    ide:
      python_root: "../Cyrene-Services/Cyrene-Yield"
    pointers:
      primary_source_roots:
        - "../Cyrene-Services/Cyrene-Yield/training/core/src"
      test_roots:
        - "../Cyrene-Services/Cyrene-Yield/training/core/tests"
      developer_commands:
        test: "uv run pytest training/core/tests"
        build: "uv build"

  - name: "Cyrene-Exchange"
    path: "../Cyrene-Services/Cyrene-Exchange"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Exchange.git"
    visibility: "private"
    clone_policy: "private_token_auth"
    default_branch: "main"
    integration_branch: "develop"
    ci_authority:
      source: "github_actions"
      delivery: "azure_pipelines"
      automatic_azure_scope: "none"
      supplemental_azure_scope: "private_credentials_or_delivery"
    build_systems:
      - "uv"
      - "gradle"
    roles:
      - "product-service"
      - "core-transport"
    development_hosts: ["windows", "linux", "macos"]
    canonical_runtime_os: "linux"
    canonical_build_target: "x86_64-unknown-linux-gnu"
    local_acceptance_environment: "wsl2 / linux_container / host"
    ci_acceptance_environment: "ubuntu-latest (GitHub Actions source); Azure manual private integration/delivery"
    release_artifact_target: "multi-platform"
    ide:
      python_root: "../Cyrene-Services/Cyrene-Exchange"
      gradle_root: "../Cyrene-Services/Cyrene-Exchange/components/coordinator/build.gradle.kts"
    pointers:
      primary_source_roots:
        - "../Cyrene-Services/Cyrene-Exchange/src"
        - "../Cyrene-Services/Cyrene-Exchange/components/coordinator/src"
      test_roots:
        - "../Cyrene-Services/Cyrene-Exchange/tests"
      api_contract_roots:
        - "../Cyrene-Services/Cyrene-Exchange/proto"
      developer_commands:
        test: "uv run pytest ; ./gradlew build"
        build: "./gradlew build"

  - name: "Cyrene-Catalyst"
    path: "../Cyrene-Services/Cyrene-Catalyst"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Catalyst.git"
    visibility: "private"
    clone_policy: "private_token_auth"
    default_branch: "main"
    integration_branch: "develop"
    build_systems:
      - "uv"
    roles:
      - "product-service"
      - "knowledge-catalyst"
    ci_authority:
      source: "github_actions"
      delivery: "azure_pipelines"
      automatic_azure_scope: "none"
      supplemental_azure_scope: "private_credentials_or_delivery"
    ci_acceptance_environment: "ubuntu-latest (GitHub Actions source; Azure manual delivery/integration)"
    development_hosts: ["windows", "linux"]
    canonical_runtime_os: "linux"
    canonical_build_target: "linux-x64"
    ide:
      python_root: "../Cyrene-Services/Cyrene-Catalyst"
    pointers:
      primary_source_roots:
        - "../Cyrene-Services/Cyrene-Catalyst/src"
      test_roots:
        - "../Cyrene-Services/Cyrene-Catalyst/tests"
      developer_commands:
        test: "uv run pytest"
        build: "uv build"

  - name: "Cyrene-Echo"
    path: "../Cyrene-Services/Cyrene-Echo"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Echo.git"
    visibility: "private"
    clone_policy: "private_token_auth"
    default_branch: "main"
    integration_branch: "develop"
    build_systems:
      - "uv"
    roles:
      - "product-service"
      - "model-evaluation"
    ci_authority:
      source: "github_actions"
      delivery: "azure_pipelines"
      automatic_azure_scope: "none"
      supplemental_azure_scope: "private_credentials_or_delivery"
    ci_acceptance_environment: "ubuntu-latest (GitHub Actions source; Azure manual delivery/integration)"
    development_hosts: ["windows", "linux"]
    canonical_runtime_os: "linux"
    canonical_build_target: "linux-x64"
    ide:
      python_root: "../Cyrene-Services/Cyrene-Echo"
    pointers:
      primary_source_roots:
        - "../Cyrene-Services/Cyrene-Echo/src"
      test_roots:
        - "../Cyrene-Services/Cyrene-Echo/tests"
      developer_commands:
        test: "uv run pytest"
        build: "uv build"

  - name: "Cyrene-Navigator"
    path: "../Cyrene-Services/Cyrene-Navigator"
    canonical_remote: "https://github.com/DoHorizon-AI/Cyrene-Navigator.git"
    visibility: "private"
    clone_policy: "private_token_auth"
    default_branch: "main"
    integration_branch: "develop"
    build_systems:
      - "uv"
      - "node"
      - "cargo"
      - "dotnet"
    roles:
      - "product-service"
      - "desktop-navigation"
    ci_authority:
      source: "github_actions"
      delivery: "azure_pipelines"
      automatic_azure_scope: "none"
      supplemental_azure_scope: "private_credentials_or_delivery"
    ci_acceptance_environment: "GitHub hosted source/desktop checks; Azure manual delivery/integration"
    development_hosts: ["windows", "macos", "linux"]
    canonical_runtime_os: "client-desktop"
    canonical_build_target: "multi-target"
    ide:
      python_root: "../Cyrene-Services/Cyrene-Navigator"
      node_root: "../Cyrene-Services/Cyrene-Navigator/apps/desktop"
      cargo_root: "../Cyrene-Services/Cyrene-Navigator/native/Cargo.toml"
      dotnet_solution: "../Cyrene-Services/Cyrene-Navigator/apps/windows/Cyrene.Navigator.Windows.sln"
    pointers:
      primary_source_roots:
        - "../Cyrene-Services/Cyrene-Navigator/src"
        - "../Cyrene-Services/Cyrene-Navigator/apps/desktop/ui"
        - "../Cyrene-Services/Cyrene-Navigator/harness/src"
        - "../Cyrene-Services/Cyrene-Navigator/native"
        - "../Cyrene-Services/Cyrene-Navigator/apps/windows"
      test_roots:
        - "../Cyrene-Services/Cyrene-Navigator/tests"
        - "../Cyrene-Services/Cyrene-Navigator/harness/tests"
      developer_commands:
        test: "uv run pytest ; pnpm --dir apps/desktop build ; cargo test --manifest-path native/Cargo.toml"
        build: "pnpm --dir apps/desktop build ; cargo build --manifest-path native/Cargo.toml"

profiles:
  full:
    description: "Full Architecture Workspace: All canonical Cyrene platform and product repositories"
    repositories:
      - "Cyrene-Platform"
      - "Cyrene-Plugins-Official"
      - "Cyrene-Reactor"
      - "Cyrene-Yield"
      - "Cyrene-Exchange"
      - "Cyrene-Catalyst"
      - "Cyrene-Navigator"
      - "Cyrene-Echo"
    dotnet_solutions:
      - "Cyrene.Workspace.slnx"

  platform:
    description: "Core Platform Workspace: Cyrene-Platform and Plugins ecosystem conformance harness"
    repositories:
      - "Cyrene-Platform"
      - "Cyrene-Plugins-Official"

  training:
    description: "Model Training Workspace: Cyrene-Yield training service, Platform SDK, and conformance harness"
    repositories:
      - "Cyrene-Yield"
      - "Cyrene-Platform"
      - "Cyrene-Plugins-Official"
