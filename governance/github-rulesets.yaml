version: "1.0.0"
organization: "DoHorizon-AI"
description: "Declarative GitHub Branch Rulesets Governance for Cyrene"

rulesets:
  - name: "cyrene-develop-protection"
    target: "branch"
    enforcement: "active"
    conditions:
      ref_name:
        include:
          - "refs/heads/develop"
        exclude: []
    rules:
      - type: "deletion"
      - type: "non_fast_forward"
      - type: "pull_request"
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true

  - name: "cyrene-main-protection"
    target: "branch"
    enforcement: "active"
    conditions:
      ref_name:
        include:
          - "refs/heads/main"
        exclude: []
    rules:
      - type: "deletion"
      - type: "non_fast_forward"
      - type: "pull_request"
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true

managed_repositories:
  - "Cyrene-Platform"
  - "Cyrene-Plugins-Official"
  - "Astrbot-Rev"
  - "Cyrene-Yield"
  - "Cyrene-Reactor"
  - "Cyrene-Exchange"
  - "Cyrene-Catalyst"
  - "Cyrene-Navigator"
  - "Cyrene-Echo"
