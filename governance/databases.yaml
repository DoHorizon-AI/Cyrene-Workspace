version: "1.0.0"
workspace: "Cyrene"
description: "Declarative Database and Data-Service Inventory for Cyrene Developer Composition"

services:
  # ===================================================================
  # 1. PostgreSQL + pgvector (AstrBot Knowledge Base)
  # ===================================================================
  - name: "astrbot-postgres-vector"
    owner_repository: "services/cyrene-astrbot-rev"
    technology: "PostgreSQL (with pgvector extension)"
    category: "relational database + vector extension"
    purpose: "Long-term conversation memory, vector embeddings, and multi-tenant knowledge base retrieval"
    development_role: "Local Docker container or local PostgreSQL instance"
    production_role: "Managed PostgreSQL (RDS/Cloud SQL/Self-Hosted) with pgvector"
    profiles:
      - "full"
      - "astrbot"
    host_convention: "localhost"
    port_convention: 5432
    default_database: "astrbot"
    default_schema: "public"
    migration_authority: "AstrBot.DatabaseMigrator (.NET 10 / SQL Scripts in src/AstrBot.DatabaseMigrator/Migrations)"
    seed_authority: "AstrBot.KnowledgeBaseImporter / IrisHistoryImporter (.NET 10)"
    container_authority: "services/cyrene-astrbot-rev/docker-compose.yml (or shared local Postgres)"
    credential_policy: "Environment variables (ASTRBOT_PG_CONNECTION_STRING, ConnectionStrings__AstrBot). Never committed to VCS."
    ide_datasource_eligible: true
    jdbc_url_template: "jdbc:postgresql://localhost:5432/astrbot"

  # ===================================================================
  # 2. SQLite (AstrBot Embedded Knowledge & Local Fallback)
  # ===================================================================
  - name: "astrbot-sqlite-local"
    owner_repository: "services/cyrene-astrbot-rev"
    technology: "SQLite"
    category: "embedded/dev-only database"
    purpose: "Local developer fallback, conversation cache, and standalone embedded knowledge base"
    development_role: "Embedded SQLite file at data/knowledge_base/kb.db and data/astrbot.db"
    production_role: "Development/Testing only (production uses PostgreSQL + pgvector)"
    profiles:
      - "full"
      - "astrbot"
    host_convention: "local-filesystem"
    port_convention: null
    default_database: "data/knowledge_base/kb.db"
    default_schema: "main"
    migration_authority: "AstrBot.DatabaseMigrator"
    seed_authority: "AstrBot.KnowledgeBaseImporter"
    container_authority: "None (embedded file)"
    credential_policy: "None (file-based)"
    ide_datasource_eligible: true
    jdbc_url_template: "jdbc:sqlite:$PROJECT_DIR$/../services/cyrene-astrbot-rev/data/knowledge_base/kb.db"

  # ===================================================================
  # 3. Redis (WeComAgentHub & Coordinator Distributed Cache / Queue)
  # ===================================================================
  - name: "cyrene-redis-cache"
    owner_repository: "services/cyrene-exchange"
    technology: "Redis"
    category: "cache/key-value store"
    purpose: "Distributed session cache, token bucket rate-limiting, prompt caching (pc:), worker registration, and message routing"
    development_role: "Local Docker container or local Redis server"
    production_role: "Managed Redis / Redis Cluster"
    profiles:
      - "full"
      - "astrbot"
    host_convention: "localhost"
    port_convention: 6379
    default_database: "0"
    default_schema: null
    migration_authority: "None (key-value structure managed by application lifecycle)"
    seed_authority: "None (runtime dynamic)"
    container_authority: "services/cyrene-navigator/legacy-dh/apps/control-plane/docker-compose.yml"
    credential_policy: "Environment variables (REDIS_CONNECTION_STRING, SPRING_DATA_REDIS_PASSWORD). Never committed to VCS."
    ide_datasource_eligible: true
    jdbc_url_template: "redis://localhost:6379/0"

  # ===================================================================
  # 4. PostgreSQL (WeComAgentHub Enterprise Data)
  # ===================================================================
  - name: "wecomagenthub-postgres"
    owner_repository: "services/cyrene-dh-system-internal"
    technology: "PostgreSQL"
    category: "relational database"
    purpose: "Enterprise WeCom agent hub tenants, application configs, message audit logs, and token billing ledger"
    development_role: "Local PostgreSQL instance or Docker container"
    production_role: "Managed Enterprise PostgreSQL / Azure Database for PostgreSQL"
    profiles:
      - "full"
    host_convention: "localhost"
    port_convention: 5432
    default_database: "wecom_agent_hub"
    default_schema: "public"
    migration_authority: "EF Core Migrations (WeComAgentHub.Infrastructure / dotnet ef database update)"
    seed_authority: "WeComAgentHub.Worker / DbInitializer"
    container_authority: "docker-compose (external/dev-service)"
    credential_policy: "Environment variables (ConnectionStrings__DefaultConnection). Never committed to VCS."
    ide_datasource_eligible: true
    jdbc_url_template: "jdbc:postgresql://localhost:5432/wecom_agent_hub"

  # ===================================================================
  # 5. PostgreSQL (Spring Gateway Control & Billing)
  # ===================================================================
  - name: "cy-gateway-postgres"
    owner_repository: "plugins"
    technology: "PostgreSQL (R2DBC / JDBC)"
    category: "relational database"
    purpose: "Gateway routing table, API key quotas, tenant billing events, and audit logs"
    development_role: "Local PostgreSQL instance"
    production_role: "Managed PostgreSQL"
    profiles:
      - "full"
      - "platform"
    host_convention: "localhost"
    port_convention: 5432
    default_database: "cy_gateway"
    default_schema: "public"
    migration_authority: "Flyway (plugins/plugins/gateway/spring/src/main/resources/db/migration/V1__init_schema.sql)"
    seed_authority: "Flyway / Spring Boot ApplicationRunner"
    container_authority: "services/cyrene-navigator/legacy-dh/apps/control-plane/docker-compose.yml"
    credential_policy: "Environment variables (SPRING_R2DBC_PASSWORD, CY_GATEWAY_DB_PASSWORD). Never committed to VCS."
    ide_datasource_eligible: true
    jdbc_url_template: "jdbc:postgresql://localhost:5432/cy_gateway"

  # ===================================================================
  # 6. PostgreSQL (Navigator Control Plane)
  # ===================================================================
  - name: "navigator-control-plane-postgres"
    owner_repository: "services/cyrene-navigator"
    technology: "PostgreSQL 16"
    category: "relational database"
    purpose: "Desktop navigator and local control plane session state"
    development_role: "Docker container defined in legacy-dh/apps/control-plane/docker-compose.yml"
    production_role: "Development / Single-node deployment"
    profiles:
      - "full"
    host_convention: "localhost"
    port_convention: 5432
    default_database: "dh_cp"
    default_schema: "public"
    migration_authority: "Control plane migration scripts"
    seed_authority: "Control plane bootstrap"
    container_authority: "services/cyrene-navigator/legacy-dh/apps/control-plane/docker-compose.yml"
    credential_policy: "Environment variables (POSTGRES_PASSWORD). Never committed to VCS."
    ide_datasource_eligible: true
    jdbc_url_template: "jdbc:postgresql://localhost:5432/dh_cp"
