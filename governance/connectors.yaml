base_image_policy:
  runtime_boundary: "MINIMAL_CORE_ONLY"
  rule: "Do not restore every connector dependency into the base image. Support all official connectors via dynamic/isolated selection; install and activate only what the deployment selects."
  core_builtin_components:
    - "webchat (built-in platform event gateway & webui messaging)"
    - "cyrene-platform kernel & sdk primitives"
    - "core exchange routing envelope"
  recoverable_dependency_footprint:
    measured_state: "estimated with source"
    base_image_reduction_bytes: 367001600 # ~350 MB uncompressed site-packages reduction
    isolated_packages_reclaimed:
      - "qq-botpy"
      - "py-cord"
      - "lark-oapi"
      - "dingtalk-stream"
      - "slack-sdk"
      - "python-telegram-bot"
      - "telegramify-markdown"
      - "wechatpy"
      - "silk-python"
      - "faiss-cpu"

