name: CI and immutable release artifact

on:
  push:
    branches: [develop, main, release, 'feat/**', 'fix/**']
  pull_request:
    branches: [develop, main, release]
  workflow_dispatch:

  # Azure CD consumes the immutable artifact from a successful push run.

permissions:
  contents: read

jobs:
  integration-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.3
      - run: >-
          uvx ruff==0.16.5 check
          cyrene scripts/validate_release_lock.py tests/test_cyrene_cli.py
          tests/test_release_lock.py tests/test_workspace_topology.py governance/product-contract-v1/tests
      - run: >-
          uvx ruff==0.16.5 format --check
          cyrene scripts/validate_release_lock.py tests/test_cyrene_cli.py
          tests/test_release_lock.py tests/test_workspace_topology.py governance/product-contract-v1/tests
      - run: >-
          uvx --from pytest==9.1.1 --with jsonschema==4.26.0 --with PyYAML==6.0.3 pytest -q
          tests/test_cyrene_cli.py tests/test_release_lock.py tests/test_workspace_topology.py governance/product-contract-v1/tests
      - run: python scripts/validate_release_lock.py

  data-bundle-regression:
    name: ci / data-bundle-regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned data-bundle tools
        run: |
          python -m pip install --disable-pip-version-check -r packaging/data-bundle-release-requirements.txt
          python -m pip install --disable-pip-version-check ruff==0.16.5 pytest==9.1.1
      - name: Check producer and source-origin regression
        run: |
          ruff check packaging/build_data_bundle_release.py tests/test_data_bundle_release.py
          ruff format --check tests/test_data_bundle_release.py
          pytest -q tests/test_data_bundle_release.py

  component-updates:
    name: ci / component-updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned CI tools and schema validators
        run: >-
          python -m pip install uv==0.12.3 jsonschema==4.26.0 PyYAML==6.0.3
      - name: Lint component updater and bundle producers
        run: >-
          uvx ruff==0.16.5 check
          packaging/component_updates.py packaging/prepare_service_wheelhouse.py
          packaging/service_bundle.py tests/test_cyrene_cli.py
          tests/test_service_wheelhouse_export.py
          tests/test_linux_component_update_builders.py
          tests/test_linux_component_update_identity.py
          tests/test_data_bundle_source_workflows.py
          tests/test_data_bundle_inner_manifest.py
          tests/test_linux_component_updates.py
      - name: Check component updater and bundle producer formatting
        run: >-
          uvx ruff==0.16.5 format --check
          packaging/component_updates.py packaging/prepare_service_wheelhouse.py
          packaging/service_bundle.py tests/test_cyrene_cli.py
          tests/test_service_wheelhouse_export.py
          tests/test_linux_component_update_builders.py
          tests/test_linux_component_update_identity.py
          tests/test_data_bundle_source_workflows.py
          tests/test_data_bundle_inner_manifest.py
          tests/test_linux_component_updates.py
      - name: Test updater, identity, and bundle metadata paths
        run: >-
          uvx --from pytest==9.1.1 --with jsonschema==4.26.0 --with PyYAML==6.0.3 pytest -q
          tests/test_linux_component_update_builders.py
          tests/test_linux_component_update_identity.py
          tests/test_data_bundle_source_workflows.py
          tests/test_data_bundle_inner_manifest.py
          tests/test_linux_component_updates.py tests/test_cyrene_cli.py
          tests/test_service_wheelhouse_export.py
      - name: Check package and privileged helper shell syntax
        run: |
          bash -n packaging/build-deb.sh
          bash -n packaging/cyrene-component-update-helper
      - name: Validate component release schemas and trusted catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator, RefResolver

          governance = Path("governance")
          names = (
              "component-release-manifest-v1.schema.json",
              "component-release-manifest-v2.schema.json",
              "component-release-index-v1.schema.json",
              "data-bundle-proof-v1.schema.json",
              "component-catalog-v1.schema.json",
          )
          schemas = {
              (governance / name).resolve(): json.loads(
                  (governance / name).read_text(encoding="utf-8")
              )
              for name in names
          }
          for schema in schemas.values():
              Draft202012Validator.check_schema(schema)

          catalog_path = (governance / "component-catalog-v1.schema.json").resolve()
          catalog_schema = schemas[catalog_path]
          store = {schema["$id"]: schema for schema in schemas.values()}
          validator = Draft202012Validator(
              catalog_schema,
              resolver=RefResolver.from_schema(catalog_schema, store=store),
          )
          catalog = json.loads(
              (governance / "component-catalog-v1.json").read_text(encoding="utf-8")
          )
          errors = sorted(
              validator.iter_errors(catalog),
              key=lambda error: (list(error.absolute_path), error.message),
          )
          if errors:
              raise SystemExit("\n".join(error.message for error in errors))
          print("component release schemas and catalog are valid")
          PY

  native-profile-contracts:
    name: ci / native-installer-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            runner: ubuntu-22.04
            target: linux-ubuntu-22.04-x86_64-python-3.12
          - ubuntu: "24.04"
            runner: ubuntu-24.04
            target: linux-ubuntu-24.04-x86_64-python-3.12
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_PROFILE: ${{ matrix.target }}
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      CYRENE_PLUGINS_PROTO_ROOT: ${{ github.workspace }}/_native-protocols/contracts/proto
    steps:
      - uses: actions/checkout@v5
      - name: Stage pinned Plugins protobufs for the local caller compatibility test
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Plugins-Official
          ref: 0387f487ccfb0f2dd77d31126c0f5669abdde822
          path: _native-protocols
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"
      - name: Assert this job runs on its declared Ubuntu profile
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "$UBUNTU_VERSION"
          test "$(dpkg --print-architecture)" = amd64
      - name: Install pinned native-profile test tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.16.5 pytest==9.1.1 jsonschema==4.26.0 referencing==0.37.0 PyYAML==6.0.3
          grpcio==1.83.0 grpcio-tools==1.83.0 protobuf==7.36.0
      - name: Lint native runtime, installer verifier, and operator acceptance
        run: >-
          ruff check
          packaging/python_runtime.py packaging/verified_service_artifacts.py
          packaging/native_install_contract.py
          packaging/prepare_service_wheelhouse.py packaging/service_bundle.py
          packaging/component_updates.py packaging/native_core_bootstrap.py
          packaging/native_first_products.py
          scripts/native_installer_release.py
          tooling/acceptance/native-components-v2/native_acceptance.py
          tooling/acceptance/native-components-v2/admin_initialize.py
          tooling/acceptance/native-components-v2/admin_packet.py
          tooling/acceptance/native-components-v2/sidecar_invocation.py
          tooling/acceptance/native-components-v2/control_initialize.py
          tooling/acceptance/native-components-v2/training_evidence.py
          tests/test_python_runtime_lock.py tests/test_verified_service_artifacts.py
          tests/test_native_install_contract.py tests/test_native_installer_release.py
          tests/test_native_components_v2_acceptance.py
          tests/test_native_admin_packet.py
          tests/test_native_update_tool_and_dependencies.py
          tests/test_native_deb_staging.py
          tests/test_native_deb_helper_python.py
          tests/test_native_admin_authorization.py tests/test_native_core_bootstrap.py
          tests/test_native_first_product_receipt.py tests/test_native_first_products.py
          tests/test_native_sidecar_invocation.py
          tests/test_native_control_initialize.py
          tooling/acceptance/native-components-v2/tests/test_native_training_evidence.py
          tests/test_service_wheelhouse_export.py
          tests/test_linux_component_updates.py tests/test_linux_component_update_builders.py
          tests/test_linux_component_update_identity.py
          tests/test_data_bundle_source_workflows.py
          tests/test_data_bundle_inner_manifest.py
      - name: Check native-profile formatting
        run: >-
          ruff format --check
          packaging/python_runtime.py packaging/verified_service_artifacts.py
          packaging/native_install_contract.py
          packaging/prepare_service_wheelhouse.py packaging/service_bundle.py
          packaging/component_updates.py packaging/native_core_bootstrap.py
          packaging/native_first_products.py
          scripts/native_installer_release.py
          tooling/acceptance/native-components-v2/native_acceptance.py
          tooling/acceptance/native-components-v2/admin_initialize.py
          tooling/acceptance/native-components-v2/admin_packet.py
          tooling/acceptance/native-components-v2/sidecar_invocation.py
          tooling/acceptance/native-components-v2/control_initialize.py
          tooling/acceptance/native-components-v2/training_evidence.py
          tests/test_python_runtime_lock.py tests/test_verified_service_artifacts.py
          tests/test_native_install_contract.py tests/test_native_installer_release.py
          tests/test_native_components_v2_acceptance.py
          tests/test_native_admin_packet.py
          tests/test_native_update_tool_and_dependencies.py
          tests/test_native_deb_staging.py
          tests/test_native_deb_helper_python.py
          tests/test_native_admin_authorization.py tests/test_native_core_bootstrap.py
          tests/test_native_first_product_receipt.py tests/test_native_first_products.py
          tests/test_native_sidecar_invocation.py
          tests/test_native_control_initialize.py
          tooling/acceptance/native-components-v2/tests/test_native_training_evidence.py
          tests/test_service_wheelhouse_export.py
          tests/test_linux_component_updates.py tests/test_linux_component_update_builders.py
          tests/test_linux_component_update_identity.py
          tests/test_data_bundle_source_workflows.py
          tests/test_data_bundle_inner_manifest.py
      - name: Test runtime lock, signed service bytes, installer receipts, and native updates
        run: >-
          pytest -q
          tests/test_python_runtime_lock.py tests/test_verified_service_artifacts.py
          tests/test_native_install_contract.py tests/test_native_installer_release.py
          tests/test_native_components_v2_acceptance.py
          tests/test_native_admin_packet.py
          tests/test_native_update_tool_and_dependencies.py
          tests/test_native_deb_staging.py
          tests/test_native_deb_helper_python.py
          tests/test_native_admin_authorization.py tests/test_native_core_bootstrap.py
          tests/test_native_first_product_receipt.py tests/test_native_first_products.py
          tests/test_native_sidecar_invocation.py
          tests/test_native_control_initialize.py
          tooling/acceptance/native-components-v2/tests/test_native_training_evidence.py
          tests/test_service_wheelhouse_export.py
          tests/test_linux_component_updates.py tests/test_linux_component_update_builders.py
          tests/test_linux_component_update_identity.py
          tests/test_data_bundle_source_workflows.py
          tests/test_data_bundle_inner_manifest.py
      - name: Compile Python helpers and check package shell syntax
        run: |
          python -m py_compile \
            packaging/python_runtime.py packaging/verified_service_artifacts.py \
            packaging/native_install_contract.py packaging/native_core_bootstrap.py \
            packaging/native_first_products.py \
            scripts/native_installer_release.py \
            tooling/acceptance/native-components-v2/native_acceptance.py \
            tooling/acceptance/native-components-v2/admin_initialize.py \
            tooling/acceptance/native-components-v2/admin_packet.py \
            tooling/acceptance/native-components-v2/sidecar_invocation.py \
            tooling/acceptance/native-components-v2/control_initialize.py \
            tooling/acceptance/native-components-v2/training_evidence.py
          bash -n packaging/build-deb.sh packaging/cyrene-component-update-helper
      - name: Parse the installer publisher and CI workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          import subprocess

          for filename in (
              ".github/workflows/native-installer-release.yml",
              ".github/workflows/product-contract-v1.yml",
          ):
              workflow = Path(filename)
              value = yaml.safe_load(workflow.read_text(encoding="utf-8"))
              event_key = "on" if "on" in value else True
              if event_key not in value or "jobs" not in value:
                  raise SystemExit(f"invalid workflow structure: {filename}")
              for job_name, job in value["jobs"].items():
                  for step_index, step in enumerate(job.get("steps", [])):
                      script = step.get("run")
                      if not isinstance(script, str):
                          continue
                      result = subprocess.run(
                          ["bash", "-n"], input=script, text=True, capture_output=True, check=False
                      )
                      if result.returncode:
                          raise SystemExit(
                              f"shell syntax failed in {filename}:{job_name}:step-{step_index}:\n"
                              + result.stderr
                          )
          print("native release and source CI workflow YAML and shell parse")
          PY

  lifecycle-integration:
    name: ci / lifecycle-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.3
      - name: Install the lifecycle harness
        run: uv sync --group text-lifecycle
      - name: Fetch the pinned Product revisions
        run: >-
          .venv/bin/python scripts/lifecycle-checkouts.py
          --destination "$RUNNER_TEMP/lifecycle-sources"
      - name: Export the pinned checkout locations
        run: >-
          .venv/bin/python scripts/lifecycle-checkouts.py
          --destination "$RUNNER_TEMP/lifecycle-sources" --verify-only --print-env
          >> "$GITHUB_ENV"
      - name: Run cross-repository lifecycle contract tests
        run: .venv/bin/pytest -q ci/text-lifecycle-v1

  publish-artifact:
    name: ci / immutable-artifact
    if: github.event_name != 'pull_request'
    needs: [integration-profile, component-updates, lifecycle-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble source release bundle
        env:
          ARTIFACT_NAME: cyrene-workspace-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/cyrene-workspace-${GITHUB_SHA}.source.tar.gz"
          git archive --format=tar.gz --prefix="Cyrene-Workspace-${GITHUB_SHA}/" "${GITHUB_SHA}" > "${archive}"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          payload = []
          for path in sorted(dist.iterdir()):
              if path.name == "artifact-manifest.json":
                  continue
              payload.append(
                  {
                      "file": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "kind": "source-bundle",
                  }
              )
          if not payload:
              raise SystemExit("artifact payload is empty")
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "payload": payload,
          }
          (dist / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cyrene-workspace-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
