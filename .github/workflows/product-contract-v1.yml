name: Product contract integration profile

on:
  pull_request:
  push:
    branches: [main, 'docs/**']

permissions:
  contents: read

jobs:
  integration-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.3
      - run: uvx ruff==0.16.5 check governance/product-contract-v1/tests
      - run: uvx ruff==0.16.5 format --check governance/product-contract-v1/tests
      - run: uvx --from pytest==9.1.1 --with jsonschema==4.26.0 pytest -q governance/product-contract-v1/tests
