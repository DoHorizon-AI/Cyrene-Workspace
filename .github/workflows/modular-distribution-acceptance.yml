              print(json.dumps({"sourceId":"cyrene-catalyst","uid":source["uid"],"gid":source["gid"],"bindingScopeCount":len(verified_bindings),"bindings":verified_bindings,"catalogGeneration":generation,"catalogGroupId":catalog_group_id,"environmentGeneration":generation,"processGeneration":generation,"tokenFileMode":"0400","tokenOwner":"root:root","tokenHashMatchesCatalog":True,"packagePolicySourceCount":len(policy["sources"]),"unit":unit,"systemdActive":True,"mainPid":pid,"processUid":account.pw_uid,"processGid":group.gr_gid,"listenerPort":int(values["CYRENE_PORT_CATALYST"]),"systemdCredentialProjected":True,"maintenanceUnitActive":True,"maintenanceSocket":"/run/cyrene/runtime-maintenance.sock","maintenanceSocketPresent":True},separators=(",",":")))
