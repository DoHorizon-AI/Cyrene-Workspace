              def readback() -> dict[str, Any]:
                  current = workload_request("status", workloadId="catalyst")
                  require(current.get("status") == "ready", "Catalyst installed status is not ready")
                  require(current.get("catalogDigest") == workload["catalogDigest"], "Catalyst status catalog digest differs from pins")
                  rows_now = current.get("components", [])
                  assert_installed_components(rows_now, workload["selectedComponents"], "Catalyst installed status")
                  return {"catalogDigest": current["catalogDigest"], "components": rows_now}
              phase("catalyst_installed_status_readback", readback)

              def repeat_install() -> dict[str, Any]:
                  command = run(["sudo", "-n", "cyrene", "workload", "install", "catalyst", "--yes"], label="public-catalyst-repeat-install", timeout=1800)
                  after = workload_request("status", workloadId="catalyst")
                  require(after.get("catalogDigest") == workload["catalogDigest"], "repeat install changed the active catalog identity")
                  assert_installed_components(after.get("components", []), workload["selectedComponents"], "Catalyst repeated install readback")
                  receipt_after = active_receipt_readback(workload["selectedComponents"], staged.get("components"))
                  receipt_before = load_json(root() / "evidence" / "installed-workload-receipt-identities.json")
                  require(receipt_after == receipt_before, "repeated install changed active or immutable receipt identities")
                  return {"publicCommand": "sudo cyrene workload install catalyst --yes", "stdoutBytes": len(command.stdout.encode("utf-8")), "catalogDigest": after["catalogDigest"], "componentCount": len(after["components"]), "receiptIdentitiesUnchanged": True}
              phase("catalyst_public_repeat_install", repeat_install)
              phase("client_static_web_http", client_web_http)
              phase("client_release_integration", client_release_integration)

          def runtime_source_activation() -> dict[str, Any]:
              """Compare installed ActivitySource scopes with authenticated SDK UDS readback."""
