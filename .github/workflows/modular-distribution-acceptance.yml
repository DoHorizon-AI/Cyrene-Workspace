          def request_http(base_url: str, path: str) -> dict[str, Any]:
              """Make one bounded loopback request and preserve its response body."""
              url = base_url + path
              request = urllib.request.Request(url, headers={"Accept": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = response.read(1_048_577)
                      require(len(body) <= 1_048_576, f"HTTP response is too large: {url}")
                      require(response.status == 200, f"HTTP returned {response.status}: {url}")
                      return {"url": url, "status": response.status, "contentType": response.headers.get("Content-Type"), "body": body.decode("utf-8", errors="replace")}
              except urllib.error.URLError as error:
                  raise RuntimeError(f"HTTP request failed for {url}: {error}") from error

          def request_loopback(url: str, headers: dict[str, str]) -> tuple[int, dict[str, str], bytes]:
              """Read one fixed local route without following redirects or retaining its body."""
              class DenyRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, request: Any, response: Any, code: int, message: str, headers: Any, new_url: str) -> None:
                      return None

              request = urllib.request.Request(url, headers=headers, method="GET")
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), DenyRedirect())
              try:
                  response = opener.open(request, timeout=15)
              except urllib.error.HTTPError as error:
                  response = error
              except (urllib.error.URLError, TimeoutError) as error:
                  raise RuntimeError(f"Loopback HTTP request failed: {url}: {error}") from error
              with response:
                  body = response.read(8 * 1024 * 1024 + 1)
                  require(len(body) <= 8 * 1024 * 1024, f"Loopback HTTP response exceeds the size limit: {url}")
                  require(response.geturl() == url, f"Loopback HTTP response changed route: {url}")
                  return int(response.status), dict(response.headers.items()), body

          def response_schema(value: Any) -> Any:
              """Describe JSON structure without retaining Product response values."""
              if isinstance(value, dict):
                  return {"object": {key: response_schema(child) for key, child in sorted(value.items())}}
              if isinstance(value, list):
                  item_schemas = {
                      json.dumps(response_schema(child), sort_keys=True, separators=(",", ":"))
                      for child in value
                  }
                  return {"array": sorted(item_schemas)}
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "boolean"
              if isinstance(value, int):
                  return "integer"
              if isinstance(value, float):
                  return "number"
              if isinstance(value, str):
                  return "string"
              raise RuntimeError("Catalyst dataset response contains an unsupported JSON value")

          def compare_catalyst_read_responses(
              direct_status: int, direct_body: bytes, proxy_status: int, proxy_body: bytes
          ) -> dict[str, Any]:
              """Require matching successful Product JSON responses while retaining no records."""
              require(direct_status == 200, f"direct Catalyst dataset read returned HTTP {direct_status}")
              require(proxy_status == direct_status, f"Client Catalyst proxy returned HTTP {proxy_status}, direct Catalyst returned {direct_status}")
              try:
                  direct_value = json.loads(direct_body.decode("utf-8"))
                  proxy_value = json.loads(proxy_body.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise RuntimeError("Catalyst direct/proxy dataset response is not JSON") from error
              direct_schema = response_schema(direct_value)
              proxy_schema = response_schema(proxy_value)
              require(direct_schema == proxy_schema, "Client Catalyst proxy response schema differs from direct Catalyst")
              schema_bytes = json.dumps(direct_schema, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return {
                  "direct": {
                      "status": direct_status,
                      "bodyBytes": len(direct_body),
                      "bodySha256": hashlib.sha256(direct_body).hexdigest(),
                  },
                  "proxy": {
                      "status": proxy_status,
                      "bodyBytes": len(proxy_body),
                      "bodySha256": hashlib.sha256(proxy_body).hexdigest(),
                  },
                  "jsonSchemaSha256": hashlib.sha256(schema_bytes).hexdigest(),
                  "jsonSchemaMatches": True,
                  "recordsStored": False,
              }

          def client_web_http() -> dict[str, Any]:
              """Verify installed Client bytes, managed unit metadata, and same-origin Control routes."""
              workload = pins()["workloads"]["catalyst"]
              web_pin = next(
                  row for row in workload["selectedComponents"]
                  if row["componentId"] == "cyrene-client-workspace-web"
              )
              installed = load_json(root() / "evidence" / "installed-workload-receipt-identities.json")
              web_rows = [
                  row for row in installed["components"]
                  if row.get("componentId") == "cyrene-client-workspace-web"
              ]
              require(len(web_rows) == 1, "verified Client Web active receipt is missing")
              web_receipt = web_rows[0]
              static = web_receipt.get("staticWeb")
              require(isinstance(static, dict), "verified Client Web static receipt projection is missing")
              index_digest = static.get("indexDigest")
              require(isinstance(index_digest, str) and re.fullmatch(r"sha256:[0-9a-f]{64}", index_digest) is not None, "verified Client Web index digest is malformed")

              status = workload_request("status", workloadId="catalyst")
              require(status.get("status") == "ready", "installed workload status is unavailable for Client Web host readback")
              require(status.get("catalogDigest") == workload["catalogDigest"], "Client Web host status uses a different installed Catalog")
              metadata = status.get("hostMetadata", {}).get("web") if isinstance(status.get("hostMetadata"), dict) else None
              require(isinstance(metadata, dict), "installed workload status has no hostMetadata.web receipt")
              require(metadata.get("schemaVersion") == 1 and metadata.get("componentId") == web_pin["componentId"], "Client Web host receipt schema/component differs")
              require(metadata.get("installed") is True and metadata.get("available") is True, "Client Web host is not installed and available")
              require(metadata.get("version") == web_pin["version"], "Client Web host receipt version differs from exact release pins")
              require(metadata.get("releaseIdentity") == web_pin["manifestDigest"], "Client Web host receipt release identity differs from exact manifest pin")
              require(metadata.get("sourceReceiptDigest") == "sha256:" + web_receipt["immutableReceiptSha256"], "Client Web source receipt digest differs from the verified immutable receipt")
              require(metadata.get("activeReceiptDigest") == "sha256:" + web_receipt["activeReceiptSha256"], "Client Web active receipt digest differs from the verified active receipt")
              require(metadata.get("documentRoot") == "/var/lib/cyrene/workloads/web/cyrene-client-workspace-web/current", "Client Web document root differs from the installed current pointer")
              require(metadata.get("clientUrl") == "http://127.0.0.1:8100/", "Client Web public URL differs from the loopback-only contract")
              require(metadata.get("listenerAddress") == "127.0.0.1" and metadata.get("listenerPort") == 8100, "Client Web listener is not the exact loopback address")
              require(metadata.get("configPath") == "/etc/cyrene/workloads/web/nginx.conf", "Client Web Nginx config path differs from the managed service contract")
              require(metadata.get("unitPath") == "/etc/systemd/system/cyrene-workspace-web.service", "Client Web systemd unit path differs from the managed service contract")
              require(metadata.get("serviceUnit") == "cyrene-workspace-web.service", "Client Web status names a different systemd unit")
              require(metadata.get("serviceState") == "active" and metadata.get("serviceEnabled") is True, "Client Web systemd service is not active and enabled")
              require(re.fullmatch(r"sha256:[0-9a-f]{64}", str(metadata.get("configDigest"))) is not None, "Client Web managed config digest is missing")
              require(re.fullmatch(r"sha256:[0-9a-f]{64}", str(metadata.get("unitDigest"))) is not None, "Client Web managed unit digest is missing")
              require(re.fullmatch(r"nginx/[0-9][A-Za-z0-9.+-]*", str(metadata.get("nginxVersion"))) is not None, "Client Web Nginx version is unavailable")

              origin = "http://127.0.0.1:8100"
              root_status, _root_headers, root_body = request_loopback(
                  origin + "/", {"Accept-Encoding": "identity", "Origin": origin}
              )
              root_digest = "sha256:" + hashlib.sha256(root_body).hexdigest()
              require(root_status == 200, f"Client Web root returned HTTP {root_status}")
              require(root_digest == index_digest, "Client Web HTTP root bytes differ from the signed installed index.html digest")
              health_status, _health_headers, health_body = request_loopback(
                  origin + "/healthz", {"Accept": "application/json", "Origin": origin}
              )
              require(health_status == 200, f"Client Web health returned HTTP {health_status}")
              try:
                  health = json.loads(health_body.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise RuntimeError("Client Web health response is not JSON") from error
              require(isinstance(health, dict) and health.get("status") == "ok", "Client Web health response is not ready")
              control_status, _control_headers, control_body = request_loopback(
                  "http://127.0.0.1:5182/health/ready", {"Accept": "application/json"}
              )
              require(control_status == 200, f"Studio Control readiness returned HTTP {control_status}")
              try:
                  control = json.loads(control_body.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise RuntimeError("Studio Control readiness response is not JSON") from error
              require(isinstance(control, dict) and control.get("status") == "ready", "Studio Control is not ready")
              session_status, _session_headers, session_body = request_loopback(
                  origin + "/api/v1/auth/session",
                  {"Accept": "application/json", "Host": "127.0.0.1:8100", "Origin": origin},
              )
              require(session_status == 200, f"same-origin local Control session returned HTTP {session_status}")
              try:
                  session = json.loads(session_body.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise RuntimeError("same-origin local Control session is not JSON") from error
              csrf_token = session.get("csrfToken") if isinstance(session, dict) else None
              require(isinstance(session, dict) and session.get("authenticated") is True, "same-origin local session is not authenticated")
              require(session.get("state") == "AUTHENTICATED" and session.get("refreshable") is False, "same-origin local session state differs")
              require(isinstance(csrf_token, str) and re.fullmatch(r"[0-9a-f]{64}", csrf_token) is not None, "same-origin local session CSRF token is missing or malformed")
              probes = metadata.get("probes")
              require(isinstance(probes, dict), "Client Web host receipt has no probe readback")
              compare_nested(probes, {
                  "root": {"status": 200, "indexDigest": index_digest},
                  "health": {"status": 200, "bodyStatus": "ok"},
                  "controlReady": {"status": 200, "bodyStatus": "ready"},
                  "localSession": {"status": 200, "authenticated": True, "state": "AUTHENTICATED", "refreshable": False},
              }, "Client Web host probes")
              evidence = {
                  "clientUrl": origin + "/",
                  "documentRoot": metadata["documentRoot"],
                  "serviceUnit": metadata["serviceUnit"],
                  "serviceState": metadata["serviceState"],
                  "serviceEnabled": metadata["serviceEnabled"],
                  "nginxVersion": metadata["nginxVersion"],
                  "configDigest": metadata["configDigest"],
                  "unitDigest": metadata["unitDigest"],
                  "sourceReceiptDigest": metadata["sourceReceiptDigest"],
                  "activeReceiptDigest": metadata["activeReceiptDigest"],
                  "indexDigest": index_digest,
                  "httpRoot": {"status": root_status, "sha256": root_digest},
                  "health": {"status": health_status, "bodyStatus": health["status"]},
                  "controlReady": {"status": control_status, "bodyStatus": control["status"]},
                  "localSession": {"status": session_status, "authenticated": True, "state": "AUTHENTICATED", "refreshable": False, "csrfTokenFormatValid": True},
                  "csrfTokenStored": False,
                  "sessionCommandPosted": False,
              }
              write_json(root() / "evidence" / "client-web-http-acceptance.json", evidence)
              return evidence

          def client_release_integration() -> dict[str, Any]:
              """Prove the exact Node 24 Control release serves auth and Catalyst read APIs."""
              workload = pins()["workloads"]["catalyst"]
              control_pin = next(
                  row for row in workload["selectedComponents"]
                  if row["componentId"] == "cyrene-client-workspace-control"
              )
              require(
                  control_pin["targetId"] == "linux-ubuntu-24.04-x86_64-node-24",
                  "Client Control pin is not the official Ubuntu 24.04 Node 24 target",
              )
              status = workload_request("status", workloadId="catalyst")
              require(status.get("status") == "ready", "installed Control workload status is unavailable")
              require(status.get("catalogDigest") == workload["catalogDigest"], "installed Control status uses a different Catalog")
              assert_installed_components(
                  status.get("components", []), workload["selectedComponents"], "Client Control integration status"
              )
              installed = load_json(root() / "evidence" / "installed-workload-receipt-identities.json")
              control_rows = [
                  row for row in installed.get("components", [])
                  if row.get("componentId") == "cyrene-client-workspace-control"
              ]
              require(len(control_rows) == 1, "verified Client Control active receipt is missing")
              native = control_rows[0].get("nativeBinary")
              require(isinstance(native, dict), "verified Client Control native active-pointer proof is missing")
              require(
                  native.get("activePath") == "/usr/lib/cyrene/components/cyrene-client-workspace-control/active"
                  and native.get("activeTarget") == f"releases/{control_pin['version']}--{control_pin['manifestDigest'].removeprefix('sha256:')}"
                  and native.get("releasePath") == control_rows[0].get("releasePath"),
                  "Client Control active pointer does not match the exact installed receipt",
              )
              control_unit = "cyrene-client-workspace-control.service"
              active_state = run(
                  ["systemctl", "show", "--property=ActiveState", "--value", control_unit],
                  label="client-control-systemd-active-state", timeout=30, retain_output=False,
              ).stdout.strip()
              require(active_state == "active", f"pinned Client Control unit is not active: {active_state or 'empty state'}")
              fragment_path = run(
                  ["systemctl", "show", "--property=FragmentPath", "--value", control_unit],
                  label="client-control-systemd-fragment-path", timeout=30, retain_output=False,
              ).stdout.strip()
              require(bool(fragment_path) and Path(fragment_path).is_absolute(), "Client Control systemd unit fragment path is unavailable")
              unit_path = Path(fragment_path).resolve(strict=True)
              unit_info = unit_path.lstat()
              require(
                  unit_path.is_file() and unit_info.st_uid == 0 and unit_info.st_gid == 0
                  and not (unit_info.st_mode & 0o022),
                  "Client Control systemd unit is not a protected root-owned file",
              )
              unit_digest = "sha256:" + sha256(unit_path)
              expected_unit_digest = native.get("controlUnitDigest")
              require(
                  isinstance(expected_unit_digest, str) and unit_digest == expected_unit_digest,
                  "active Client Control unit bytes differ from the pinned signed component archive",
              )

              origin = "http://127.0.0.1:8100"
              auth_status, _auth_headers, auth_body = request_loopback(
                  origin + "/api/v1/auth/session",
                  {"Accept": "application/json", "Host": "127.0.0.1:8100", "Origin": origin},
              )
              require(auth_status == 200, f"local Client auth session returned HTTP {auth_status}")
              try:
                  auth = json.loads(auth_body.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise RuntimeError("local Client auth session is not JSON") from error
              csrf_token = auth.get("csrfToken") if isinstance(auth, dict) else None
              require(
                  isinstance(auth, dict) and auth.get("authenticated") is True
                  and auth.get("state") == "AUTHENTICATED" and auth.get("sessionId") == "local"
                  and auth.get("expiresAt") is None and auth.get("refreshExpiresAt") is None
                  and auth.get("refreshable") is False and auth.get("refreshed") is False
                  and isinstance(csrf_token, str) and re.fullmatch(r"[0-9a-f]{64}", csrf_token) is not None,
                  "local Client auth session does not satisfy the no-credential local contract",
              )

              code = textwrap.dedent(r'''
              import grp
              import hashlib
              import json
              import os
              import pwd
              import stat
              import urllib.error
              import urllib.request
              from pathlib import Path
              from urllib.parse import urlsplit
              def fail(message):
                  raise SystemExit(message)
              def read_protected(path, allowed_owners, maximum):
                  target=Path(path)
                  for parent in reversed(target.parents):
                      parent_info=parent.lstat()
                      if not stat.S_ISDIR(parent_info.st_mode) or parent_info.st_uid!=0 or stat.S_IMODE(parent_info.st_mode)&0o022:
                          fail("Control runtime credential/config path has an unsafe ancestor")
                  descriptor=os.open(target,os.O_RDONLY|getattr(os,"O_NOFOLLOW",0)|getattr(os,"O_CLOEXEC",0))
                  try:
                      before=os.fstat(descriptor)
                      identity=(before.st_uid,before.st_gid,stat.S_IMODE(before.st_mode))
                      if not stat.S_ISREG(before.st_mode) or before.st_nlink!=1 or identity not in allowed_owners or before.st_size>maximum:
                          fail("Control runtime credential/config file has unsafe ownership, mode, or size")
                      raw=b""
                      while True:
                          block=os.read(descriptor,65536)
                          if not block: break
                          raw+=block
                          if len(raw)>maximum: fail("Control runtime credential/config file exceeds the size limit")
                      after=os.fstat(descriptor)
                      if (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns,before.st_ctime_ns)!=(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns,after.st_ctime_ns):
                          fail("Control runtime credential/config file changed while being read")
                  finally:
                      os.close(descriptor)
                  return raw
              def shape(value):
                  if isinstance(value,dict): return {"object":{key:shape(child) for key,child in sorted(value.items())}}
                  if isinstance(value,list):
                      members={json.dumps(shape(child),sort_keys=True,separators=(",",":")) for child in value}
                      return {"array":sorted(members)}
                  if value is None: return "null"
                  if isinstance(value,bool): return "boolean"
                  if isinstance(value,int): return "integer"
                  if isinstance(value,float): return "number"
                  if isinstance(value,str): return "string"
                  fail("Product response contains a non-JSON value")
              class DenyRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*_args,**_kwargs): return None
              def get(url,headers):
                  request=urllib.request.Request(url,headers=headers,method="GET")
                  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),DenyRedirect())
                  try:
                      response=opener.open(request,timeout=15)
                  except urllib.error.HTTPError as error:
                      response=error
                  except (urllib.error.URLError,TimeoutError):
                      fail("Loopback Product read request failed")
                  with response:
                      body=response.read(8*1024*1024+1)
                      if len(body)>8*1024*1024: fail("Loopback Product response exceeded the size limit")
                      if response.geturl()!=url: fail("Loopback Product read request changed route")
                      return int(response.status),body
              expected=json.load(__import__("sys").stdin)
              catalyst_url=expected["catalystUrl"]
              origin=expected["clientOrigin"]
              unit_path=Path(expected["unitPath"])
              cyrene_uid=pwd.getpwnam("cyrene").pw_uid
              cyrene_gid=grp.getgrnam("cyrene").gr_gid
              environment_path=Path("/etc/cyrene/studio-control.env")
              environment_raw=read_protected(environment_path,{(0,cyrene_gid,0o640)},65536)
              values={}
              for raw_line in environment_raw.decode("ascii").splitlines():
                  line=raw_line.strip()
                  if not line or line.startswith("#"): continue
                  key,separator,value=line.partition("=")
                  if not separator or key not in {"STUDIO_CATALYST_URL","STUDIO_CATALYST_API_TOKEN_FILE"} or key in values or not value or value!=value.strip():
                      fail("Control runtime environment file has an unexpected shape")
                  values[key]=value
              if set(values)!={"STUDIO_CATALYST_URL","STUDIO_CATALYST_API_TOKEN_FILE"}:
                  fail("Control runtime environment is missing its exact Catalyst endpoint/token-file keys")
              if values["STUDIO_CATALYST_URL"]!=catalyst_url:
                  fail("Installed Control Catalyst URL differs from the exact pinned service origin")
              parsed=urlsplit(values["STUDIO_CATALYST_URL"])
              if parsed.scheme!="http" or parsed.hostname!="127.0.0.1" or parsed.username or parsed.password or parsed.path or parsed.query or parsed.fragment:
                  fail("Installed Control Catalyst URL is not a loopback service origin")
              unit_lines=[line.strip() for line in unit_path.read_text(encoding="utf-8").splitlines()]
              public_origin_line="Environment=STUDIO_PUBLIC_ORIGINS=http://127.0.0.1:8100,http://localhost:8100"
              if unit_lines.count(public_origin_line)!=1 or any(line.startswith("Environment=STUDIO_PUBLIC_ORIGINS=") and line!=public_origin_line for line in unit_lines):
                  fail("Signed Control unit does not pin the exact loopback public origins")
              token_path=Path(values["STUDIO_CATALYST_API_TOKEN_FILE"])
              if not token_path.is_absolute() or ".." in token_path.parts:
                  fail("Control Catalyst token-file path is not absolute and normalized")
              token_raw=read_protected(token_path,{(0,cyrene_gid,0o640),(cyrene_uid,cyrene_gid,0o600)},4096)
              token=token_raw.rstrip(b"\r\n")
              if len(token)<32 or any(byte<33 or byte>126 for byte in token):
                  fail("Control Catalyst service token is not a protected high-entropy printable value")
              direct_status,direct_body=get(catalyst_url+"/api/v1/datasets",{"Accept":"application/json","Authorization":"Bearer "+token.decode("ascii")})
              proxy_status,proxy_body=get(origin+"/api/v1/catalyst/datasets",{"Accept":"application/json","Host":"127.0.0.1:8100","Origin":origin})
              if direct_status!=200: fail("Direct pinned Catalyst dataset read did not return HTTP 200")
              if proxy_status!=direct_status: fail("Client Catalyst proxy HTTP status differs from direct Catalyst")
              try:
                  direct_value=json.loads(direct_body.decode("utf-8"))
                  proxy_value=json.loads(proxy_body.decode("utf-8"))
              except (UnicodeDecodeError,json.JSONDecodeError):
                  fail("Direct Catalyst or Client proxy dataset response is not JSON")
              direct_shape=shape(direct_value)
              proxy_shape=shape(proxy_value)
              if direct_shape!=proxy_shape: fail("Client Catalyst proxy JSON schema differs from direct Catalyst")
              shape_raw=json.dumps(direct_shape,sort_keys=True,separators=(",",":")).encode("utf-8")
              print(json.dumps({
                  "controlEnvironmentUrlMatchesPinnedCatalyst":True,
                  "controlEnvironmentFileOwner":"root:cyrene",
                  "controlEnvironmentFileMode":"0640",
                  "tokenFileReadableByCyrene":True,
                  "publicOriginsPinnedBySignedUnit":True,
                  "directCatalystRead":{"status":direct_status,"bodyBytes":len(direct_body),"bodySha256":hashlib.sha256(direct_body).hexdigest()},
                  "clientCatalystProxy":{"status":proxy_status,"bodyBytes":len(proxy_body),"bodySha256":hashlib.sha256(proxy_body).hexdigest()},
                  "jsonSchemaSha256":hashlib.sha256(shape_raw).hexdigest(),
                  "jsonSchemaMatches":True,
                  "credentialsStored":False,
                  "datasetRecordsStored":False,
              },sort_keys=True,separators=(",",":")))
              ''').strip()
              proxy_result = run(
                  ["sudo", "-n", "python3", "-s", "-c", code],
                  label="client-control-product-proxy-readback", timeout=90,
                  input_text=json.dumps({
                      "catalystUrl": workload["service"]["baseUrl"],
                      "clientOrigin": origin,
                      "unitPath": str(unit_path),
                  }, separators=(",", ":")),
              )
              proxy_evidence = json.loads(proxy_result.stdout)
              require(proxy_evidence.get("controlEnvironmentUrlMatchesPinnedCatalyst") is True, "installed Control Catalyst endpoint is not pinned")
              require(proxy_evidence.get("publicOriginsPinnedBySignedUnit") is True, "installed Control public origin differs from signed loopback unit")
              require(proxy_evidence.get("jsonSchemaMatches") is True, "Client proxy and direct Catalyst JSON schemas differ")
              evidence = {
                  "componentId": control_pin["componentId"],
                  "targetId": control_pin["targetId"],
                  "version": control_pin["version"],
                  "releaseId": control_pin["releaseId"],
                  "manifestDigest": control_pin["manifestDigest"],
                  "artifactDigest": control_pin["digest"],
                  "activePointer": native["activeTarget"],
                  "activeReceiptSha256": control_rows[0]["immutableReceiptSha256"],
                  "systemdUnit": control_unit,
                  "systemdState": active_state,
                  "unitDigest": unit_digest,
                  "authSession": {"status": auth_status, "authenticated": True, "state": "AUTHENTICATED", "refreshable": False, "csrfTokenValidated": True, "csrfTokenStored": False},
                  "controlRuntimeConfig": {"catalystUrlMatchesPinnedService": True, "configOwner": proxy_evidence["controlEnvironmentFileOwner"], "configMode": proxy_evidence["controlEnvironmentFileMode"], "tokenFileReadableByCyrene": proxy_evidence["tokenFileReadableByCyrene"], "publicOriginsPinnedBySignedUnit": True},
                  "directCatalystRead": {"url": "/api/v1/datasets", **proxy_evidence["directCatalystRead"]},
                  "clientCatalystProxy": {"url": "/api/v1/catalyst/datasets", **proxy_evidence["clientCatalystProxy"]},
                  "jsonSchemaSha256": proxy_evidence["jsonSchemaSha256"],
                  "directAndProxyJsonSchemaMatch": True,
                  "datasetRecordsStored": False,
              }
              write_json(root() / "evidence" / "client-control-integration.json", evidence)
              return evidence

          def product_acceptance() -> None:
              """Exercise installed Catalyst APIs and independently validate the generated ZIP."""
              service = pins()["workloads"]["catalyst"]["service"]
              bundle_evidence = phase("catalyst_active_bundle_identity", bundle_identity)
              def health_gate() -> dict[str, Any]:
                  health = request_http(service["baseUrl"], service["healthPath"])
                  write_json(root() / "evidence" / "catalyst-healthz.json", health)
                  return {"url": health["url"], "status": health["status"], "contentType": health["contentType"]}
              phase("catalyst_http_liveness", health_gate)
              output_dir = root() / "catalyst-output"
              output_dir.mkdir(parents=True, exist_ok=True)
              environment = os.environ.copy()
              environment.pop("GH_TOKEN", None)
              environment.pop("GITHUB_TOKEN", None)
              environment["PYTHONPATH"] = bundle_evidence["activePath"] + "/python"
              def producer_gate() -> dict[str, Any]:
                  acceptance_command = [
                      PRIVATE_PYTHON, "-s", "-m", CATALYST_ACCEPTANCE_MODULE,
                      "--base-url", service["baseUrl"], "--output-directory", str(output_dir),
                  ]
                  produced = run(acceptance_command, label="installed-catalyst-acceptance-producer", timeout=900, env=environment, retain_output=False)
                  bundle_path = output_dir / "authored-business-sft.zip"
                  require(bundle_path.is_file() and bundle_path.stat().st_size > 0, "installed Catalyst producer did not create authored-business-sft.zip")
                  output_bytes = produced.stdout.encode("utf-8")
                  error_bytes = produced.stderr.encode("utf-8")
                  return {"module": CATALYST_ACCEPTANCE_MODULE, "baseUrl": service["baseUrl"], "stdoutBytes": len(output_bytes), "stdoutSha256": hashlib.sha256(output_bytes).hexdigest(), "stderrBytes": len(error_bytes), "stderrSha256": hashlib.sha256(error_bytes).hexdigest(), "outputDirectory": str(output_dir), "bundleName": bundle_path.name, "bundleSizeBytes": bundle_path.stat().st_size, "bundleSha256": sha256(bundle_path)}
              produced = phase("catalyst_installed_acceptance_producer", producer_gate)
              bundle_path = output_dir / produced["bundleName"]
              def consumer_gate() -> dict[str, Any]:
                  consumer_command = [PRIVATE_PYTHON, "-s", "-m", CATALYST_CONSUMER_MODULE, str(bundle_path)]
                  consumed = run(consumer_command, label="installed-catalyst-bundle-consumer", timeout=900, env=environment, retain_output=False)
                  output_bytes = consumed.stdout.encode("utf-8")
                  error_bytes = consumed.stderr.encode("utf-8")
                  evidence = {"module": CATALYST_CONSUMER_MODULE, "bundleName": bundle_path.name, "bundleSizeBytes": bundle_path.stat().st_size, "bundleSha256": sha256(bundle_path), "stdoutBytes": len(output_bytes), "stdoutSha256": hashlib.sha256(output_bytes).hexdigest(), "stderrBytes": len(error_bytes), "stderrSha256": hashlib.sha256(error_bytes).hexdigest()}
                  write_json(root() / "evidence" / "catalyst-generated-bundle-identity.json", {
                      "name": bundle_path.name, "sizeBytes": bundle_path.stat().st_size,
                      "sha256": evidence["bundleSha256"],
                  })
                  return evidence
              phase("catalyst_independent_bundle_consumer", consumer_gate)
              # The output ZIP stays outside artifacts because it can contain generated Product data.

          def restart_recovery() -> None:
              """Restart only the pinned Catalyst unit and prove it returns to HTTP service."""
              service = pins()["workloads"]["catalyst"]["service"]
              run(["sudo", "-n", "systemctl", "restart", service["unit"]], label="catalyst-systemd-restart", timeout=180)
              last_error = "service has not recovered"
              for _ in range(60):
                  active = subprocess.run(["systemctl", "is-active", "--quiet", service["unit"]], check=False)
                  try:
                      health = request_http(service["baseUrl"], service["healthPath"])
                      if active.returncode == 0:
                          write_json(root() / "evidence" / "catalyst-post-restart-healthz.json", health)
                          status = workload_request("status", workloadId="catalyst")
                          require(status.get("catalogDigest") == pins()["workloads"]["catalyst"]["catalogDigest"], "Catalyst catalog changed across service restart")
                          assert_installed_components(status.get("components", []), pins()["workloads"]["catalyst"]["selectedComponents"], "Catalyst post-restart status")
                          return {"unit": service["unit"], "systemdActive": True, "healthStatus": health["status"], "catalogDigest": status["catalogDigest"]}
                  except Exception as error:  # noqa: BLE001 - continue the bounded recovery wait.
                      last_error = str(error)
                  time.sleep(2)
              raise RuntimeError(f"Catalyst did not recover after systemd restart: {last_error}")

          def core_products() -> None:
              """Run acceptance, independent verification, and restart in dependency order."""
              product_acceptance()
              phase("catalyst_service_restart_recovery", restart_recovery)

          def finalize() -> None:
              """Explain every unreached gate and calculate runnable core completion."""
              value = ledger()
              phases = value.setdefault("phases", {})
              for name in PHASES:
                  if name not in phases:
                      phases[name] = {"status": "NOT_RUN", "reason": "no command recorded an outcome", "recordedAtUtc": utc_now(), "evidence": None}
              required = (
                  "runner_identity", "native_release_metadata", "native_release_provenance",
                  "catalog_provenance", "release_asset_integrity", "native_deb_install",
                  "native_static_binding_readback", "fresh_workload_inventory",
                  "catalyst_workload_check", "catalyst_exact_plan_pins", "version_conflict_gate",
                  "catalyst_workload_stage",
                  "catalyst_workload_apply", "catalyst_runtime_source_activation",
                  "plugins_platform_supervision",
                  "catalyst_active_receipt_readback",
                  "catalyst_installed_status_readback",
                  "catalyst_public_repeat_install", "catalyst_active_bundle_identity",
                  "catalyst_http_liveness", "client_static_web_http",
                  "catalyst_installed_acceptance_producer",
                  "catalyst_independent_bundle_consumer", "catalyst_service_restart_recovery",
                  "missing_selection_gate", "client_release_integration",
              )
              required = ("release_pins_validation", *required)
              value["requiredCorePass"] = all(phases[name]["status"] == "PASS" for name in required)
              value["requiredCoreFailures"] = [
                  name for name in required if phases[name]["status"] != "PASS"
              ]
              value["wholeHostAcceptance"] = "NOT_RUN"
              value["wholeHostAcceptanceReason"] = "whole-VM reboot recovery is not exercised on a disposable hosted runner"
              phase2_required = (
                  "version_conflict_gate",
                  "offline_retry_gate",
                  "installer_interrupted_transaction_recovery",
                  "host_reboot_recovery",
                  "echo_exact_match_evaluate_uninstall",
              )
              value["phase2RequiredPhases"] = list(phase2_required)
              value["phase2IncompletePhases"] = [
                  name for name in phase2_required if phases[name]["status"] != "PASS"
              ]
              value["phase2Acceptance"] = "INCOMPLETE" if value["phase2IncompletePhases"] else "PASS"
              full_distribution_required = (
                  *required,
                  "installer_interrupted_transaction_recovery",
                  "host_reboot_recovery",
                  "version_conflict_gate",
                  "offline_retry_gate",
                  "echo_exact_match_evaluate_uninstall",
                  "plugins_platform_supervision",
                  "client_release_integration",
              )
              full_distribution_required = tuple(dict.fromkeys(full_distribution_required))
              value["fullDistributionRequiredPhases"] = list(full_distribution_required)
              value["fullDistributionIncompletePhases"] = [
                  name for name in full_distribution_required if phases[name]["status"] != "PASS"
              ]
              value["fullDistributionAcceptance"] = "INCOMPLETE" if any(
                  phases[name]["status"] != "PASS" for name in full_distribution_required
              ) else "PASS"
              value["updatedAtUtc"] = utc_now()
              write_json(root() / "phase-ledger.json", value)
              Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
                  "# Modular distribution acceptance\n\n"
                  f"- Runnable Catalyst core: {'PASS' if value['requiredCorePass'] else 'INCOMPLETE'}\n"
                  f"- Phase 2 safety, reliability, and optional workloads: {value['phase2Acceptance']}\n"
                  f"- Full distribution acceptance: {value['fullDistributionAcceptance']}\n"
                  "- See phase-ledger.json for each PASS, FAIL, and NOT_RUN phase.\n",
                  encoding="utf-8",
              )
              print(f"Runnable Catalyst core complete: {value['requiredCorePass']}; full distribution acceptance: {value['fullDistributionAcceptance']}")
              if not value["requiredCorePass"]:
                  raise RuntimeError(f"required Catalyst core gates did not all pass: {value['requiredCoreFailures']}")

          def main() -> int:
              """Dispatch one workflow phase without accessing repository source."""
              parser = argparse.ArgumentParser()
              parser.add_argument("command", choices=("init", "preflight", "deb-install", "static-readback", "catalyst-core", "catalyst-products", "missing-selection", "finalize"))
              arguments = parser.parse_args()
              try:
                  if arguments.command == "init":
                      init()
                  elif arguments.command == "preflight":
                      preflight()
                  elif arguments.command == "deb-install":
                      phase("native_deb_install", dpkg_install)
                  elif arguments.command == "static-readback":
                      phase("native_static_binding_readback", static_binding_readback)
                  elif arguments.command == "catalyst-core":
                      catalyst_workload()
                  elif arguments.command == "catalyst-products":
                      core_products()
                  elif arguments.command == "missing-selection":
                      phase("missing_selection_gate", missing_required_selection)
                  else:
                      finalize()
              except Exception as error:  # noqa: BLE001 - the phase ledger is the durable failure record.
                  if arguments.command == "preflight":
                      record(PREFLIGHT_STAGE, "FAIL", f"{type(error).__name__}: {error}")
                  print(f"Acceptance phase failed: {error}", file=sys.stderr)
                  return 1
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          python3 "$ACCEPTANCE_ROOT/acceptance_driver.py" init

      - name: Verify exact immutable native release, v2 catalog, and DEB bytes
        id: verify-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$ACCEPTANCE_ROOT/acceptance_driver.py" preflight

      - name: Install the verified native Ubuntu 24.04 DEB
        shell: bash
        run: |
          set -euo pipefail
          python3 "$ACCEPTANCE_ROOT/acceptance_driver.py" deb-install

      - name: Read back the installed native catalog binding and package contract
        shell: bash
        run: |
          set -euo pipefail
          python3 "$ACCEPTANCE_ROOT/acceptance_driver.py" static-readback

      - name: Check, stage, apply, read back, and repeat Catalyst workload install
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$ACCEPTANCE_ROOT/acceptance_driver.py" catalyst-core

      - name: Run installed Catalyst HTTP, producer, consumer, and systemd restart acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 "$ACCEPTANCE_ROOT/acceptance_driver.py" catalyst-products

      - name: Verify the resolver rejects omission of a required Catalyst component
        shell: bash
        run: |
          set -euo pipefail
          python3 "$ACCEPTANCE_ROOT/acceptance_driver.py" missing-selection

      - name: Finalize phase ledger
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$ACCEPTANCE_ROOT/acceptance_driver.py" ]]; then
            python3 "$ACCEPTANCE_ROOT/acceptance_driver.py" finalize
          fi

      - name: Upload exact pins, receipts, plans, command logs, and phase ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-distribution-acceptance-${{ inputs.native_release_id }}
          path: |
            ${{ runner.temp }}/modular-distribution-v01/evidence/
            ${{ runner.temp }}/modular-distribution-v01/logs/
            ${{ runner.temp }}/modular-distribution-v01/phase-ledger.json
          if-no-files-found: warn
          retention-days: 90
