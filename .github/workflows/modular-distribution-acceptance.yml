          def missing_required_selection() -> dict[str, Any]:
              """Prove a required component cannot be excluded without staging or applying a plan."""
              workload = pins()["workloads"]["catalyst"]
              saved = load_json(root() / "evidence" / "catalyst-checked-plan.json")
              rows = saved.get("resolution", {}).get("selectedComponents", [])
              required = next(
                  (row.get("componentId") for row in rows if row.get("requiredness") == "required"),
                  None,
              )
              require(isinstance(required, str) and required, "checked Catalyst plan exposes no required component for the omission gate")
              sequence_before = WORKLOAD_REQUEST_SEQUENCE
              blocked = workload_request(
                  "check",
                  workloadId="catalyst",
                  targetId=workload["targetId"],
                  action="install",
                  selections={
                      "includeComponentIds": [],
                      "excludeComponentIds": [required],
                      "choices": {},
                  },
              )
              require(WORKLOAD_REQUEST_SEQUENCE == sequence_before + 1, "required omission gate sent unexpected follow-up workload requests")
              blocker_codes = {
                  row.get("code") for row in blocked.get("blockers", [])
                  if isinstance(row, dict)
              }
              require(blocked.get("status") == "blocked", "excluding a required Catalyst component did not block the plan")
              require("REQUIRED_COMPONENT_UNSELECTABLE" in blocker_codes, f"required omission returned unexpected blockers: {sorted(blocker_codes)}")
              require(not blocked.get("components"), "blocked omission unexpectedly selected install components")
              return {
                  "excludedRequiredComponent": required,
                  "status": blocked["status"],
                  "blockerCodes": sorted(blocker_codes),
                  "workloadRequests": 1,
                  "staged": False,
                  "applied": False,
              }

