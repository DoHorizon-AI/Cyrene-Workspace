          def catalyst_workload() -> None:
              """Check exact pins, apply one digest-bound plan, and prove repeat-install idempotence."""
              workload = pins()["workloads"]["catalyst"]
              def inventory() -> dict[str, Any]:
                  initial = workload_request("status", workloadId="catalyst")
                  rows = initial.get("components", [])
                  active = [row.get("componentId") for row in rows if isinstance(row, dict) and row.get("installed") is True]
                  require(not active, f"fresh runner already has active workload components: {active}")
                  require(initial.get("status") == "ready", "fresh Catalyst workload inventory is not ready")
                  require(initial.get("catalogDigest") == workload["catalogDigest"], "fresh Catalyst inventory catalog digest differs from pins")
                  return {"workloadId": "catalyst", "activeComponentsBeforeInstall": active, "catalogDigest": initial.get("catalogDigest")}
              phase("fresh_workload_inventory", inventory)
              selection = {"includeComponentIds": [], "excludeComponentIds": [], "choices": {}}
              def check_gate() -> dict[str, Any]:
                  checked = workload_request(
                      "check", preserve_read_token=True,
                      workloadId="catalyst", targetId=workload["targetId"],
                      action="install", selections=selection,
                  )
                  require(checked.get("status") == "ready", f"Catalyst workload check is not ready: {checked.get('blockers')}")
                  require(checked.get("workloadId") == "catalyst" and checked.get("targetId") == workload["targetId"], "Catalyst check workload/target identity differs")
                  require(checked.get("catalogDigest") == workload["catalogDigest"], "Catalyst check catalog digest differs from root pins")
                  require(checked.get("action") == "install", "Catalyst check action is not install")
                  return checked
              checked = phase("catalyst_workload_check", check_gate)
              def exact_plan() -> dict[str, Any]:
                  assert_selected_components(checked.get("components"), workload["selectedComponents"], "Catalyst check")
                  resolution = checked.get("resolution")
                  require(isinstance(resolution, dict), "Catalyst check has no resolver resolution")
                  require(resolution.get("catalogDigest") == workload["catalogDigest"], "Catalyst resolution catalog digest differs")
                  assert_selected_components(resolution.get("selectedComponents"), workload["selectedComponents"], "Catalyst resolver resolution")
                  require(re.fullmatch(r"plan-[0-9a-f]{32}", str(checked.get("planId", ""))) is not None, "Catalyst plan ID is malformed")
                  require(re.fullmatch(r"sha256:[0-9a-f]{64}", str(checked.get("planDigest", ""))) is not None, "Catalyst plan digest is malformed")
                  write_json(root() / "evidence" / "catalyst-checked-plan.json", checked)
                  return {"selectedComponents": workload["selectedComponents"], "planId": checked["planId"], "planDigest": checked["planDigest"]}
              phase("catalyst_exact_plan_pins", exact_plan)
              phase(
                  "version_conflict_gate",
                  lambda: version_conflict_readonly_check(checked, workload),
              )
              offline_retry = record_offline_stage_outcome(workload, checked)
              staged = phase(
                  "catalyst_workload_stage",
                  lambda: (
                      assert_staged_plan(
                          offline_retry["stagedResult"], workload, checked,
                          "Catalyst stage after isolated network attempt",
                      )
                      or offline_retry["stagedResult"]
                  ),
              )

              def apply_gate() -> dict[str, Any]:
                  applied = workload_request(
                      "apply", workloadId="catalyst", targetId=workload["targetId"],
                      action="install", planId=checked["planId"], planDigest=checked["planDigest"],
                      confirmation={"planId": checked["planId"], "planDigest": checked["planDigest"], "confirmed": True},
                  )
                  require(applied.get("status") in {"installed", "activated"}, f"Catalyst apply did not report an install/activation result: {applied.get('status')}")
                  require(applied.get("action") == "install", "Catalyst apply returned an action other than install")
                  require(applied.get("workloadId") == "catalyst" and applied.get("targetId") == workload["targetId"], "Catalyst apply returned a different workload or target")
                  require(applied.get("planId") == checked["planId"], "Catalyst apply returned a different or missing plan ID")
                  require(applied.get("planDigest") == checked["planDigest"], "Catalyst apply returned a different or missing plan digest")
                  assert_selected_components(applied.get("components"), workload["selectedComponents"], "Catalyst apply result")
                  return applied
              phase("catalyst_workload_apply", apply_gate)

              runtime_evidence = phase("catalyst_runtime_source_activation", runtime_source_activation)
              def plugin_supervision_gate() -> dict[str, Any]:
                  bindings = runtime_evidence.get("bindings")
                  expected = expected_catalyst_bindings(workload["selectedComponents"])
                  require(isinstance(bindings, list), "Catalyst runtime activation returned no verified plugin bindings")
                  actual = {row.get("bindingId"): row for row in bindings if isinstance(row, dict)}
                  require(len(actual) == len(bindings) and set(actual) == {row["bindingId"] for row in expected}, "Platform UDS active binding set differs from all four pinned plugins")
                  require(all(row.get("state") == "RUNNING" and row.get("activeInstallationId") in row.get("installationIds", []) for row in actual.values()), "a selected plugin is not Platform-supervised and active")
                  return {"sourceId": "cyrene-catalyst", "bindingCount": len(actual), "activeInstallationCount": sum(len(row["installationIds"]) for row in actual.values()), "allSelectedBindingsRunning": True}
              phase("plugins_platform_supervision", plugin_supervision_gate)

              phase(
