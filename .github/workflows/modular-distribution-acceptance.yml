name: Modular distribution clean-host acceptance

on:
  workflow_dispatch:
    inputs:
      native_release_id:
        description: Exact immutable native-installer-preview-<40 character source SHA> release tag
        required: true
        type: string
      release_pins_json:
        description: Exact expected release identities matching tooling/acceptance/modular-distribution-v01/release-pins-v1.schema.json
        required: true
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: modular-distribution-acceptance-${{ inputs.native_release_id }}
  cancel-in-progress: false

jobs:
  clean-host-acceptance:
    name: Fresh Ubuntu 24.04 native release acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      attestations: read
    env:
      NATIVE_RELEASE_ID: ${{ inputs.native_release_id }}

    steps:
      - name: Initialize the phase ledger and prove the runner is a clean host
        id: initialize
        shell: bash
        env:
          RELEASE_PINS_JSON: ${{ inputs.release_pins_json }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "DoHorizon-AI/Cyrene-Workspace" ]]
          [[ "$GITHUB_REF" == "refs/heads/develop" ]]
          export ACCEPTANCE_ROOT="$RUNNER_TEMP/modular-distribution-v01"
          printf 'ACCEPTANCE_ROOT=%s\n' "$ACCEPTANCE_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ACCEPTANCE_ROOT/evidence" "$ACCEPTANCE_ROOT/logs"
          cat > "$ACCEPTANCE_ROOT/acceptance_driver.py" <<'PY'
          """Runner-local native release verifier and installed-product acceptance driver."""

          from __future__ import annotations

          import argparse
          import base64
          import datetime as dt
          import hashlib
          import json
          import os
          import platform
          import re
          import shutil
          import subprocess
          import sys
          import textwrap
          import time
          import urllib.error
          import urllib.request
          from collections.abc import Callable
          from pathlib import Path
          from typing import Any

          REPOSITORY = "DoHorizon-AI/Cyrene-Workspace"
          NATIVE_WORKFLOW = f"{REPOSITORY}/.github/workflows/native-installer-release.yml"
          CATALOG_WORKFLOW = f"{REPOSITORY}/.github/workflows/component-catalog-release.yml"
          SLSA_PREDICATE = "https://slsa.dev/provenance/v1"
          WORKLOAD_PROTOCOL = "cyrene.workload-plan.v1"
          HOST_TARGET = "linux-ubuntu-24.04-x86_64"
          PRIVATE_PYTHON = "/opt/cyrene/python/3.12.14/bin/python3.12"
          CATALYST_ACCEPTANCE_MODULE = "cyrene_catalyst.external_acceptance"
          CATALYST_CONSUMER_MODULE = "cyrene_catalyst_consumer.training_bundle"
          CATALYST_REQUIRED_PLUGIN_IDS = frozenset(
              {
                  "cyrene-tools-dataset-generation",
                  "cyrene-tools-dataset-preparation",
                  "cyrene-tools-document-parsing",
                  "cyrene-tools-knowledge-preparation",
              }
          )
          WORKLOAD_REQUEST_SEQUENCE = 0
          PREFLIGHT_STAGE = "native_release_metadata"
          PHASES = (
              "release_pins_validation",
              "runner_identity",
              "native_release_metadata",
              "native_release_provenance",
              "catalog_provenance",
              "release_asset_integrity",
              "native_deb_install",
              "native_static_binding_readback",
              "fresh_workload_inventory",
              "catalyst_workload_check",
              "catalyst_exact_plan_pins",
              "catalyst_workload_stage",
              "catalyst_workload_apply",
              "catalyst_runtime_source_activation",
              "catalyst_active_receipt_readback",
              "catalyst_installed_status_readback",
              "catalyst_public_repeat_install",
              "catalyst_active_bundle_identity",
              "catalyst_http_liveness",
              "client_static_web_http",
              "catalyst_installed_acceptance_producer",
              "catalyst_independent_bundle_consumer",
              "catalyst_service_restart_recovery",
              "installer_interrupted_transaction_recovery",
              "host_reboot_recovery",
              "missing_selection_gate",
              "version_conflict_gate",
              "offline_retry_gate",
              "echo_exact_match_evaluate_uninstall",
              "plugins_platform_supervision",
              "client_release_integration",
          )

          def root() -> Path:
              """Return the per-job evidence directory."""
              return Path(os.environ["ACCEPTANCE_ROOT"])

          def utc_now() -> str:
              """Return a stable UTC timestamp for one ledger update."""
              return dt.datetime.now(dt.UTC).isoformat()

          def load_json(path: Path) -> Any:
              """Load UTF-8 JSON while rejecting duplicate keys."""
              def unique(pairs: list[tuple[str, Any]]) -> dict[str, Any]:
                  value: dict[str, Any] = {}
                  for key, item in pairs:
                      if key in value:
                          raise ValueError(f"duplicate JSON key: {key}")
                      value[key] = item
                  return value

              return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=unique)

          def write_json(path: Path, value: Any) -> None:
              """Atomically write one evidence JSON document."""
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary = path.with_suffix(path.suffix + ".tmp")
              temporary.write_text(
                  json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              os.replace(temporary, path)

          def ledger() -> dict[str, Any]:
              """Load the current phase ledger."""
              path = root() / "phase-ledger.json"
              return load_json(path) if path.is_file() else {"schemaVersion": 1, "phases": {}}

          def record(phase: str, status: str, reason: str, evidence: Any = None) -> None:
              """Persist one phase result without overwriting another phase's evidence."""
              value = ledger()
              value.setdefault("phases", {})[phase] = {
                  "status": status,
                  "reason": reason,
                  "recordedAtUtc": utc_now(),
                  "evidence": evidence,
              }
              value["updatedAtUtc"] = utc_now()
              write_json(root() / "phase-ledger.json", value)

          def phase(name: str, operation: Callable[[], Any]) -> Any:
              """Run a gate and save its evidence or failure before returning."""
              try:
                  evidence = operation()
              except Exception as error:
                  record(name, "FAIL", f"{type(error).__name__}: {error}")
                  print(f"FAIL {name}: {error}", file=sys.stderr)
                  raise
              record(name, "PASS", "gate completed", evidence)
              print(f"PASS {name}")
              return evidence

          def run(
              command: list[str],
              *,
              label: str,
              input_text: str | None = None,
              timeout: int = 1800,
              env: dict[str, str] | None = None,
              cwd: Path | None = None,
              retain_output: bool = True,
          ) -> subprocess.CompletedProcess[str]:
              """Run a command and retain raw output only when the phase permits it."""
              completed = subprocess.run(
                  command,
                  input=input_text,
                  text=True,
                  capture_output=True,
                  timeout=timeout,
                  check=False,
                  env=env,
                  cwd=cwd,
              )
              safe = re.sub(r"[^A-Za-z0-9._-]", "_", label)
              if retain_output:
                  (root() / "logs" / f"{safe}.stdout.txt").write_text(
                      completed.stdout, encoding="utf-8"
                  )
                  (root() / "logs" / f"{safe}.stderr.txt").write_text(
                      completed.stderr, encoding="utf-8"
                  )
              if completed.returncode != 0:
                  if retain_output:
                      tail = completed.stderr.strip()[-1000:] or completed.stdout.strip()[-1000:]
                      raise RuntimeError(f"{label} exited {completed.returncode}: {tail}")
                  raise RuntimeError(f"{label} exited {completed.returncode}; raw Product output was withheld")
              return completed

          def pins() -> dict[str, Any]:
              """Read pins already copied to the acceptance directory."""
              return load_json(root() / "release-pins-v1.json")

          def sha256(path: Path) -> str:
              """Hash a regular file in bounded chunks."""
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def require(condition: bool, message: str) -> None:
              """Raise a readable acceptance failure when an identity does not match."""
              if not condition:
                  raise RuntimeError(message)

          def runner_identity() -> dict[str, Any]:
              """Record the actual VM boundary and require Ubuntu 24.04 x86_64 systemd."""
              os_release = {}
              for line in Path("/etc/os-release").read_text(encoding="utf-8").splitlines():
                  key, separator, value = line.partition("=")
                  if separator:
                      os_release[key] = value.strip().strip('"')
              facts = {
                  "osRelease": os_release,
                  "machine": platform.machine(),
                  "uname": platform.uname()._asdict(),
                  "pid1": Path("/proc/1/comm").read_text(encoding="utf-8").strip(),
                  "runnerImageOS": os.environ.get("ImageOS"),
                  "runnerImageVersion": os.environ.get("ImageVersion"),
                  "workflowRef": os.environ.get("GITHUB_WORKFLOW_REF"),
                  "workflowSha": os.environ.get("GITHUB_WORKFLOW_SHA"),
                  "workflowRepository": os.environ.get("GITHUB_REPOSITORY"),
                  "workflowGitRef": os.environ.get("GITHUB_REF"),
                  "uid": os.getuid(),
                  "sudoNoninteractive": False,
              }
              require(os_release.get("ID") == "ubuntu", "runner is not Ubuntu")
              require(os_release.get("VERSION_ID") == "24.04", "runner is not Ubuntu 24.04")
              require(platform.machine().lower() in {"x86_64", "amd64"}, "runner is not x86_64")
              require(facts["workflowRepository"] == REPOSITORY, "acceptance workflow is not running from the canonical repository")
              require(facts["workflowGitRef"] == "refs/heads/develop", "acceptance workflow must run from the develop integration branch")
              require(re.fullmatch(r"[0-9a-f]{40}", str(facts["workflowSha"])) is not None, "acceptance workflow SHA is missing or malformed")
              require(facts["pid1"] == "systemd", f"PID 1 is {facts['pid1']}, not systemd")
              run(["sudo", "-n", "true"], label="sudo-preflight", timeout=30)
              facts["sudoNoninteractive"] = True
              write_json(root() / "evidence" / "runner-identity.json", facts)
              return facts

          def init() -> None:
              """Initialize all required outcomes as NOT_RUN until an observed command changes them."""
              base = root()
              (base / "evidence").mkdir(parents=True, exist_ok=True)
              (base / "logs").mkdir(parents=True, exist_ok=True)
              statuses = {
                  name: {
                      "status": "NOT_RUN",
                      "reason": "gate has not been reached",
                      "recordedAtUtc": utc_now(),
                      "evidence": None,
                  }
                  for name in PHASES
              }
              write_json(base / "phase-ledger.json", {"schemaVersion": 1, "phases": statuses})
              raw = os.environ.get("RELEASE_PINS_JSON", "")
              require(bool(raw), "release_pins_json input is empty")
              pins_path = base / "release-pins-v1.json"
              pins_path.write_text(raw + "\n", encoding="utf-8")
              shutil.copy2(pins_path, base / "evidence" / "release-pins-v1.json")
              phase("release_pins_validation", lambda: (
                  validate_pin_shape(load_json(pins_path)) or {"schemaVersion": 1, "status": "valid"}
              ))
              if "echo" in load_json(pins_path)["workloads"]:
                  record(
                      "echo_exact_match_evaluate_uninstall",
                      "FAIL",
                      "optional Echo pins are not executable until the signed OCI installer, installed evaluator, and safe uninstall contracts are integrated",
                  )
                  raise RuntimeError("Echo pins are schema-valid but this workflow revision cannot execute the installed Echo lifecycle")
              phase("runner_identity", runner_identity)
              record("host_reboot_recovery", "NOT_RUN", "the disposable GitHub-hosted VM is not rebooted by this job")
              record("version_conflict_gate", "NOT_RUN", "runs against the read-only exact Catalyst resolution before staging")
              record("offline_retry_gate", "NOT_RUN", "runs after the exact workload plan is checked using a network-isolated stage subprocess")
              record("installer_interrupted_transaction_recovery", "NOT_RUN", "no official deferred-transaction fault-injection and resume contract is published; acceptance never edits installer journals")
              record("client_static_web_http", "NOT_RUN", "runs after the selected static-Web release has been installed and its exact host receipt is available")
              record("echo_exact_match_evaluate_uninstall", "NOT_RUN", "no exact Echo OCI, Runtime SDK, and exact-match plugin pins are supplied")
              record("plugins_platform_supervision", "NOT_RUN", "runs after exact Package Runtime policy and Platform UDS binding readback")
              record("client_release_integration", "NOT_RUN", "Client publication/integration gate is not yet supplied")

          def validate_pin_shape(value: Any) -> None:
              """Fail before mutation if required exact identity assertions are missing."""
              require(isinstance(value, dict) and value.get("schemaVersion") == 1, "pins schemaVersion must be 1")
              require(set(value) == {"schemaVersion", "nativeInstaller", "catalog", "workloads"}, "pins top-level fields differ from schema")
              native = value["nativeInstaller"]
              expected_native_fields = {
                  "releaseId", "sourceRepository", "sourceRef", "sourceCommit", "workflow",
                  "targetId", "debAssetName", "debSha256", "debSizeBytes",
              }
              require(isinstance(native, dict) and set(native) == expected_native_fields, "nativeInstaller pin shape differs from schema")
              require(native["sourceRepository"] == REPOSITORY, "native installer repository pin is invalid")
              require(native["sourceRef"] == "refs/heads/develop", "native installer source ref must be develop")
              require(native["workflow"] == NATIVE_WORKFLOW, "native installer workflow pin is invalid")
              require(native["targetId"] == "linux-ubuntu-24.04-x86_64-python-3.12", "native target pin is invalid")
              require(re.fullmatch(r"native-installer-preview-[0-9a-f]{40}", native["releaseId"]) is not None, "native release ID must be an exact preview source tag")
              require(native["releaseId"] == os.environ["NATIVE_RELEASE_ID"], "dispatch tag and nativeInstaller.releaseId pin differ")
              require(re.fullmatch(r"[0-9a-f]{40}", native["sourceCommit"]) is not None, "native source commit must be a full SHA")
              require(native["releaseId"].endswith(native["sourceCommit"]), "native release tag does not bind the pinned source SHA")
              require(re.fullmatch(r"[0-9a-f]{64}", native["debSha256"]) is not None, "native DEB pin must be a raw SHA-256")
              require(type(native["debSizeBytes"]) is int and native["debSizeBytes"] > 0, "native DEB size pin is invalid")
              require(re.fullmatch(r"cyrene_[A-Za-z0-9.+~:-]+_ubuntu-24\.04_amd64\.deb", native["debAssetName"]) is not None, "native DEB asset name is not canonical")
              catalog = value["catalog"]
              expected_catalog_fields = {
                  "releaseId", "repository", "workflow", "sourceRef", "sourceCommit", "assetName", "sha256",
                  "sizeBytes", "attestationAssetName", "attestationSha256", "schemaVersion", "generation",
              }
              require(isinstance(catalog, dict) and set(catalog) == expected_catalog_fields, "catalog pin shape differs from schema")
              require(catalog["repository"] == REPOSITORY and catalog["workflow"] == CATALOG_WORKFLOW, "catalog publisher identity pin is invalid")
              require(catalog["sourceRef"] == "refs/heads/develop", "catalog source ref must be develop")
              require(re.fullmatch(r"[0-9a-f]{40}", catalog["sourceCommit"]) is not None, "catalog source commit must be a full SHA")
              require(re.fullmatch(r"catalog-v2-preview-[0-9a-f]{40}", catalog["releaseId"]) is not None, "catalog tag must pin a v2 preview source SHA")
              require(catalog["releaseId"].endswith(catalog["sourceCommit"]), "catalog tag does not bind its pinned source SHA")
              require(catalog["assetName"] == "component-catalog-v2.json" and catalog["schemaVersion"] == 2, "catalog v2 asset/schema pin is invalid")
              require(catalog["attestationAssetName"] == "component-catalog-v2.json.attestation.jsonl", "catalog attestation asset pin is invalid")
              for field in ("sha256", "attestationSha256"):
                  require(re.fullmatch(r"[0-9a-f]{64}", str(catalog[field])) is not None, f"catalog {field} must be raw SHA-256")
              require(type(catalog["sizeBytes"]) is int and catalog["sizeBytes"] > 0, "catalog size pin is invalid")
              require(type(catalog["generation"]) is int and catalog["generation"] > 0, "catalog generation pin is invalid")
              workloads = value["workloads"]
              require(isinstance(workloads, dict) and "catalyst" in workloads, "Catalyst workload pins are required")
              require(set(workloads) <= {"catalyst", "plugins", "echo"}, "workload pins contain an unsupported workload")
              for workload_id, workload in workloads.items():
                  required_workload_fields = {"workloadId", "targetId", "catalogDigest", "selectedComponents"}
                  if workload_id == "catalyst":
                      required_workload_fields.add("service")
                  require(isinstance(workload, dict) and set(workload) == required_workload_fields, f"{workload_id} workload pin shape differs from schema")
                  require(workload.get("workloadId") == workload_id, f"{workload_id} workload ID pin differs")
                  require(workload.get("targetId") == HOST_TARGET, f"{workload_id} workload target pin differs")
                  require(workload.get("catalogDigest") == "sha256:" + catalog["sha256"], f"{workload_id} catalog digest pin differs from signed catalog bytes")
                  rows = workload.get("selectedComponents")
                  require(isinstance(rows, list) and rows, f"{workload_id} has no selected component identity pins")
                  component_ids = [row.get("componentId") for row in rows if isinstance(row, dict)]
                  require(len(component_ids) == len(rows) and len(component_ids) == len(set(component_ids)), f"{workload_id} component pins are malformed or duplicated")
                  if workload_id == "catalyst":
                      required_components = {
                          "cyrene-catalyst",
                          "cyrene-client-workspace-control",
                          "cyrene-client-workspace-web",
                          "cyrene-runtime-maintenance-sdk",
                          *CATALYST_REQUIRED_PLUGIN_IDS,
                      }
                      require(
                          required_components <= set(component_ids),
                          "Catalyst acceptance pins must include Node 24 Client Control, the Client Web host, Runtime SDK, and all four Platform-supervised data plugins",
                      )
                      control_pin = next(
                          row for row in rows
                          if row["componentId"] == "cyrene-client-workspace-control"
                      )
                      require(
                          control_pin.get("targetId") == "linux-ubuntu-24.04-x86_64-node-24",
                          "Client Control pin must use the Ubuntu 24.04 Node 24 target",
                      )
                  if workload_id == "echo":
                      echo_targets = {
                          "cyrene-echo": "linux-ubuntu-24.04-x86_64-oci",
                          "cyrene-runtime-maintenance-sdk": "linux-ubuntu-24.04-x86_64-python-3.12-library",
                          "cyrene-evaluation-exact-match": "linux-ubuntu-24.04-x86_64-python-3.12",
                      }
                      echo_rows = {row["componentId"]: row for row in rows}
                      require(
                          set(echo_targets) <= set(echo_rows),
                          "optional Echo pins must include the OCI Product, Runtime SDK, and exact-match plugin identities",
                      )
                      for component_id, target_id in echo_targets.items():
                          require(
                              echo_rows[component_id].get("targetId") == target_id,
                              f"Echo pin target differs for {component_id}",
                          )
                  if workload_id == "plugins":
                      plugin_targets = {
                          "cyrene-evaluation-exact-match": "linux-ubuntu-24.04-x86_64-python-3.12",
                          "cyrene-runtime-maintenance-sdk": "linux-ubuntu-24.04-x86_64-python-3.12-library",
                      }
                      plugin_rows = {row["componentId"]: row for row in rows}
                      require(
                          set(plugin_rows) == set(plugin_targets),
                          "standalone plugins pins must contain only exact-match and the required Runtime SDK identities",
                      )
                      for component_id, target_id in plugin_targets.items():
                          require(
                              plugin_rows[component_id].get("targetId") == target_id,
                              f"standalone plugins pin target differs for {component_id}",
                          )
                  for row in rows:
                      required_component_fields = {
                          "componentId", "targetId", "version", "releaseId", "manifestDigest",
                          "manifestAssetDigest", "digest", "publisherIdentity", "indexIdentity",
                          "attestationRef",
                      }
                      require(set(row) == required_component_fields, f"{workload_id} component pin has unexpected fields")
                      require(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+~-]{0,127}", str(row["version"])) is not None, f"{workload_id} {row['componentId']} version is not a safe immutable path segment")
                      for digest_field in ("manifestDigest", "manifestAssetDigest", "digest"):
                          require(re.fullmatch(r"sha256:[0-9a-f]{64}", row[digest_field]) is not None, f"{workload_id} {row['componentId']} has malformed {digest_field}")
                      publisher = row["publisherIdentity"]
                      require(isinstance(publisher, dict) and {"repository", "workflow"} <= set(publisher) <= {"id", "repository", "workflow", "tagFormat"}, f"{workload_id} {row['componentId']} publisher pin is malformed")
                      index = row["indexIdentity"]
                      index_fields = {"publisherIdentity", "repository", "assetName", "assetUri", "assetDigest", "indexDigest", "channel", "releaseTag"}
                      require(isinstance(index, dict) and {"repository", "assetName", "assetDigest", "indexDigest", "releaseTag"} <= set(index) <= index_fields, f"{workload_id} {row['componentId']} index pin is malformed")
                      require(index["assetName"] == "component-release-index-v1.json", f"{workload_id} {row['componentId']} index asset is not canonical")
                      for digest_field in ("assetDigest", "indexDigest"):
                          require(re.fullmatch(r"sha256:[0-9a-f]{64}", index[digest_field]) is not None, f"{workload_id} {row['componentId']} has malformed index {digest_field}")
                      proof = row["attestationRef"]
                      proof_fields = {"repository", "workflow", "sourceCommit", "subjectDigest", "subjectName", "sourceRef", "predicateType"}
                      require(isinstance(proof, dict) and {"repository", "workflow", "sourceCommit", "subjectDigest"} <= set(proof) <= proof_fields, f"{workload_id} {row['componentId']} attestation pin is malformed")
                      require(re.fullmatch(r"[0-9a-f]{40}", proof["sourceCommit"]) is not None, f"{workload_id} {row['componentId']} attestation source commit is malformed")
                      require(re.fullmatch(r"sha256:[0-9a-f]{64}", proof["subjectDigest"]) is not None, f"{workload_id} {row['componentId']} attestation subject digest is malformed")
              catalyst = workloads["catalyst"]
              require(catalyst.get("service") == {
                  "unit": "cyrene-catalyst.service",
                  "baseUrl": catalyst.get("service", {}).get("baseUrl"),
                  "healthPath": "/healthz",
              }, "Catalyst service pin shape differs from schema")
              service_match = re.fullmatch(r"http://127\.0\.0\.1:([0-9]{1,5})", str(catalyst["service"]["baseUrl"]))
              require(service_match is not None and 1 <= int(service_match.group(1)) <= 65535, "Catalyst URL must be loopback HTTP with a valid port")
              require("cyrene-catalyst" in {row["componentId"] for row in catalyst["selectedComponents"]}, "Catalyst pins must include cyrene-catalyst")
          def verify_attestation(path: Path, bundle: Path, repository: str, workflow: str, source_ref: str, source_commit: str, label: str) -> None:
              """Verify one detached SLSA bundle against the exact publisher workflow and source."""
              output = run(
                  [
                      "gh", "attestation", "verify", str(path), "--bundle", str(bundle),
                      "--repo", repository, "--signer-workflow", workflow,
                      "--source-ref", source_ref, "--source-digest", source_commit,
                      "--predicate-type", SLSA_PREDICATE,
                      "--cert-oidc-issuer", "https://token.actions.githubusercontent.com",
                      "--format", "json",
                  ],
                  label=f"attestation-{label}",
                  timeout=300,
              )
              write_json(root() / "evidence" / f"attestation-{label}.json", json.loads(output.stdout))

          def preflight() -> None:
              """Download and verify only the exact immutable official native release."""
              global PREFLIGHT_STAGE
              value = pins()
              native = value["nativeInstaller"]
              catalog_pin = value["catalog"]
              release_id = os.environ["NATIVE_RELEASE_ID"]
              asset_dir = root() / "downloads"
              asset_dir.mkdir(parents=True, exist_ok=True)
              safe_env = os.environ.copy()
              PREFLIGHT_STAGE = "native_release_metadata"
              require(bool(safe_env.get("GH_TOKEN")), "read-only GH_TOKEN is not available")

              def metadata_gate() -> dict[str, Any]:
                  release = json.loads(
                      run(
                          ["gh", "api", f"repos/{REPOSITORY}/releases/tags/{release_id}"],
                          label="native-release-api", timeout=120, env=safe_env,
                      ).stdout
                  )
                  require(release.get("tag_name") == release_id, "GitHub returned a different native tag")
                  require(release.get("immutable") is True, "native release is not immutable")
                  require(release.get("draft") is False and release.get("prerelease") is True, "native release must be a published preview")
                  assets = release.get("assets")
                  require(isinstance(assets, list) and assets, "native release has no assets")
                  names = [row.get("name") for row in assets if isinstance(row, dict)]
                  require(len(names) == len(assets) and len(names) == len(set(names)), "native release asset names are malformed or duplicated")
                  for name in names:
                      require(isinstance(name, str) and Path(name).name == name and "/" not in name and "\\" not in name, "native release contains an unsafe asset name")
                  write_json(root() / "evidence" / "native-release-api.json", release)
                  gh_env = safe_env.copy()
                  run(
                      ["gh", "release", "download", release_id, "--repo", REPOSITORY, "--dir", str(asset_dir)],
                      label="native-release-download", timeout=900, env=gh_env,
                  )
                  for row in assets:
                      path = asset_dir / row["name"]
                      require(path.is_file() and not path.is_symlink(), f"native release asset was not downloaded: {row['name']}")
                      require(path.stat().st_size == row.get("size"), f"GitHub asset size differs: {row['name']}")
                  return release

              release = phase("native_release_metadata", metadata_gate)
              PREFLIGHT_STAGE = "native_release_provenance"
              manifest_path = asset_dir / "native-installer-release-v2.json"
              receipt_path = asset_dir / "native-installer-source-receipt-v2.json"
              checksums_path = asset_dir / "SHA256SUMS"
              require(manifest_path.is_file() and receipt_path.is_file() and checksums_path.is_file(), "native release is missing canonical manifest, source receipt, or checksum asset")
              manifest = load_json(manifest_path)
              receipt = load_json(receipt_path)
              require(manifest.get("schemaVersion") == 2 and receipt.get("schemaVersion") == 2, "native release must use the v2 manifest/receipt pair")
              source = manifest.get("source")
              require(manifest.get("repository") == REPOSITORY, "native manifest repository differs")
              require(manifest.get("releaseId") == release_id, "native manifest release ID differs")
              require(manifest.get("workflow") == NATIVE_WORKFLOW, "native manifest publisher workflow differs")
              require(source == {"repository": REPOSITORY, "ref": native["sourceRef"], "commit": native["sourceCommit"]}, "native manifest source identity differs from root pins")
              require(manifest.get("channel") == "preview", "native release is not a preview channel")
              require(receipt.get("workspaceSource") == {
                  "repository": REPOSITORY,
                  "ref": native["sourceRef"],
                  "commit": native["sourceCommit"],
                  "workflow": NATIVE_WORKFLOW,
              }, "native source receipt is not bound to the exact pinned Workspace source")
              manifest_source_receipt = manifest.get("sourceReceipt")
              require(isinstance(manifest_source_receipt, dict), "native manifest has no source receipt identity")
              require(manifest_source_receipt.get("assetName") == receipt_path.name, "native source receipt asset name differs")
              require(manifest_source_receipt.get("sha256") == sha256(receipt_path), "native source receipt digest differs from manifest")
              require(manifest_source_receipt.get("sizeBytes") == receipt_path.stat().st_size, "native source receipt size differs from manifest")
              target_rows = [
                  row for row in manifest.get("targets", [])
                  if isinstance(row, dict) and row.get("targetId") == native["targetId"]
              ]
              require(len(target_rows) == 1, "native manifest must contain exactly one pinned Ubuntu 24.04 target")
              target = target_rows[0]
              require(target.get("assetName") == native["debAssetName"], "native target asset name differs from root pins")
              require(target.get("sha256") == native["debSha256"], "native target SHA differs from root pins")
              require(target.get("sizeBytes") == native["debSizeBytes"], "native target size differs from root pins")
              deb_path = asset_dir / native["debAssetName"]
              require(deb_path.is_file(), "pinned native DEB was not downloaded")
              require(deb_path.stat().st_size == native["debSizeBytes"], "downloaded native DEB size differs from pins")
              require(sha256(deb_path) == native["debSha256"], "downloaded native DEB digest differs from pins")
              write_json(root() / "evidence" / "native-deb-identity.json", {
                  "releaseId": release_id,
                  "assetName": deb_path.name,
                  "sizeBytes": deb_path.stat().st_size,
                  "sha256": sha256(deb_path),
                  "targetId": native["targetId"],
              })

              manifest_catalogs = manifest.get("workspaceCatalogs")
              receipt_catalogs = receipt.get("releaseInputs", {}).get("workspaceCatalogs")
              require(
                  isinstance(manifest_catalogs, dict)
                  and set(manifest_catalogs) == {"baselineV1", "activeV2"}
                  and isinstance(receipt_catalogs, dict)
                  and set(receipt_catalogs) == {"baselineV1", "activeV2"},
                  "native v2 release does not bind both baseline and active Workspace catalogs",
              )
              require(manifest.get("workspaceCatalog") == manifest_catalogs["baselineV1"], "native manifest v1 compatibility projection differs from baselineV1")
              baseline_projection = {key: value for key, value in receipt_catalogs["baselineV1"].items() if key != "generation"}
              require(receipt.get("releaseInputs", {}).get("workspaceCatalog") == baseline_projection, "native receipt v1 compatibility projection differs from baselineV1")
              catalog = manifest_catalogs["activeV2"]
              receipt_catalog = receipt_catalogs["activeV2"]
              require(isinstance(catalog, dict) and isinstance(receipt_catalog, dict), "native release does not bind its active Workspace catalog")
              require(catalog.get("assetName") == catalog_pin["assetName"], "native manifest catalog asset differs from root pins")
              require(catalog.get("sha256") == catalog_pin["sha256"], "native manifest catalog digest differs from root pins")
              require(catalog.get("sizeBytes") == catalog_pin["sizeBytes"], "native manifest catalog size differs from root pins")
              require(catalog.get("attestationAssetName") == catalog_pin["attestationAssetName"], "native manifest catalog bundle name differs from root pins")
              require(catalog.get("attestationSha256") == catalog_pin["attestationSha256"], "native manifest catalog bundle SHA differs from root pins")
              require(receipt_catalog.get("repository") == catalog_pin["repository"], "native receipt catalog repository differs from pins")
              require(receipt_catalog.get("workflow") == catalog_pin["workflow"], "native receipt catalog workflow differs from pins")
              require(receipt_catalog.get("releaseId") == catalog_pin["releaseId"], "native receipt catalog release tag differs from pins")
              require(receipt_catalog.get("source") == {"ref": catalog_pin["sourceRef"], "commit": catalog_pin["sourceCommit"]}, "native receipt catalog source differs from pins")
              require(receipt_catalog.get("assetName") == catalog_pin["assetName"], "native receipt catalog asset differs from pins")
              require(receipt_catalog.get("sha256") == catalog_pin["sha256"], "native receipt catalog SHA differs from pins")
              require(receipt_catalog.get("attestationBundleSha256") == catalog_pin["attestationSha256"], "native receipt catalog attestation SHA differs from pins")
              catalog_path = asset_dir / catalog_pin["assetName"]
              catalog_bundle_path = asset_dir / catalog_pin["attestationAssetName"]
              require(catalog_path.is_file() and catalog_bundle_path.is_file(), "native release is missing the pinned v2 catalog or detached bundle")
              require(catalog_path.stat().st_size == catalog_pin["sizeBytes"] and sha256(catalog_path) == catalog_pin["sha256"], "catalog asset bytes differ from exact pins")
              require(catalog_bundle_path.stat().st_size > 0 and sha256(catalog_bundle_path) == catalog_pin["attestationSha256"], "catalog attestation bundle differs from exact pins")
              catalog_doc = load_json(catalog_path)
              require(catalog_doc.get("schemaVersion") == catalog_pin["schemaVersion"] and catalog_doc.get("generation") == catalog_pin["generation"], "catalog schema/generation differs from pins")
              def attestations() -> dict[str, Any]:
                  for path, label in ((manifest_path, "native-manifest"), (receipt_path, "native-source-receipt"), (deb_path, "native-deb")):
                      bundle = asset_dir / f"{path.name}.attestation.jsonl"
                      require(bundle.is_file() and bundle.stat().st_size > 0, f"missing native detached SLSA bundle: {bundle.name}")
                      verify_attestation(path, bundle, REPOSITORY, NATIVE_WORKFLOW, native["sourceRef"], native["sourceCommit"], label)
                  return {"manifest": "verified", "sourceReceipt": "verified", "deb": "verified"}
              phase("native_release_provenance", lambda: {
                  "releaseId": release_id,
                  "source": source,
                  "workflow": manifest["workflow"],
                  "releaseDatabaseId": release.get("id"),
                  "immutable": release["immutable"],
                  "subjects": attestations(),
              })

              PREFLIGHT_STAGE = "catalog_provenance"
              def catalog_attestation() -> dict[str, Any]:
                  official_catalog_release = json.loads(
                      run(
                          ["gh", "api", f"repos/{catalog_pin['repository']}/releases/tags/{catalog_pin['releaseId']}"],
                          label="workspace-catalog-v2-release-api",
                          timeout=120,
                          env=safe_env,
                      ).stdout
                  )
                  require(official_catalog_release.get("tag_name") == catalog_pin["releaseId"], "official catalog API returned a different release tag")
                  require(official_catalog_release.get("immutable") is True, "official catalog release is not immutable")
                  require(official_catalog_release.get("draft") is False and official_catalog_release.get("prerelease") is True, "official catalog release must be a published preview")
                  catalog_assets = official_catalog_release.get("assets")
                  require(isinstance(catalog_assets, list), "official catalog release has no asset list")
                  catalog_asset_rows = {row.get("name"): row for row in catalog_assets if isinstance(row, dict)}
                  require(len(catalog_asset_rows) == len(catalog_assets), "official catalog release asset list is malformed or duplicated")
                  require(
                      set(catalog_asset_rows)
                      == {catalog_pin["assetName"], catalog_pin["attestationAssetName"]},
                      "official catalog release has unexpected or missing assets",
                  )
                  for asset_name, expected_size in (
                      (catalog_pin["assetName"], catalog_pin["sizeBytes"]),
                      (catalog_pin["attestationAssetName"], None),
                  ):
                      row = catalog_asset_rows.get(asset_name)
                      require(isinstance(row, dict), f"official catalog release is missing {asset_name}")
                      require(row.get("state") == "uploaded", f"official catalog asset is not uploaded: {asset_name}")
                      expected_digest = (
                          catalog_pin["sha256"]
                          if asset_name == catalog_pin["assetName"]
                          else catalog_pin["attestationSha256"]
                      )
                      require(row.get("digest") == "sha256:" + expected_digest, f"official catalog API digest differs for {asset_name}")
                      if expected_size is not None:
                          require(row.get("size") == expected_size, f"official catalog API size differs for {asset_name}")
                      else:
                          require(type(row.get("size")) is int and row["size"] > 0, f"official catalog API size is invalid for {asset_name}")
                  official_dir = root() / "downloads" / "official-catalog-v2"
                  official_dir.mkdir(parents=True, exist_ok=True)
                  run(
                      ["gh", "release", "download", catalog_pin["releaseId"], "--repo", catalog_pin["repository"], "--dir", str(official_dir), "--pattern", catalog_pin["assetName"], "--pattern", catalog_pin["attestationAssetName"]],
                      label="workspace-catalog-v2-release-download",
                      timeout=300,
                      env=safe_env,
                  )
                  official_catalog = official_dir / catalog_pin["assetName"]
                  official_bundle = official_dir / catalog_pin["attestationAssetName"]
                  require(official_catalog.is_file() and official_bundle.is_file(), "official catalog release assets were not downloaded")
                  require(official_catalog.stat().st_size == catalog_pin["sizeBytes"] and sha256(official_catalog) == catalog_pin["sha256"], "official catalog release bytes differ from exact pins")
                  require(official_bundle.stat().st_size == catalog_asset_rows[catalog_pin["attestationAssetName"]]["size"], "official catalog bundle size differs from GitHub release metadata")
                  require(sha256(official_bundle) == catalog_pin["attestationSha256"], "official catalog attestation bundle differs from exact pins")
                  require(official_catalog.read_bytes() == catalog_path.read_bytes(), "native installer catalog bytes differ from the official catalog release")
                  require(official_bundle.read_bytes() == catalog_bundle_path.read_bytes(), "native installer catalog bundle differs from the official catalog release")
                  verify_attestation(
                      official_catalog,
                      official_bundle,
                      catalog_pin["repository"],
                      catalog_pin["workflow"],
                      catalog_pin["sourceRef"],
                      catalog_pin["sourceCommit"],
                      "workspace-catalog-v2",
                  )
                  write_json(root() / "evidence" / "workspace-catalog-v2-release-api.json", official_catalog_release)
                  return {"subject": official_catalog.name, "bundle": official_bundle.name, "status": "verified", "releaseId": official_catalog_release["tag_name"], "immutable": official_catalog_release["immutable"]}
              phase("catalog_provenance", lambda: {
                  "releaseId": catalog_pin["releaseId"],
                  "repository": catalog_pin["repository"],
                  "workflow": catalog_pin["workflow"],
                  "sourceRef": catalog_pin["sourceRef"],
                  "sourceCommit": catalog_pin["sourceCommit"],
                  "assetName": catalog_path.name,
                  "sha256": sha256(catalog_path),
                  "generation": catalog_pin["generation"],
                  "attestation": catalog_attestation(),
              })

              PREFLIGHT_STAGE = "release_asset_integrity"
              def checksum_gate() -> dict[str, Any]:
                  result = run(["sha256sum", "--check", "--strict", checksums_path.name], label="native-sha256sums", timeout=300, cwd=asset_dir)
                  require(result.returncode == 0, "native SHA256SUMS verification failed")
                  write_json(root() / "evidence" / "native-release-manifest.json", manifest)
                  write_json(root() / "evidence" / "native-source-receipt.json", receipt)
                  shutil.copy2(catalog_path, root() / "evidence" / catalog_path.name)
                  shutil.copy2(catalog_bundle_path, root() / "evidence" / catalog_bundle_path.name)
                  shutil.copy2(checksums_path, root() / "evidence" / "SHA256SUMS")
                  for subject in (manifest_path, receipt_path, deb_path):
                      bundle = asset_dir / f"{subject.name}.attestation.jsonl"
                      shutil.copy2(bundle, root() / "evidence" / bundle.name)
                  return {"sha256sums": "verified", "downloadedAssetCount": len(release["assets"]), "debAsset": deb_path.name, "debSha256": sha256(deb_path), "debSizeBytes": deb_path.stat().st_size}
              phase("release_asset_integrity", checksum_gate)
              output = Path(os.environ["GITHUB_OUTPUT"])
              with output.open("a", encoding="utf-8") as stream:
                  stream.write(f"deb_path={deb_path}\n")
                  stream.write(f"native_release_id={release_id}\n")
                  stream.write(f"source_commit={native['sourceCommit']}\n")

          def dpkg_install() -> None:
              """Install only the already verified native Ubuntu 24.04 DEB."""
              path = root() / "downloads" / pins()["nativeInstaller"]["debAssetName"]
              require(path.is_file() and sha256(path) == pins()["nativeInstaller"]["debSha256"], "verified DEB changed before apt install")
              manifest = load_json(root() / "evidence" / "native-release-manifest.json")
              package = run(["dpkg-deb", "-f", str(path), "Package"], label="native-deb-package-field", timeout=60).stdout.strip()
              version = run(["dpkg-deb", "-f", str(path), "Version"], label="native-deb-version-field", timeout=60).stdout.strip()
              architecture = run(["dpkg-deb", "-f", str(path), "Architecture"], label="native-deb-architecture-field", timeout=60).stdout.strip()
              require(package == "cyrene", "verified DEB control package name differs")
              require(version == manifest.get("version"), "verified DEB version differs from the attested native manifest")
              require(architecture == "amd64", "verified DEB architecture is not amd64")
              run(["sudo", "-n", "apt", "install", "--yes", str(path)], label="apt-install-native-deb", timeout=1800)
              installed = run(["dpkg-query", "-W", "-f=${Status}\t${Version}\t${Architecture}", "cyrene"], label="dpkg-native-status", timeout=60).stdout.strip().split("\t")
              require(installed == ["install ok installed", version, "amd64"], "dpkg status/version/architecture differs from the verified DEB")
              write_json(root() / "evidence" / "native-deb-installed.json", {
                  "releaseId": pins()["nativeInstaller"]["releaseId"],
                  "sourceCommit": pins()["nativeInstaller"]["sourceCommit"],
                  "debSha256": pins()["nativeInstaller"]["debSha256"],
                  "dpkg": {"status": installed[0], "version": installed[1], "architecture": installed[2]},
              })

          def static_binding_readback() -> dict[str, Any]:
              """Verify the installed DEB catalogs, signed v2 binding, and static package contract."""
              catalog_pin = pins()["catalog"]
              manifest = load_json(root() / "evidence" / "native-release-manifest.json")
              baseline = manifest["workspaceCatalogs"]["baselineV1"]
              receipt = load_json(root() / "evidence" / "native-source-receipt.json")
              baseline_generation = receipt["releaseInputs"]["workspaceCatalogs"]["baselineV1"]["generation"]
              code = textwrap.dedent(r'''
                  import hashlib
                  import importlib.util
                  import json
                  import os
                  import re
                  import stat
              import sys
              from pathlib import Path
              module_spec=importlib.util.spec_from_file_location("bootstrap_catalog_binding", "/usr/lib/cyrene/scripts/bootstrap_catalog_binding.py")
              if module_spec is None or module_spec.loader is None: raise SystemExit("installed catalog binding validator is unavailable")
              module=importlib.util.module_from_spec(module_spec)
              module_spec.loader.exec_module(module)
              load_bootstrap_catalog_binding=module.load_bootstrap_catalog_binding
              def unique(pairs):
                  result={}
                  for key,value in pairs:
                      if key in result: raise ValueError("duplicate JSON key")
                      result[key]=value
                  return result
              def read(path):
                  target=Path(path)
                  descriptor=os.open(target,os.O_RDONLY|getattr(os,"O_NOFOLLOW",0)|getattr(os,"O_CLOEXEC",0))
                  try:
                      before=os.fstat(descriptor)
                      if not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or before.st_gid != 0 or before.st_mode & 0o022:
                          raise SystemExit("installed static asset is not a root-owned safe regular file: "+path)
                      raw=b""
                      while True:
                          block=os.read(descriptor,1048576)
                          if not block: break
                          raw+=block
                          if len(raw)>33554432: raise SystemExit("installed static asset exceeds 32 MiB: "+path)
                      after=os.fstat(descriptor)
                      if (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns,before.st_ctime_ns)!=(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns,after.st_ctime_ns):
                          raise SystemExit("installed static asset changed while read: "+path)
                  finally:
                      os.close(descriptor)
                  value=json.loads(raw.decode("utf-8"),object_pairs_hook=unique)
                  if not isinstance(value,dict): raise SystemExit("installed static asset must be a JSON object: "+path)
                  return raw,value
              expected=json.load(sys.stdin,object_pairs_hook=unique)
              binding_path="/usr/share/cyrene/bootstrap-catalog-binding-v1.json"
              baseline_path="/usr/share/cyrene/component-catalog-v1.json"
              active_path="/usr/share/cyrene/component-catalog-v2.json"
              contract_path="/usr/share/cyrene/native-install-contract-v1.json"
              binding=load_bootstrap_catalog_binding(Path(binding_path),Path(active_path),require_root=True)
              binding_raw,binding_doc=read(binding_path)
              baseline_raw,baseline_doc=read(baseline_path)
              active_raw,active_doc=read(active_path)
              contract_raw,contract=read(contract_path)
              expected_catalog=expected["catalog"]
              expected_binding={"schemaVersion":1,"catalog":{
                  "repository":expected_catalog["repository"],"workflow":expected_catalog["workflow"],
                  "releaseId":expected_catalog["releaseId"],"source":{"ref":expected_catalog["sourceRef"],"commit":expected_catalog["sourceCommit"]},
                  "assetName":expected_catalog["assetName"],"sha256":expected_catalog["sha256"],
                  "attestationBundleSha256":expected_catalog["attestationSha256"],"generation":expected_catalog["generation"]}}
              if binding_doc != expected_binding or binding != expected_binding:
                  raise SystemExit("installed active catalog binding differs from pinned official release identity")
              if hashlib.sha256(active_raw).hexdigest()!=expected_catalog["sha256"] or active_doc.get("schemaVersion")!=2 or active_doc.get("generation")!=expected_catalog["generation"]:
                  raise SystemExit("installed active v2 catalog bytes/schema/generation differ from pins")
              expected_baseline=expected["baseline"]
              if hashlib.sha256(baseline_raw).hexdigest()!=expected_baseline["sha256"] or len(baseline_raw)!=expected_baseline["sizeBytes"] or baseline_doc.get("schemaVersion")!=1 or baseline_doc.get("generation")!=expected_baseline["generation"]:
                  raise SystemExit("installed frozen baseline v1 catalog bytes/schema/generation differ from attested release evidence")
              if contract.get("schemaVersion")!=1 or contract.get("targetProfile")!=expected["targetId"] or contract.get("initializationMode")!="stage-only" or contract.get("serviceArtifactsMode")!="verified-published-bytes" or contract.get("serviceActivation")!="deferred" or contract.get("brokerAction")!="preserve-existing" or contract.get("oldRuntimeAction")!="preserve":
                  raise SystemExit("installed native package contract is missing or differs from the stage-only safe contract")
              def file_evidence(path,raw):
                  info=Path(path).lstat()
                  if stat.S_ISLNK(info.st_mode) or not stat.S_ISREG(info.st_mode) or info.st_uid!=0 or info.st_gid!=0 or info.st_mode & 0o022:
                      raise SystemExit("installed static asset metadata is unsafe: "+path)
                  return {"path":path,"sha256":hashlib.sha256(raw).hexdigest(),"sizeBytes":len(raw),"uid":info.st_uid,"gid":info.st_gid,"mode":oct(stat.S_IMODE(info.st_mode))}
              print(json.dumps({"binding":file_evidence(binding_path,binding_raw),"baselineV1":file_evidence(baseline_path,baseline_raw),"activeV2":file_evidence(active_path,active_raw),"nativeInstallContract":file_evidence(contract_path,contract_raw),"activeBindingIdentity":binding["catalog"],"nativeInstallContractIdentity":{"schemaVersion":contract["schemaVersion"],"targetProfile":contract["targetProfile"],"initializationMode":contract["initializationMode"],"serviceArtifactsMode":contract["serviceArtifactsMode"],"serviceActivation":contract["serviceActivation"],"brokerAction":contract["brokerAction"],"oldRuntimeAction":contract["oldRuntimeAction"],"serviceCount":len(contract.get("services",{}))}},separators=(",",":")))
              ''').strip()
              result = run(
                  ["sudo", "-n", PRIVATE_PYTHON, "-s", "-c", code],
                  label="installed-native-static-binding-probe",
                  timeout=120,
                  input_text=json.dumps({"catalog": catalog_pin, "baseline": {**baseline, "generation": baseline_generation}, "targetId": pins()["nativeInstaller"]["targetId"]}, ensure_ascii=False, separators=(",", ":")),
              )
              projection = json.loads(result.stdout)
              write_json(root() / "evidence" / "installed-native-static-binding.json", projection)
              return projection

          def workload_request(
              operation: str,
              *,
              preserve_read_token: bool = False,
              network_isolated: bool = False,
              allow_error: bool = False,
              **fields: Any,
          ) -> dict[str, Any]:
              """Call the fixed installed JSONL API, optionally isolating one child process."""
              global WORKLOAD_REQUEST_SEQUENCE
              WORKLOAD_REQUEST_SEQUENCE += 1
              request = {"protocolVersion": WORKLOAD_PROTOCOL, "operation": operation, **fields}
              command = ["sudo", "-n"]
              if preserve_read_token:
                  require(bool(os.environ.get("GH_TOKEN")), "read-only GH_TOKEN is unavailable for signed release resolution")
                  command.append("--preserve-env=GH_TOKEN")
              if network_isolated:
                  # A fresh Linux network namespace makes this one root command unable to
                  # reach GitHub while leaving the host network and Unix sockets untouched.
                  command.extend(["/usr/bin/unshare", "--net"])
              command.extend(["/usr/bin/cyrene", "workload", "--json"])
              completed = run(
                  command,
                  label=f"workload-{operation}-{WORKLOAD_REQUEST_SEQUENCE:02d}",
                  timeout=1800,
                  input_text=json.dumps(request, ensure_ascii=False, separators=(",", ":")) + "\n",
                  retain_output=not network_isolated,
              )
              lines = completed.stdout.splitlines()
              require(len(lines) == 1, f"workload {operation} must return exactly one JSONL envelope")
              response = json.loads(lines[0])
              require(response.get("protocolVersion") == WORKLOAD_PROTOCOL and response.get("operation") == operation, f"workload {operation} envelope identity differs")
              path = root() / "evidence" / f"workload-{operation}-{WORKLOAD_REQUEST_SEQUENCE:02d}.json"
              evidence_response = response
              if network_isolated and response.get("ok") is False:
                  error = response.get("error")
                  require(isinstance(error, dict), "isolated workload request returned no error object")
                  evidence_response = {
                      "protocolVersion": response["protocolVersion"],
                      "ok": False,
                      "operation": response["operation"],
                      "error": {
                          "code": error.get("code"),
                          "retryable": error.get("retryable"),
                      },
                  }
              write_json(path, {"request": request, "response": evidence_response})
              if allow_error:
                  return response
              require(response.get("ok") is True, f"workload {operation} failed: {response.get('error')}")
              return response["result"]

          def compare_nested(actual: Any, expected: Any, context: str) -> None:
              """Require every supplied pin field to match while allowing runtime-added evidence."""
              if isinstance(expected, dict):
                  require(isinstance(actual, dict), f"{context} is not an object")
                  for key, child in expected.items():
                      require(key in actual, f"{context} is missing pinned field {key}")
                      compare_nested(actual[key], child, f"{context}.{key}")
              elif isinstance(expected, list):
                  require(actual == expected, f"{context} differs from its exact pin")
              else:
                  require(actual == expected, f"{context} differs from its exact pin")

          def assert_selected_components(actual_rows: Any, expected_rows: Any, context: str) -> None:
              """Compare the exact selected component set and its published provenance identities."""
              require(isinstance(actual_rows, list), f"{context} has no component rows")
              actual = {row.get("componentId"): row for row in actual_rows if isinstance(row, dict)}
              expected = {row["componentId"]: row for row in expected_rows}
              require(len(actual) == len(actual_rows), f"{context} has malformed or duplicate component rows")
              require(set(actual) == set(expected), f"{context} selected component set differs from root pins")
              for component_id, pin in expected.items():
                  compare_nested(actual[component_id], pin, f"{context}.{component_id}")

          def assert_staged_plan(staged: Any, workload: dict[str, Any], checked: dict[str, Any], context: str) -> None:
              """Require a staged response to preserve the checked plan and exact pinned set."""
              require(isinstance(staged, dict), f"{context} returned no staged result")
              require(staged.get("status") == "staged", f"{context} did not reach staged state")
              require(staged.get("planId") == checked["planId"], f"{context} changed the checked plan ID")
              require(staged.get("planDigest") == checked["planDigest"], f"{context} changed the checked plan digest")
              require(staged.get("catalogDigest") == workload["catalogDigest"], f"{context} changed the pinned catalog")
              require(staged.get("workloadId") == workload["workloadId"] and staged.get("targetId") == workload["targetId"], f"{context} changed the workload target")
              require(staged.get("action") == "install", f"{context} changed the checked action")
              staged_rows = staged.get("components")
              assert_selected_components(staged_rows, workload["selectedComponents"], context)
              require(
                  all(row.get("status") in {"staged", "current"} for row in staged_rows),
                  f"{context} has a component outside the staged/current states",
              )

          def version_conflict_readonly_check(checked: dict[str, Any], workload: dict[str, Any]) -> dict[str, Any]:
              """Confirm the exact signed resolution has no version-conflict blocker before staging."""
              require(checked.get("status") == "ready", "read-only version-conflict check needs a ready exact plan")
              resolution = checked.get("resolution")
              require(isinstance(resolution, dict), "read-only version-conflict check has no resolver result")
              top_blockers = checked.get("blockers", [])
              resolver_blockers = resolution.get("blockers", [])
              require(isinstance(top_blockers, list) and isinstance(resolver_blockers, list), "read-only version-conflict blocker lists are malformed")
              blocker_rows = [
                  row
                  for source in (top_blockers, resolver_blockers)
                  for row in source
                  if isinstance(row, dict)
              ]
              conflict_rows = [row for row in blocker_rows if row.get("code") == "VERSION_CONFLICT"]
              require(not conflict_rows, "exact Catalyst resolver plan contains a VERSION_CONFLICT blocker")
              return {
                  "planId": checked.get("planId"),
                  "planDigest": checked.get("planDigest"),
                  "catalogDigest": workload["catalogDigest"],
                  "selectedComponentIds": [row["componentId"] for row in workload["selectedComponents"]],
                  "versionConflictBlockerCount": 0,
                  "mutatingRequestsSent": 0,
                  "scope": "read-only exact selected workload resolution",
              }

          def offline_stage_retry(workload: dict[str, Any], checked: dict[str, Any]) -> dict[str, Any]:
              """Isolate stage networking, then prove same-plan retry or report a warm-cache result."""
              fields = {
                  "workloadId": "catalyst",
                  "targetId": workload["targetId"],
                  "action": "install",
                  "planId": checked["planId"],
                  "planDigest": checked["planDigest"],
              }
              failed = workload_request(
                  "stage",
                  preserve_read_token=True,
                  network_isolated=True,
                  allow_error=True,
                  **fields,
              )
              def active_selected_components() -> list[str]:
                  inventory = workload_request("status", workloadId="catalyst")
                  require(inventory.get("status") == "ready", "workload inventory failed after isolated stage attempt")
                  expected_ids = {item["componentId"] for item in workload["selectedComponents"]}
                  return sorted(
                      row.get("componentId")
                      for row in inventory.get("components", [])
                      if isinstance(row, dict)
                      and row.get("componentId") in expected_ids
                      and row.get("installed") is True
                  )
              if failed.get("ok") is True:
                  cached = failed.get("result")
                  assert_staged_plan(cached, workload, checked, "network-isolated cached stage")
                  active_ids = active_selected_components()
                  require(not active_ids, f"network-isolated stage activated selected components: {active_ids}")
                  repeated = workload_request("stage", preserve_read_token=True, **fields)
                  assert_staged_plan(repeated, workload, checked, "same-plan cached stage repeat")
                  require(cached["components"] == repeated["components"], "cached same-plan stage repeat changed staged component identities")
                  safe_evidence = {
                      "outcome": "cached-stage-no-failure",
                      "networkNamespace": "isolated-child-process",
                      "planId": checked["planId"],
                      "planDigest": checked["planDigest"],
                      "activeSelectedComponentsAfterStage": active_ids,
                      "offlineStageStatus": cached["status"],
                      "repeatStageStatus": repeated["status"],
                      "repeatStageStable": True,
                      "selectedComponentIds": [row["componentId"] for row in workload["selectedComponents"]],
                  }
                  return {**safe_evidence, "stagedResult": cached}
              error = failed.get("error")
              require(isinstance(error, dict), "network-isolated stage returned no structured error")
              require(error.get("code") == "NETWORK_ERROR", f"network-isolated stage returned unexpected code: {error.get('code')}")
              require(error.get("retryable") is True, "network-isolated stage failure was not marked retryable")

              active_ids = active_selected_components()
              require(not active_ids, f"a rejected offline stage activated selected components: {active_ids}")

              resumed = workload_request("stage", preserve_read_token=True, **fields)
              assert_staged_plan(resumed, workload, checked, "same-plan stage retry")
              repeated = workload_request("stage", preserve_read_token=True, **fields)
              assert_staged_plan(repeated, workload, checked, "same-plan repeated stage")
              require(resumed["components"] == repeated["components"], "same-plan repeated stage changed staged component identities")
              safe_evidence = {
                  "outcome": "network-failure-recovered",
                  "failure": {
                      "operation": "stage",
                      "code": error["code"],
                      "retryable": error["retryable"],
                      "networkNamespace": "isolated-child-process",
                  },
                  "planId": checked["planId"],
                  "planDigest": checked["planDigest"],
                  "activeSelectedComponentsAfterFailure": active_ids,
                  "retryStatus": resumed["status"],
                  "repeatStageStatus": repeated["status"],
                  "repeatStageStable": True,
                  "selectedComponentIds": [row["componentId"] for row in workload["selectedComponents"]],
              }
              return {**safe_evidence, "stagedResult": resumed}

          def plugin_status_snapshot(workload: dict[str, Any], context: str) -> dict[str, Any]:
              """Read only the exact standalone plugin identities and omit unrelated host state."""
              inventory = workload_request("status", workloadId="plugins")
              require(inventory.get("status") == "ready", f"{context} plugin inventory is not ready")
              require(inventory.get("catalogDigest") == workload["catalogDigest"], f"{context} plugin catalog digest differs from pins")
              expected = {row["componentId"]: row for row in workload["selectedComponents"]}
              rows = {
                  row.get("componentId"): row
                  for row in inventory.get("components", [])
                  if isinstance(row, dict) and row.get("componentId") in expected
              }
              require(set(rows) == set(expected), f"{context} plugin status omits a pinned component")
              stable_fields = (
                  "componentId", "installed", "version", "releaseId", "targetId",
                  "manifestDigest", "manifestAssetDigest", "digest", "installationId",
              )
              projection = []
              for component_id in sorted(expected):
                  row = rows[component_id]
                  require(type(row.get("installed")) is bool, f"{context} {component_id} installed status is malformed")
                  verification = row.get("verification")
                  require(isinstance(verification, dict) and type(verification.get("identityAttested")) is bool, f"{context} {component_id} identity verification is malformed")
                  if row["installed"]:
                      require(verification["identityAttested"] is True, f"{context} {component_id} is active without attested identity")
                      for identity_field in (
                          "version", "releaseId", "targetId", "manifestDigest",
                          "manifestAssetDigest", "digest",
                      ):
                          require(row.get(identity_field) == expected[component_id][identity_field], f"{context} {component_id} {identity_field} differs from the exact pin")
                  else:
                      require(verification["identityAttested"] is False, f"{context} {component_id} is inactive but reports an attested identity")
                  projection.append({
                      **{key: row.get(key) for key in stable_fields},
                      "identityAttested": verification["identityAttested"],
                  })
              return {
                  "catalogDigest": inventory["catalogDigest"],
                  "components": projection,
              }

          def exact_match_plugins_offline_retry() -> dict[str, Any]:
              """Use a signed standalone plugins plan as the independent cache-miss fallback."""
              workload = pins()["workloads"].get("plugins")
              if not isinstance(workload, dict):
                  return {
                      "outcome": "fallback-pins-unavailable",
                      "status": "NOT_RUN",
                      "reason": "root did not supply exact standalone exact-match and Runtime SDK release identity pins",
                      "selectedComponentIds": [],
                  }
              expected_rows = workload["selectedComponents"]
              plugin_id = "cyrene-evaluation-exact-match"
              require(plugin_id in {row["componentId"] for row in expected_rows}, "standalone plugins pins omit exact-match")
              checked = workload_request(
                  "check",
                  preserve_read_token=True,
                  workloadId="plugins",
                  targetId=workload["targetId"],
                  action="install",
                  selections={
                      "includeComponentIds": [plugin_id],
                      "excludeComponentIds": [],
                      "choices": {},
                  },
              )
              require(checked.get("status") == "ready", f"standalone exact-match check is not ready: {checked.get('blockers')}")
              require(checked.get("workloadId") == "plugins" and checked.get("targetId") == workload["targetId"], "standalone exact-match check workload/target identity differs")
              require(checked.get("catalogDigest") == workload["catalogDigest"], "standalone exact-match check catalog digest differs from pins")
              require(checked.get("action") == "install", "standalone exact-match check action is not install")
              assert_selected_components(checked.get("components"), expected_rows, "standalone exact-match check")
              resolution = checked.get("resolution")
              require(isinstance(resolution, dict), "standalone exact-match check has no resolver resolution")
              require(resolution.get("catalogDigest") == workload["catalogDigest"], "standalone exact-match resolution catalog digest differs")
              assert_selected_components(resolution.get("selectedComponents"), expected_rows, "standalone exact-match resolution")
              require(re.fullmatch(r"plan-[0-9a-f]{32}", str(checked.get("planId", ""))) is not None, "standalone exact-match plan ID is malformed")
              require(re.fullmatch(r"sha256:[0-9a-f]{64}", str(checked.get("planDigest", ""))) is not None, "standalone exact-match plan digest is malformed")
              plan_identity = {
                  "workloadId": "plugins",
                  "targetId": workload["targetId"],
                  "catalogDigest": workload["catalogDigest"],
                  "planId": checked["planId"],
                  "planDigest": checked["planDigest"],
                  "selectedComponentIds": [row["componentId"] for row in expected_rows],
                  "applied": False,
              }
              write_json(root() / "evidence" / "exact-match-plugins-checked-plan.json", {
                  **plan_identity,
                  "selectedComponents": expected_rows,
              })
              baseline = plugin_status_snapshot(workload, "before isolated exact-match stage")
              fields = {
                  "workloadId": "plugins",
                  "targetId": workload["targetId"],
                  "action": "install",
                  "planId": checked["planId"],
                  "planDigest": checked["planDigest"],
              }
              isolated = workload_request(
                  "stage",
                  preserve_read_token=True,
                  network_isolated=True,
                  allow_error=True,
                  **fields,
              )
              if isolated.get("ok") is True:
                  cached = isolated.get("result")
                  assert_staged_plan(cached, workload, checked, "network-isolated exact-match cached stage")
                  after_stage = plugin_status_snapshot(workload, "after isolated exact-match cached stage")
                  require(after_stage == baseline, "network-isolated exact-match stage changed installed component status")
                  repeated = workload_request("stage", preserve_read_token=True, **fields)
                  assert_staged_plan(repeated, workload, checked, "same-plan exact-match cached stage repeat")
                  require(cached["components"] == repeated["components"], "same-plan cached exact-match stage repeat changed staged identities")
                  final_status = plugin_status_snapshot(workload, "after exact-match cached stage repeat")
                  require(final_status == baseline, "exact-match stage repeat changed installed component status")
                  stage_states = [
                      {"componentId": row["componentId"], "status": row["status"]}
                      for row in cached["components"]
                  ]
                  exact_match_state = next(
                      row["status"] for row in stage_states if row["componentId"] == plugin_id
                  )
                  outcome = (
                      "cached-stage-no-failure"
                      if exact_match_state == "staged"
                      else "already-current-no-failure"
                  )
                  evidence = {
                      **plan_identity,
                      "outcome": outcome,
                      "status": "NOT_RUN",
                      "reason": (
                          "the isolated exact-match plugin archive stage succeeded from already available content; no network failure was exercised"
                          if outcome == "cached-stage-no-failure"
                          else "the exact-match component was already current; no network failure was exercised"
                      ),
                      "networkNamespace": "isolated-child-process",
                      "installedStatusBefore": baseline,
                      "installedStatusAfter": final_status,
                      "repeatStageStable": True,
                      "stageComponentIds": [row["componentId"] for row in cached["components"]],
                      "stageComponentStates": stage_states,
                  }
                  write_json(root() / "evidence" / "exact-match-plugins-offline-stage.json", evidence)
                  return evidence
              error = isolated.get("error")
              require(isinstance(error, dict), "network-isolated exact-match stage returned no structured error")
              require(error.get("code") == "NETWORK_ERROR", f"network-isolated exact-match stage returned unexpected code: {error.get('code')}")
              require(error.get("retryable") is True, "network-isolated exact-match stage failure was not retryable")
              after_failure = plugin_status_snapshot(workload, "after isolated exact-match stage failure")
              require(after_failure == baseline, "rejected isolated exact-match stage changed installed component status")
              resumed = workload_request("stage", preserve_read_token=True, **fields)
              assert_staged_plan(resumed, workload, checked, "same-plan exact-match stage retry")
              repeated = workload_request("stage", preserve_read_token=True, **fields)
              assert_staged_plan(repeated, workload, checked, "same-plan repeated exact-match stage")
              require(resumed["components"] == repeated["components"], "same-plan repeated exact-match stage changed staged component identities")
              final_status = plugin_status_snapshot(workload, "after exact-match same-plan stage retry")
              require(final_status == baseline, "exact-match stage retry changed installed component status")
              evidence = {
                  **plan_identity,
                  "outcome": "network-failure-recovered",
                  "status": "PASS",
                  "failure": {
                      "operation": "stage",
                      "code": error["code"],
                      "retryable": error["retryable"],
                      "networkNamespace": "isolated-child-process",
                  },
                  "installedStatusBefore": baseline,
                  "installedStatusAfterFailure": after_failure,
                  "installedStatusAfterRetry": final_status,
                  "retryStatus": resumed["status"],
                  "repeatStageStatus": repeated["status"],
                  "repeatStageStable": True,
                  "stageComponentIds": [row["componentId"] for row in resumed["components"]],
                  "stageComponentStates": [
                      {"componentId": row["componentId"], "status": row["status"]}
                      for row in resumed["components"]
                  ],
              }
              write_json(root() / "evidence" / "exact-match-plugins-offline-stage.json", evidence)
              return evidence

          def record_offline_stage_outcome(workload: dict[str, Any], checked: dict[str, Any]) -> dict[str, Any]:
              """Persist offline-stage evidence without calling a warm cache a recovered failure."""
              try:
                  evidence = offline_stage_retry(workload, checked)
                  if evidence["outcome"] == "network-failure-recovered":
                      evidence["offlineFailureFallback"] = {
                          "status": "NOT_NEEDED",
                          "reason": "the required Catalyst isolated-stage failure was recovered directly",
                      }
                  else:
                      evidence["offlineFailureFallback"] = exact_match_plugins_offline_retry()
              except Exception as error:
                  record("offline_retry_gate", "FAIL", f"{type(error).__name__}: {error}")
                  print(f"FAIL offline_retry_gate: {error}", file=sys.stderr)
                  raise
              if evidence["outcome"] == "network-failure-recovered":
                  record("offline_retry_gate", "PASS", "isolated stage failure resumed and repeated with the same plan", {key: value for key, value in evidence.items() if key != "stagedResult"})
                  print("PASS offline_retry_gate")
              else:
                  fallback = evidence["offlineFailureFallback"]
                  if fallback.get("outcome") == "network-failure-recovered":
                      record("offline_retry_gate", "PASS", "Catalyst stage was cache-backed; the independent exact-match plugins plan exercised isolated failure and same-plan recovery", {key: value for key, value in evidence.items() if key != "stagedResult"})
                      print("PASS offline_retry_gate via standalone exact-match plugin")
                  else:
                      reason = (
                          "Catalyst stage succeeded from cached content and the standalone exact-match plugin stage was also cache-backed"
                          if fallback.get("outcome") == "cached-stage-no-failure"
                          else "Catalyst stage succeeded from cached content and the standalone exact-match component was already current"
                          if fallback.get("outcome") == "already-current-no-failure"
                          else "Catalyst stage succeeded from cached content and exact standalone exact-match release pins were not supplied"
                      )
                      record("offline_retry_gate", "NOT_RUN", reason, {key: value for key, value in evidence.items() if key != "stagedResult"})
                      print(f"NOT_RUN offline_retry_gate: {reason}")
              write_json(root() / "evidence" / "offline-stage-retry.json", {key: value for key, value in evidence.items() if key != "stagedResult"})
              return evidence

          def assert_installed_components(actual_rows: Any, expected_rows: Any, context: str) -> None:
              """Compare receipt-backed installed identities using stable status fields."""
              require(isinstance(actual_rows, list), f"{context} has no component rows")
              actual = {row.get("componentId"): row for row in actual_rows if isinstance(row, dict)}
              expected = {row["componentId"]: row for row in expected_rows}
              require(len(actual) == len(actual_rows), f"{context} has malformed or duplicate component rows")
              require(set(expected) <= set(actual), f"{context} is missing selected workload components")
              unexpected_active = sorted(
                  component_id for component_id, row in actual.items()
                  if component_id not in expected and row.get("installed") is True
              )
              require(not unexpected_active, f"{context} has active components outside the pinned workload: {unexpected_active}")
              for component_id, pin in expected.items():
                  row = actual[component_id]
                  require(row.get("installed") is True, f"{context} component is not installed: {component_id}")
                  require(row.get("version") == pin["version"], f"{context} component version differs: {component_id}")
                  require(row.get("digest") == pin["digest"], f"{context} component artifact digest differs: {component_id}")
                  for field in ("targetId", "releaseId", "manifestDigest", "manifestAssetDigest"):
                      require(field in row and row[field] == pin[field], f"{context} component {field} differs or is missing: {component_id}")
                  require(row.get("verification", {}).get("identityAttested") is True, f"{context} installed identity is not attested: {component_id}")

          def expected_catalyst_bindings(selected_rows: Any) -> list[dict[str, str]]:
              """Derive the exact Product-owned bindings from the verified v2 Catalog."""
              catalog_pin = pins()["catalog"]
              catalog_path = root() / "downloads" / catalog_pin["assetName"]
              require(catalog_path.is_file(), "verified v2 Catalog bytes are unavailable for binding readback")
              require(sha256(catalog_path) == catalog_pin["sha256"], "binding readback Catalog bytes differ from exact release pins")
              catalog = load_json(catalog_path)
              require(catalog.get("schemaVersion") == 2 and catalog.get("generation") == catalog_pin["generation"], "binding readback Catalog schema/generation differs from exact pins")
              workload_rows = [
                  row for row in catalog.get("workloads", [])
                  if isinstance(row, dict) and row.get("workloadId") == "catalyst"
              ]
              require(len(workload_rows) == 1, "verified Catalog must define one Catalyst workload")
              workload = workload_rows[0]
              policy = workload.get("sourcePolicy")
              require(isinstance(policy, dict) and policy.get("mode") == "actualProduct", "Catalyst workload does not declare actualProduct source ownership")
              products = policy.get("productSources")
              require(isinstance(products, list), "Catalyst Product source mapping is missing")
              catalyst_sources = [
                  row for row in products
                  if isinstance(row, dict) and row.get("componentId") == "cyrene-catalyst"
              ]
              require(len(catalyst_sources) == 1 and catalyst_sources[0].get("sourceId") == "cyrene-catalyst", "Catalog Catalyst source identity differs")
              require(policy.get("operations") == ["activate", "recover_binding", "deactivate", "runtime_status", "get_installation"], "Catalog Catalyst source operations differ from the installed SDK contract")
              selected_ids = {
                  row.get("componentId") for row in selected_rows if isinstance(row, dict)
              }
              require(len(selected_ids) == len(selected_rows), "Catalyst selected rows are malformed or duplicated")
              component_rows = {
                  row.get("componentId"): row
                  for row in catalog.get("components", [])
                  if isinstance(row, dict) and isinstance(row.get("componentId"), str)
              }
              binding_rows = workload.get("bindings")
              require(isinstance(binding_rows, list), "Catalog Catalyst workload has no binding map")
              result = []
              for binding in binding_rows:
                  require(isinstance(binding, dict), "Catalog Catalyst binding row is malformed")
                  component_id = binding.get("componentId")
                  if component_id not in selected_ids:
                      continue
                  component = component_rows.get(component_id)
                  package = component.get("pluginPackage") if isinstance(component, dict) else None
                  binding_id = binding.get("bindingId")
                  require(isinstance(package, dict), f"Selected component has no signed plugin package identity: {component_id}")
                  package_id = package.get("packageId")
                  require(isinstance(binding_id, str) and binding_id, f"Selected component has no Catalog binding ID: {component_id}")
                  require(isinstance(package_id, str) and package_id, f"Selected component has no Catalog package ID: {component_id}")
                  result.append({
                      "componentId": component_id,
                      "sourceId": "cyrene-catalyst",
                      "bindingId": binding_id,
                      "packageId": package_id,
                  })
              selected_plugins = {
                  component_id for component_id in selected_ids
                  if isinstance(component_rows.get(component_id, {}).get("pluginPackage"), dict)
              }
              result_plugins = {row["componentId"] for row in result}
              require(selected_plugins == result_plugins, "Selected plugin rows differ from Catalog Catalyst binding ownership")
              require(result_plugins == CATALYST_REQUIRED_PLUGIN_IDS, "Catalyst pins must select all four Catalog-owned data plugin bindings")
              return sorted(result, key=lambda row: row["bindingId"])

          def assert_catalyst_source_bindings(
              actual_rows: Any, expected_rows: Any, context: str
          ) -> list[dict[str, Any]]:
              """Require active Platform UDS readback for each pinned package binding."""
              require(isinstance(actual_rows, list), f"{context} has no Package Runtime UDS sourceBindings")
              expected = {row["bindingId"]: row for row in expected_rows}
              actual = {
                  row.get("bindingId"): row for row in actual_rows
                  if isinstance(row, dict)
              }
              require(len(actual) == len(actual_rows), f"{context} sourceBindings are malformed or duplicated")
              require(set(actual) == set(expected), f"{context} sourceBindings differ from selected Catalog bindings")
              result = []
              for binding_id, pin in expected.items():
                  row = actual[binding_id]
                  require(row.get("sourceId") == pin["sourceId"], f"{context} source ID differs: {binding_id}")
                  require(row.get("packageId") == pin["packageId"], f"{context} package ID differs: {binding_id}")
                  ids = row.get("installationIds")
                  require(isinstance(ids, list) and ids and all(re.fullmatch(r"installation-[0-9a-f]{32}", str(item)) for item in ids), f"{context} installation IDs are missing or malformed: {binding_id}")
                  require(ids == sorted(set(ids)), f"{context} installation IDs are not sorted and unique: {binding_id}")
                  active_id = row.get("activeInstallationId")
                  require(active_id in ids, f"{context} has no active UDS installation: {binding_id}")
                  require(row.get("state") == "RUNNING", f"{context} Platform-supervised installation is not running: {binding_id}")
                  require(row.get("failureCode") is None, f"{context} Platform reports a binding failure: {binding_id}")
                  result.append({**pin, "installationIds": ids, "activeInstallationId": active_id, "state": row["state"]})
              return sorted(result, key=lambda row: row["bindingId"])

          def active_receipt_readback(expected_rows: Any, staged_rows: Any) -> dict[str, Any]:
              """Verify root-owned active and immutable receipts from the installed updater."""
              require(isinstance(expected_rows, list) and isinstance(staged_rows, list), "installed workload pins or stage receipts are missing")
              staged = {row.get("componentId"): row for row in staged_rows if isinstance(row, dict)}
              require(len(staged) == len(staged_rows), "workload stage receipts are malformed or duplicated")
              sdk_pin = next((row for row in expected_rows if row.get("componentId") == "cyrene-runtime-maintenance-sdk"), None)
              sdk_stage = staged.get("cyrene-runtime-maintenance-sdk")
              if sdk_pin is not None:
                  require(isinstance(sdk_stage, dict), "Runtime Maintenance SDK stage evidence is missing")
                  sdk_wheel_digest = sdk_stage.get("wheelDigest")
                  require(re.fullmatch(r"sha256:[0-9a-f]{64}", str(sdk_wheel_digest)) is not None, "SDK staged wheel digest is malformed")
                  require(sdk_stage.get("stagedIdentity", {}).get("wheelDigest") == sdk_wheel_digest, "SDK stage receipt wheel identities differ")
              else:
                  sdk_wheel_digest = None
              code = textwrap.dedent(r'''
              import base64
              import hashlib
              import importlib.util
              import json
              import os
              import stat
              import sys
              from pathlib import Path
              def unique(pairs):
                  result={}
                  for key,value in pairs:
                      if key in result: raise ValueError("duplicate JSON key")
                      result[key]=value
                  return result
              def read_json(path, *, exact_mode=None):
                  target=Path(path)
                  descriptor=os.open(target,os.O_RDONLY|getattr(os,"O_NOFOLLOW",0)|getattr(os,"O_CLOEXEC",0))
                  try:
                      before=os.fstat(descriptor)
                      if not stat.S_ISREG(before.st_mode) or before.st_uid!=0 or before.st_gid!=0 or before.st_nlink!=1 or (exact_mode is not None and stat.S_IMODE(before.st_mode)!=exact_mode) or (exact_mode is None and stat.S_IMODE(before.st_mode)&0o077):
                          raise SystemExit("installed receipt is not a root-owned private regular file: "+str(target))
                      raw=b""
                      while True:
                          block=os.read(descriptor,1048576)
                          if not block: break
