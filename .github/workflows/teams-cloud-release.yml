name: Teams cloud ARM64 immutable release

on:
  workflow_run:
    workflows: [CI and immutable release artifact]
    types: [completed]
    branches: [develop]
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: teams-cloud-arm64-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish pinned ARM64 images
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'CI and immutable release artifact' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'develop' &&
        github.event.workflow_run.repository.full_name == 'DoHorizon-AI/Cyrene-Workspace' &&
        github.event.workflow_run.head_repository.full_name == 'DoHorizon-AI/Cyrene-Workspace') )
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out the trusted release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve successful canonical source pins
        id: sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          SOURCE_PINS: ${{ runner.temp }}/teams-cloud-source-pins.json
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 publisher/tooling/deploy/teams-cloud/release_bundle.py
          resolve-sources
          --event-name "$EVENT_NAME"
          --event-path "$EVENT_PATH"
          --output "$SOURCE_PINS"
          --github-output "$GITHUB_OUTPUT"

      - name: Check out the exact successful Workspace source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sources.outputs.workspace_sha }}
          path: workspace-source
          persist-credentials: false

      - name: Prepare the immutable release identity
        id: prepare
        env:
          SOURCE_PINS: ${{ runner.temp }}/teams-cloud-source-pins.json
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISHER_HEAD_SHA: ${{ github.sha }}
          PUBLISHER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          artifact_root="$(dirname "$GITHUB_WORKSPACE")/.artifacts/teams-cloud-release/${RUN_ID}-${RUN_ATTEMPT}"
          python3 workspace-source/tooling/deploy/teams-cloud/release_bundle.py \
            prepare \
            --source-pins "$SOURCE_PINS" \
            --output-dir "$artifact_root" \
            --publisher-run-id "$RUN_ID" \
            --publisher-run-attempt "$RUN_ATTEMPT" \
            --publisher-head-sha "$PUBLISHER_HEAD_SHA" \
            --publisher-event "$PUBLISHER_EVENT" \
            --github-output "$GITHUB_OUTPUT"
          echo "release_root=$artifact_root" >> "$GITHUB_OUTPUT"

      - name: Skip only a verified immutable release with successful publisher proof
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_FINGERPRINT: ${{ steps.prepare.outputs.source_fingerprint }}
          WORKSPACE_SHA: ${{ steps.prepare.outputs.workspace_sha }}
        run: |
          set -euo pipefail
          python3 workspace-source/tooling/deploy/teams-cloud/release_bundle.py \
            publication-decision \
            --source-fingerprint "$SOURCE_FINGERPRINT" \
            --workspace-sha "$WORKSPACE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up pinned Docker 29.8.0 with the containerd image store
        if: steps.existing.outputs.publish == 'true'
        uses: docker/setup-docker-action@v5
        with:
          version: v29.8.0
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Verify the native ARM64 Docker image store
        if: steps.existing.outputs.publish == 'true'
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'aarch64'
          test "$(docker version --format '{{.Server.Version}}')" = '29.8.0'
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = 'linux/arm64'
          docker info --format '{{json .DriverStatus}}' | python3 -c '
          import json, sys
          driver_status = json.load(sys.stdin)
          assert ["driver-type", "io.containerd.snapshotter.v1"] in driver_status
          '

      - name: Set up Docker Buildx
        if: steps.existing.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and verify the six-image release bundle
        id: bundle
        if: steps.existing.outputs.publish == 'true'
        env:
          RELEASE_ROOT: ${{ steps.prepare.outputs.release_root }}
          PUBLISHER_RUN_ID: ${{ github.run_id }}
          PUBLISHER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISHER_HEAD_SHA: ${{ github.sha }}
          PUBLISHER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 workspace-source/tooling/deploy/teams-cloud/release_bundle.py \
            build \
            --output-dir "$RELEASE_ROOT" \
            --publisher-run-id "$PUBLISHER_RUN_ID" \
            --publisher-run-attempt "$PUBLISHER_RUN_ATTEMPT" \
            --publisher-head-sha "$PUBLISHER_HEAD_SHA" \
            --publisher-event "$PUBLISHER_EVENT"

      - name: Publish immutable GitHub release assets
        id: release
        if: steps.existing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ROOT: ${{ steps.prepare.outputs.release_root }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          WORKSPACE_SHA: ${{ steps.prepare.outputs.workspace_sha }}
          SOURCE_FINGERPRINT: ${{ steps.prepare.outputs.source_fingerprint }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/teams-cloud-release-notes.md"
          cat > "$notes_file" <<EOF
          Immutable linux/arm64 Teams runtime bundle. Source pins and per-image SHA-256 values are in release-manifest.json.

          sourceFingerprintSha256=${SOURCE_FINGERPRINT}
          EOF
          assets=(
            "$RELEASE_ROOT/release-manifest.json"
            "$RELEASE_ROOT/image-lock.json"
            "$RELEASE_ROOT/deployment-tools.tar.gz"
            "$RELEASE_ROOT"/images/*.docker.tar.gz
          )
          test "${#assets[@]}" -eq 9
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$WORKSPACE_SHA" \
            --prerelease \
            --title "$RELEASE_TAG" \
            --notes-file "$notes_file"

          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.immutable')"
          test "$immutable" = 'true'
          remote_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern release-manifest.json --dir "$remote_dir"
          cmp "$RELEASE_ROOT/release-manifest.json" "$remote_dir/release-manifest.json"
          actual_names="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '[.assets[].name] | sort | join("\n")')"
          expected_names="$(printf '%s\n' "${assets[@]##*/}" | sort)"
          test "$actual_names" = "$expected_names"
          echo "release_url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Stage the small immutable deployment proof
        id: proof
        if: steps.existing.outputs.publish == 'true'
        env:
          RELEASE_ROOT: ${{ steps.prepare.outputs.release_root }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          set -euo pipefail
          python3 workspace-source/tooling/deploy/teams-cloud/release_bundle.py \
            proof \
            --release-root "$RELEASE_ROOT" \
            --output-dir "$RELEASE_ROOT/.proof" \
            --release-url "$RELEASE_URL" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload the run-bound immutable proof
        id: proof-artifact
        if: steps.existing.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.proof.outputs.artifact_name }}
          path: |
            ${{ steps.proof.outputs.proof_dir }}/release-manifest.json
            ${{ steps.proof.outputs.proof_dir }}/image-lock.json
            ${{ steps.proof.outputs.proof_dir }}/deployment-tools.tar.gz
            ${{ steps.proof.outputs.proof_dir }}/release-pointer.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
