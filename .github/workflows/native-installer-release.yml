name: Signed native Workspace installer release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full SHA of the selected Workspace workflow commit; must equal this run's commit
        required: true
        type: string
      release_inputs_json:
        description: Exact catalog, Platform, and five Product immutable release locators (schemaVersion 1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-installer-release-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  resolve-inputs:
    name: Resolve exact signed source inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_INPUTS_JSON: ${{ inputs.release_inputs_json }}
      PREDICATE_TYPE: https://slsa.dev/provenance/v1
    steps:
      - name: Check out the exact Workspace source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the locked helper Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"
      - name: Install pinned catalog validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0" "referencing==0.37.0"
      - name: Validate source identity and exact locator schema
        id: locators
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "DoHorizon-AI/Cyrene-Workspace"
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/native-installer-release.yml@$SOURCE_REF"
          mkdir -p "$RUNNER_TEMP/native-installer-inputs"
          printf '%s\n' "$RELEASE_INPUTS_JSON" > "$RUNNER_TEMP/native-installer-release-inputs.json"
          python scripts/native_installer_release.py validate-inputs \
            --inputs "$RUNNER_TEMP/native-installer-release-inputs.json" \
            --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/native-installer-inputs/validated-locators.json"
          python scripts/native_installer_release.py write-fetch-plan \
            --inputs "$RUNNER_TEMP/native-installer-release-inputs.json" \
            --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/native-installer-inputs/fetch-plan.json"
      - name: Read the validated exact Platform source SHA
        id: platform-source
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/native-installer-inputs/validated-locators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          locators = json.load(open(sys.argv[1], encoding="utf-8"))
          tag = locators["platformReleaseId"]
          match = re.fullmatch(r"(?:stable|preview)-([0-9a-f]{40})", tag)
          if match is None:
              raise SystemExit("Platform release locator is not an exact source-pinned tag")
          print(f"source_commit={match.group(1)}")
          PY
      - name: Check out the exact Platform official verifier source
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Platform
          ref: ${{ steps.platform-source.outputs.source_commit }}
          path: platform-source
          persist-credentials: false
      - name: Confirm the checked-out verifier source SHA
        env:
          EXPECTED_PLATFORM_COMMIT: ${{ steps.platform-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git -C platform-source rev-parse HEAD^{commit})" = "$EXPECTED_PLATFORM_COMMIT"
      - name: Install exact Platform release helper dependencies
        run: python -m pip install --disable-pip-version-check -r platform-source/tooling/release/requirements.txt
      - name: Fetch the explicitly selected Workspace catalog
        run: |
          set -euo pipefail
          python scripts/native_installer_release.py validate-inputs \
            --inputs "$RUNNER_TEMP/native-installer-release-inputs.json" \
            --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/native-installer-inputs/validated-locators.json"
          CATALOG_RELEASE_ID="$(python - "$RUNNER_TEMP/native-installer-inputs/validated-locators.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["workspaceCatalog"]["releaseId"])
          PY
          )"
          python packaging/fetch_component_catalog.py \
            --release-id "$CATALOG_RELEASE_ID" \
            --output "$RUNNER_TEMP/native-installer-inputs/component-catalog-v1.json" \
            --metadata-output "$RUNNER_TEMP/native-installer-inputs/component-catalog-release.json" \
            --attestation-output "$RUNNER_TEMP/native-installer-inputs/component-catalog-v1.json.attestation.jsonl" \
            --schema-root governance
          CATALOG_SHA256="$(python - "$RUNNER_TEMP/native-installer-inputs/validated-locators.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["workspaceCatalog"]["sha256"])
          PY
          )"
          test "$(sha256sum "$RUNNER_TEMP/native-installer-inputs/component-catalog-v1.json" | cut -d ' ' -f 1)" = "$CATALOG_SHA256"
          for schema in \
            component-release-manifest-v1.schema.json \
            component-release-manifest-v2.schema.json \
            component-release-index-v1.schema.json; do
            cp "governance/$schema" "$RUNNER_TEMP/native-installer-inputs/$schema"
          done
      - name: Fetch every exact catalog-authorized component tuple
        env:
          CATALOG_PATH: ${{ runner.temp }}/native-installer-inputs/component-catalog-v1.json
          FETCH_PLAN: ${{ runner.temp }}/native-installer-inputs/fetch-plan.json
          INPUT_ROOT: ${{ runner.temp }}/native-installer-inputs
          PLATFORM_FETCHER: ${{ github.workspace }}/platform-source/tooling/release/fetch_component.py
        run: |
          set -euo pipefail
          report_args=()
          attestation_args=()
          while IFS=$'\t' read -r key repository component target release_id source_commit channel; do
            safe_key="${key//\//_}"
            output="$INPUT_ROOT/components/$safe_key"
            mkdir -p "$output"
            report="$output/fetch-report.json"
            python "$PLATFORM_FETCHER" \
              --catalog "$CATALOG_PATH" \
              --component "$component" \
              --target-id "$target" \
              --channel "$channel" \
              --source-commit "$source_commit" \
              --output "$output" > "$report"
            artifact_path="$(python - "$report" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["artifactPath"])
          PY
          )"
            artifact_name="$(basename "$artifact_path")"
            bundle="$output/$artifact_name.attestation.jsonl"
            if [[ "$repository" == "DoHorizon-AI/Cyrene-Platform" ]]; then
              digest="$(sha256sum "$artifact_path" | cut -d ' ' -f 1)"
              (
                cd "$output"
                gh attestation download "$artifact_path" \
                  --repo "$repository" --predicate-type "$PREDICATE_TYPE"
                mv "sha256:$digest.jsonl" "$bundle"
              )
            else
              gh release download "$release_id" --repo "$repository" --dir "$output" \
                --pattern "$artifact_name.attestation.jsonl"
            fi
            test -s "$bundle"
            report_args+=(--fetch-report "$key=$report")
            attestation_args+=(--component-attestation "$key=$bundle")
          done < <(python - "$FETCH_PLAN" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          for row in plan["requests"]:
              print("\t".join((row["key"], row["repository"], row["componentId"], row["targetId"],
                               row["releaseId"], row["sourceCommit"], plan["channel"])))
          PY
          )
          python scripts/native_installer_release.py record-inputs \
            --inputs "$RUNNER_TEMP/native-installer-release-inputs.json" \
            --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT" \
            --catalog "$INPUT_ROOT/component-catalog-v1.json" \
            --catalog-metadata "$INPUT_ROOT/component-catalog-release.json" \
            --catalog-attestation "$INPUT_ROOT/component-catalog-v1.json.attestation.jsonl" \
            --python-runtime-lock packaging/python-runtime.lock.json \
            --release-lock release-lock.json \
            "${report_args[@]}" "${attestation_args[@]}" \
            --output "$INPUT_ROOT/native-installer-source-receipt-v1.json"
          for profile in \
            linux-ubuntu-22.04-x86_64-python-3.12 \
            linux-ubuntu-24.04-x86_64-python-3.12; do
            case "$profile" in
              linux-ubuntu-22.04-*) ubuntu=22.04 ;;
              linux-ubuntu-24.04-*) ubuntu=24.04 ;;
              *) exit 2 ;;
            esac
            service_args=()
            for product in catalyst exchange navigator reactor yield; do
              key="product/$product/$ubuntu"
              safe_key="${key//\//_}"
              service_args+=(--service-report "$key=$INPUT_ROOT/components/$safe_key/fetch-report.json")
              artifact_name="$(python - "$INPUT_ROOT/components/$safe_key/fetch-report.json" <<'PY'
          import json, pathlib, sys
          print(pathlib.Path(json.load(open(sys.argv[1], encoding="utf-8"))["artifactPath"]).name)
          PY
          )"
              service_args+=(--component-attestation "$key=$INPUT_ROOT/components/$safe_key/$artifact_name.attestation.jsonl")
            done
            python scripts/native_installer_release.py stage-service-artifacts \
              --profile "$profile" \
              --source-receipt "$INPUT_ROOT/native-installer-source-receipt-v1.json" \
              --catalog "$INPUT_ROOT/component-catalog-v1.json" \
              "${service_args[@]}" \
              --output "$INPUT_ROOT/verified-service-artifacts/$profile"
          done
      - name: Upload verifier-derived inputs for native profile builds
        uses: actions/upload-artifact@v4
        with:
          name: verified-native-installer-inputs
          path: ${{ runner.temp }}/native-installer-inputs
          if-no-files-found: error
          retention-days: 7

  build-deb:
    name: Build signed-input DEB (${{ matrix.ubuntu }})
    needs: resolve-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            runner: ubuntu-22.04
            target: linux-ubuntu-22.04-x86_64-python-3.12
          - ubuntu: "24.04"
            runner: ubuntu-24.04
            target: linux-ubuntu-24.04-x86_64-python-3.12
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET_PROFILE: ${{ matrix.target }}
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_REF: ${{ github.ref }}
    steps:
      - name: Check out the exact Workspace source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert native Ubuntu target environment
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "$UBUNTU_VERSION"
          test "$(dpkg --print-architecture)" = amd64
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_COMMIT"
      - name: Set up pinned build helper Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"
      - name: Download verifier-derived Product bytes and source receipts
        uses: actions/download-artifact@v4
        with:
          name: verified-native-installer-inputs
          path: ${{ runner.temp }}/native-installer-inputs
      - name: Prepare and validate the locked private Python on this Ubuntu profile
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_ROOT: ${{ runner.temp }}/native-python-prepare
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT"
          python packaging/python_runtime.py prepare \
            --lock packaging/python-runtime.lock.json \
            --release-lock release-lock.json \
            --target-profile "$TARGET_PROFILE" \
            --stage-root "$WORK_ROOT/stage" \
            --work-dir "$WORK_ROOT/work" \
            --json > "$WORK_ROOT/verification.json"
          python - "$WORK_ROOT/verification.json" <<'PY'
          import json, os, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if report.get("targetProfile") != os.environ["TARGET_PROFILE"]:
              raise SystemExit("private Python staging report target differs from this Ubuntu runner")
          for key in ("verifiedArchivePath", "uvExecutable"):
              if not os.path.isfile(report.get(key, "")):
                  raise SystemExit(f"locked private Python build input is missing: {key}")
          print("Verified locked CPython 3.12.14 PBS archive for this native target")
          PY
      - name: Build the DEB from the original verified published Product bytes
        env:
          INPUT_ROOT: ${{ runner.temp }}/native-installer-inputs
          WORK_ROOT: ${{ runner.temp }}/native-python-prepare
        run: |
          set -euo pipefail
          archive="$(python - "$WORK_ROOT/verification.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["verifiedArchivePath"])
          PY
          )"
          uv="$(python - "$WORK_ROOT/verification.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["uvExecutable"])
          PY
          )"
          version="$(python - release-lock.json <<'PY'
          import json, sys
          name = json.load(open(sys.argv[1], encoding="utf-8"))["name"]
          if not name.startswith("cyrene-"):
              raise SystemExit("release lock package name is not canonical")
          print(name.removeprefix("cyrene-"))
          PY
          )"
          output="$RUNNER_TEMP/native-deb-output"
          mkdir -p "$output"
          packaging/build-deb.sh \
            --version "$version" --output "$output" --arch amd64 \
            --target-profile "$TARGET_PROFILE" \
            --python-runtime-archive "$archive" \
            --uv-executable "$uv" \
            --verified-service-artifacts "$INPUT_ROOT/verified-service-artifacts/$TARGET_PROFILE"
          mapfile -t packages < <(find "$output" -maxdepth 1 -type f -name '*.deb' -print)
          test "${#packages[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/native-deb-result"
          cp "${packages[0]}" "$RUNNER_TEMP/native-deb-result/cyrene_${version}_ubuntu-${UBUNTU_VERSION}_amd64.deb"
      - name: Upload the profile DEB output
        uses: actions/upload-artifact@v4
        with:
          name: native-installer-deb-ubuntu-${{ matrix.ubuntu }}
          path: ${{ runner.temp }}/native-deb-result/*.deb
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Attest and publish the immutable dual-target release
    needs: [resolve-inputs, build-deb]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      PREDICATE_TYPE: https://slsa.dev/provenance/v1
    steps:
      - name: Check out the exact Workspace source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned release helper Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"
      - name: Install pinned catalog validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0" "referencing==0.37.0"
      - name: Download verified source inputs and both Ubuntu DEBs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-release/inputs" "$RUNNER_TEMP/native-release/ubuntu-22.04" "$RUNNER_TEMP/native-release/ubuntu-24.04"
          gh run download "$WORKFLOW_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name verified-native-installer-inputs --dir "$RUNNER_TEMP/native-release/inputs"
          gh run download "$WORKFLOW_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name native-installer-deb-ubuntu-22.04 --dir "$RUNNER_TEMP/native-release/ubuntu-22.04"
          gh run download "$WORKFLOW_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name native-installer-deb-ubuntu-24.04 --dir "$RUNNER_TEMP/native-release/ubuntu-24.04"
      - name: Assemble exact source receipt, safe-init evidence, and SHA manifest
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/native-release/inputs"
          deb22=("$RUNNER_TEMP/native-release/ubuntu-22.04"/*.deb)
          deb24=("$RUNNER_TEMP/native-release/ubuntu-24.04"/*.deb)
          test "${#deb22[@]}" -eq 1
          test "${#deb24[@]}" -eq 1
          channel=stable
          [[ "$SOURCE_REF" == refs/heads/develop ]] && channel=preview
          version="$(python - release-lock.json <<'PY'
          import json, sys
          name = json.load(open(sys.argv[1], encoding="utf-8"))["name"]
          if not name.startswith("cyrene-"):
              raise SystemExit("release lock package name is not canonical")
          print(name.removeprefix("cyrene-"))
          PY
          )"
          python scripts/native_installer_release.py assemble \
            --release-id "native-installer-$channel-$SOURCE_COMMIT" \
            --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT" \
            --source-receipt "$inputs/native-installer-source-receipt-v1.json" \
            --catalog "$inputs/component-catalog-v1.json" \
            --catalog-attestation "$inputs/component-catalog-v1.json.attestation.jsonl" \
            --python-runtime-lock packaging/python-runtime.lock.json \
            --release-lock release-lock.json \
            --version "$version" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --deb-22 "${deb22[0]}" --deb-24 "${deb24[0]}" \
            --output "$RUNNER_TEMP/native-release/publish"
      - name: Create SLSA attestations for every Workspace release subject
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/native-release/publish"
          (
            cd "$release_dir"
            sha256sum \
              SHA256SUMS \
              native-installer-release-v1.json \
              native-installer-source-receipt-v1.json \
              python-runtime.lock.json release-lock.json \
              cyrene_*.deb > "$release_dir/.native-release-subjects.sha256"
          )
      - uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/native-release/publish/.native-release-subjects.sha256
      - name: Save and verify detached Workspace attestation bundles
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/native-release/publish"
          rm -f "$release_dir/.native-release-subjects.sha256"
          cd "$release_dir"
          for subject in \
            SHA256SUMS native-installer-release-v1.json native-installer-source-receipt-v1.json \
            python-runtime.lock.json release-lock.json cyrene_*.deb; do
            [[ -f "$subject" ]] || continue
            digest="sha256:$(sha256sum "$subject" | cut -d ' ' -f 1)"
            gh attestation download "$subject" --repo "$GITHUB_REPOSITORY" --predicate-type "$PREDICATE_TYPE"
            mv "$digest.jsonl" "$subject.attestation.jsonl"
          done
          python "$GITHUB_WORKSPACE/scripts/native_installer_release.py" verify \
            --directory "$release_dir" --expected-repository "$GITHUB_REPOSITORY" \
            --expected-source-ref "$SOURCE_REF" --expected-source-commit "$SOURCE_COMMIT"
      - name: Check immutable release settings and create the exact source tag
        env:
          CYRENE_IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.CYRENE_IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/native_installer_release.py preflight \
            --inputs "$RUNNER_TEMP/native-release/inputs/validated-locators.json" \
            --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT"
      - name: Publish using the created release database ID
        env:
          CYRENE_IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.CYRENE_IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/native_installer_release.py publish \
            --directory "$RUNNER_TEMP/native-release/publish" \
            --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT"
      - name: Download the published immutable release and verify its offline envelope
        run: |
          set -euo pipefail
          channel=stable
          [[ "$SOURCE_REF" == refs/heads/develop ]] && channel=preview
          release_id="native-installer-$channel-$SOURCE_COMMIT"
          destination="$RUNNER_TEMP/native-release/published-download"
          mkdir -p "$destination"
          downloaded=false
          for attempt in 1 2 3 4; do
            if gh release download "$release_id" --repo "$GITHUB_REPOSITORY" --dir "$destination"; then
              downloaded=true
              break
            fi
            rm -f "$destination"/*
            sleep "$attempt"
          done
          test "$downloaded" = true
          python scripts/native_installer_release.py verify \
            --directory "$destination" --expected-repository "$GITHUB_REPOSITORY" \
            --expected-source-ref "$SOURCE_REF" --expected-source-commit "$SOURCE_COMMIT"
          test "$(gh release view "$release_id" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable --jq '.isDraft == false and .isImmutable == true')" = true
