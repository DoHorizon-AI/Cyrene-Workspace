name: Teams cloud ARM64 Azure CD bridge

on:
  workflow_dispatch:
    inputs:
      publisher_run_id:
        description: Exact successful Teams cloud release workflow run ID
        required: true
        type: number
      publisher_run_attempt:
        description: Exact attempt number for that release run
        required: true
        type: number
      publisher_head_sha:
        description: Full source commit SHA recorded by that release run
        required: true
        type: string
      publisher_event:
        description: Event that produced the release run
        required: true
        type: choice
        options:
          - workflow_run
          - schedule
          - workflow_dispatch

permissions:
  actions: read
  contents: read

concurrency:
  group: teams-cloud-arm64-azure-cd-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  forward-verified-release:
    if: >-
      github.repository == 'DoHorizon-AI/Cyrene-Workspace' &&
      github.event_name == 'workflow_dispatch' &&
      vars.CYRENE_TEAMS_AZDO_CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the trusted integration-branch bridge
        uses: actions/checkout@v5
        with:
          ref: develop
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify the exact publisher attempt and forward its immutable proof
        env:
          GH_TOKEN: ${{ github.token }}
          CYRENE_TEAMS_AZDO_WEBHOOK_SECRET: ${{ secrets.CYRENE_TEAMS_AZDO_WEBHOOK_SECRET }}
          PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
          PUBLISHER_RUN_ATTEMPT: ${{ inputs.publisher_run_attempt }}
          PUBLISHER_HEAD_SHA: ${{ inputs.publisher_head_sha }}
          PUBLISHER_EVENT: ${{ inputs.publisher_event }}
        run: |
          set -euo pipefail
          python3 tooling/deploy/teams-cloud/azure_cd.py bridge \
            --run-id "$PUBLISHER_RUN_ID" \
            --run-attempt "$PUBLISHER_RUN_ATTEMPT" \
            --head-sha "$PUBLISHER_HEAD_SHA" \
            --event "$PUBLISHER_EVENT"
